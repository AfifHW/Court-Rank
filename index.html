      const items = preview?.matches || [];
      const playableNow = items.filter(m => m.court).length;
      return (
        <div style={{ position: "fixed", inset: 0, background: "#000000dd", zIndex: 1500, display: "flex", alignItems: "flex-end", justifyContent: "center" }} onClick={onClose}>
          <div className="cr-glass-modal" style={{ background: "#FFFFFF", borderRadius: "28px 28px 0 0", padding: 20, width: "100%", maxWidth: 430, border: "2px solid #16232E", maxHeight: "88vh", overflowY: "auto" }} onClick={e => e.stopPropagation()}>
            <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12, marginBottom: 12 }}>
              <div>
                <div style={{ fontSize: 17, fontWeight: 900, color: "#16232E", fontFamily: "'Space Grotesk', sans-serif" }}>🔄 Auto Rounds</div>
                <div style={{ fontSize: 12, color: "#617181", marginTop: 2 }}>Preview semua pemain check-in. Bisa di-shuffle ulang sebelum dipakai.</div>
              </div>
              <div style={{ fontSize: 11, fontWeight: 800, color: "#16232E", background: "#F0B42935", border: "1px solid #F0B42980", borderRadius: 999, padding: "5px 9px", whiteSpace: "nowrap" }}>{items.length} match</div>
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 14 }}>
              {items.map((m, idx) => {
                const fakeMatch = { team1: m.team1, team2: m.team2, games: [{ t1: 0, t2: 0 }], tierSnapshot: {} };
                return (
                  <div key={`${m.court}-${idx}`} style={{ background: "#FAF7F2", border: "2px solid #16232E", borderRadius: 18, padding: "12px", boxShadow: "3px 3px 0 #16232E" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                      <div style={{ fontSize: 13, fontWeight: 900, color: "#16232E" }}>Match {m.scheduleNo || idx + 1}</div>
                      <div style={{ display: "flex", gap: 6, alignItems: "center" }}><div style={{ fontSize: 10, fontWeight: 850, color: m.court ? "#16232E" : "#617181", background: m.court ? "#16232E12" : "#16232E08", border: "1px solid #16232E30", borderRadius: 999, padding: "3px 8px" }}>{m.court ? `Lapangan ${m.court}` : "Menunggu"}</div><div style={{ fontSize: 10, fontWeight: 850, color: m.mode === "single" ? "#3A7BD5" : "#E4574F", background: m.mode === "single" ? "#3A7BD515" : "#E4574F15", border: `1px solid ${m.mode === "single" ? "#3A7BD555" : "#E4574F55"}`, borderRadius: 999, padding: "3px 8px" }}>{modeLabel(m.mode)}</div></div>
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 34px 1fr", gap: 8, alignItems: "center" }}>
                      <div style={{ minWidth: 0, fontSize: 13, fontWeight: 850, color: "#16232E", lineHeight: 1.25 }}>{teamNames(m.team1)}</div>
                      <div style={{ textAlign: "center", fontSize: 11, fontWeight: 900, color: "#617181" }}>VS</div>
                      <div style={{ minWidth: 0, textAlign: "right", fontSize: 13, fontWeight: 850, color: "#16232E", lineHeight: 1.25 }}>{teamNames(m.team2)}</div>
                    </div>
                    <TierMatchStatus match={fakeMatch} players={players} compact />
                  </div>
                );
              })}
            </div>

            <div style={{ fontSize: 11, color: "#617181", margin: "-2px 0 12px", lineHeight: 1.4 }}>{playableNow === 0 ? "Belum ada lapangan kosong. Jadwal bisa dipakai nanti saat lapangan kosong." : (items.length > playableNow ? `${playableNow} match pertama bisa langsung masuk lapangan. ${items.length - playableNow} match lain jadi jadwal berikutnya.` : "Semua match di ronde ini bisa langsung masuk lapangan.")}</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1.35fr", gap: 10 }}>
              <button onClick={onShuffle} style={{ minHeight: 48, padding: "12px", background: "#FFFFFF", border: "2px solid #16232E", borderRadius: 16, color: "#44515E", fontWeight: 850, fontSize: 13, cursor: "pointer" }}>🔀 Acak Ulang</button>
              <button onClick={() => onConfirm(items)} style={{ minHeight: 48, padding: "12px", background: "#E4574F", border: "2px solid #E4574F", borderRadius: 16, color: "#fff", fontWeight: 900, fontSize: 14, cursor: "pointer" }}>✅ Masuk Lapangan</button>
            </div>
          </div>
        </div>
      );
    }

    // ===== PLAYER STATS SCREEN =====
    function PlayerStatsScreen({ player, players, matches, sessions, currentSessionId, initialMode = "alltime", showModeSwitch = false, onBack }) {
      const [mode, setMode] = React.useState(initialMode); // "alltime" | "session"
      const [trendRange, setTrendRange] = React.useState(12); // 12 | 24 | "all"
      const [playerStatsShareBusy, setPlayerStatsShareBusy] = React.useState(null);
      const playerStatsRef = React.useRef(null);
      React.useEffect(() => setMode(initialMode), [initialMode, player.id]);
      const getPlayer = id => players.find(p => p.id === id);

      const getPlayerStatsBlob = async () => {
        const el = playerStatsRef.current;
        if (!el || !window.html2canvas) throw new Error("Statistik pemain belum siap");
        const originalCss = el.style.cssText;
        el.style.width = "430px";
        el.style.maxWidth = "430px";
        const canvas = await window.html2canvas(el, { backgroundColor: "#FAF7F2", scale: 2, useCORS: true });
        el.style.cssText = originalCss;
        return new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.9));
      };

      const handleDownloadPlayerStats = async () => {
        setPlayerStatsShareBusy("download");
        try {
          const blob = await getPlayerStatsBlob();
          const safeName = player.name.replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "") || "Pemain";
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `Statistik-${safeName}-CourtRank-${new Date().toISOString().slice(0, 10)}.jpg`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch (e) {
          console.error(e);
        }
        setPlayerStatsShareBusy(null);
      };

      const handleSharePlayerStatsWA = async () => {
        setPlayerStatsShareBusy("share");
        try {
          const blob = await getPlayerStatsBlob();
          const file = new File([blob], "statistik-pemain.jpg", { type: "image/jpeg" });
          const modeLabel = mode === "alltime" ? "All Time" : "Sesi Ini";
          let textMsg = `📊 *STATISTIK PEMAIN COURTRANK*\n\n`;
          textMsg += `${player.name} · Tier ${player.tier} · ${modeLabel}\n`;
          textMsg += `${stats.total} match · ${stats.wins}W ${stats.draws}D ${stats.losses}L\n`;
          textMsg += `Win Rate ${stats.winRate}% · ${stats.totalPts} pts · Diff ${stats.totalFor - stats.totalAgainst >= 0 ? "+" : ""}${stats.totalFor - stats.totalAgainst}`;
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ title: `Statistik ${player.name}`, text: textMsg, files: [file] });
          } else {
            window.open(`https://wa.me/?text=${encodeURIComponent(textMsg)}`, "_blank");
          }
        } catch (e) {
          if (e.name !== "AbortError") console.error(e);
        }
        setPlayerStatsShareBusy(null);
      };

      const computeStats = (pid, matchPool) => {
        const done = matchPool.filter(m => m.status === "done" && [...m.team1,...m.team2].includes(pid));
        const sorted = [...done].sort((a,b) => a.id.localeCompare(b.id));

        let wins=0, losses=0, draws=0, totalFor=0, totalAgainst=0, totalPts=0, totalR=0;
        let streak=0, streakType=null, maxWin=0, maxLose=0, curWin=0, curLose=0;
        const opponentStats={}, partnerStats={}, tierStats={};

        sorted.forEach(m => {
          const onT1 = m.team1.includes(pid);
          const myTeam = onT1 ? m.team1 : m.team2;
          const oppTeam = onT1 ? m.team2 : m.team1;
          const res = calcMatchResult(m, players);
          const won = onT1 ? res.t1Win : res.t2Win;
          const lost = onT1 ? res.t2Win : res.t1Win;
          const myScore = onT1 ? res.t1Score : res.t2Score;
          const oppScore = onT1 ? res.t2Score : res.t1Score;
          const S = onT1 ? res.t1S : res.t2S;
          const R = onT1 ? res.t1R : res.t2R;

          totalFor += myScore; totalAgainst += oppScore;
          totalPts += myScore + S + R; totalR += R;
          if (won) { wins++; curWin++; curLose=0; maxWin=Math.max(maxWin,curWin); streak=streakType==="W"?streak+1:1; streakType="W"; }
          else if (lost) { losses++; curLose++; curWin=0; maxLose=Math.max(maxLose,curLose); streak=streakType==="L"?streak+1:1; streakType="L"; }
          else { draws++; curWin=0; curLose=0; streak=0; streakType=null; }

          oppTeam.forEach(oid => {
            if (!opponentStats[oid]) opponentStats[oid] = {w:0,l:0,d:0};
            if (won) opponentStats[oid].w++; else if (lost) opponentStats[oid].l++; else opponentStats[oid].d++;
            const oppTier = (m.tierSnapshot&&m.tierSnapshot[oid]) || getPlayer(oid)?.tier || "E";
            if (!tierStats[oppTier]) tierStats[oppTier] = {w:0,l:0};
            if (won) tierStats[oppTier].w++; else if (lost) tierStats[oppTier].l++;
          });
          myTeam.filter(id=>id!==pid).forEach(pid2 => {
            if (!partnerStats[pid2]) partnerStats[pid2] = {w:0,l:0};
            if (won) partnerStats[pid2].w++; else if (lost) partnerStats[pid2].l++;
          });
        });

        const total = wins+losses+draws;
        const winRate = total > 0 ? Math.round((wins/total)*100) : 0;
        const avgScore = total > 0 ? (totalFor/total).toFixed(1) : "0";
        const avgAgainst = total > 0 ? (totalAgainst/total).toFixed(1) : "0";
        const bestPartner = Object.entries(partnerStats).sort((a,b)=>b[1].w-a[1].w)[0];
        const nemesis = Object.entries(opponentStats).sort((a,b)=>b[1].l-a[1].l)[0];
        const favorite = Object.entries(opponentStats).sort((a,b)=>b[1].w-a[1].w)[0];

        // Tren poin per sesi
        const sessTrend = sessions.map(sess => {
          const sm = done.filter(m => m.sessionId===sess.id || (!m.sessionId&&sess.id===sessions[0]?.id));
          if (!sm.length) return null;
          let pts=0, w=0, l=0;
          sm.forEach(m => {
            const onT1=m.team1.includes(pid);
            const res=calcMatchResult(m,players);
            const S=onT1?res.t1S:res.t2S; const R=onT1?res.t1R:res.t2R;
            pts += (onT1?res.t1Score:res.t2Score)+S+R;
            if (onT1?res.t1Win:res.t2Win) w++; else if (onT1?res.t2Win:res.t1Win) l++;
          });
          return { label: sess.label, pts, w, l, matchCount: sm.length };
        }).filter(Boolean);

        return { total, wins, losses, draws, winRate, avgScore, avgAgainst, totalFor, totalAgainst, totalPts, totalR,
                 streak, streakType, maxWin, maxLose, opponentStats, partnerStats, tierStats,
                 bestPartner, nemesis, favorite, sessTrend };
      };

      const allMatches = matches;
      const sessMatches = matches.filter(m => m.sessionId===currentSessionId || (!m.sessionId&&sessions[0]?.id===currentSessionId));
      const stats = mode === "alltime" ? computeStats(player.id, allMatches) : computeStats(player.id, sessMatches);
      const pid = player.id;
      const tierHistory = (player.tierHistory||[]).filter(h=>h.type!=="init");

      const StatBox = ({label, value, sub, color="#16232E"}) => (
        <div style={{flex:1, background:"#FFFFFF", border:"1px solid #16232E0a", borderRadius:10, padding:"12px 10px", textAlign:"center"}}>
          <div style={{fontSize:22, fontWeight:800, color, fontFamily:"'DM Mono',monospace"}}>{value}</div>
          <div style={{fontSize:10, color:"#617181", marginTop:2}}>{label}</div>
          {sub && <div style={{fontSize:10, color:"#778899", marginTop:1}}>{sub}</div>}
        </div>
      );
      const diffTotal = stats.totalFor - stats.totalAgainst;
      const diffAvg = stats.total > 0 ? diffTotal / stats.total : 0;
      const signed = (n, digits = 0) => `${n >= 0 ? "+" : ""}${digits > 0 ? n.toFixed(digits) : n}`;

      return (
        <div style={{minHeight:"100vh", background:"#FAF7F2", color:"#16232E", maxWidth:430, margin:"0 auto"}}>
          {/* Header */}
          <div style={{background:"linear-gradient(135deg,#FFFFFF,#FAF7F2)", borderBottom:"1px solid #16232E18", padding:"16px 20px 0"}}>
            <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:12}}>
              <button onClick={onBack} style={{background:"#16232E10", border:"none", borderRadius:8, padding:"6px 10px", color:"#44515E", fontSize:13, cursor:"pointer"}}>←</button>
              <div style={{width:38, height:38, borderRadius:10, background:"linear-gradient(135deg,#E4574F30,#E4574F30)", border:"1px solid #E4574F60", display:"flex", alignItems:"center", justifyContent:"center", fontSize:15, fontWeight:800, color:"#E4574F"}}>{player.name.slice(0,2).toUpperCase()}</div>
              <div style={{flex:1}}>
                <div style={{fontWeight:800, fontSize:16}}>{player.name}</div>
                <div style={{fontSize:11, color:"#44515E", display:"flex", alignItems:"center", gap:6}}><TierBadge tier={player.tier} small /> {stats.total} match dimainkan</div>
              </div>
            </div>
            {showModeSwitch && (
              <div style={{display:"flex", background:"#FAF7F2", borderRadius:10, padding:3, marginBottom:12, border:"1px solid #16232E10"}}>
                {[["alltime","🏆 All Time"],["session","📅 Sesi Ini"]].map(([k,l])=>(
                  <button key={k} onClick={()=>setMode(k)} style={{flex:1, padding:"7px 0", borderRadius:8, border:"none", cursor:"pointer", fontWeight:700, fontSize:12, background:mode===k?"#E4574F":"none", color:mode===k?"#fff":"#617181", fontFamily:"'DM Sans', sans-serif"}}>{l}</button>
                ))}
              </div>
            )}
          </div>

          <div style={{padding:"12px 16px 0", display:"flex", gap:8}}>
            <button onClick={handleDownloadPlayerStats} disabled={playerStatsShareBusy !== null} style={{flex:1, background:"#FFFFFF", border:"2px solid #16232E", borderRadius:16, padding:"12px 10px", cursor:playerStatsShareBusy !== null ? "default" : "pointer", color:"#44515E", fontWeight:800, fontSize:12, fontFamily:"'DM Sans', sans-serif"}}>{playerStatsShareBusy === "download" ? "⏳" : "💾"} Simpan Gambar</button>
            <button onClick={handleSharePlayerStatsWA} disabled={playerStatsShareBusy !== null} style={{flex:1, background:playerStatsShareBusy === "share" ? "#778899" : "#16232E", border:"2px solid #16232E", borderRadius:16, padding:"12px 10px", cursor:playerStatsShareBusy !== null ? "default" : "pointer", color:"#fff", fontWeight:800, fontSize:12, fontFamily:"'DM Sans', sans-serif"}}>{playerStatsShareBusy === "share" ? "⏳" : "💬"} Kirim WA</button>
          </div>

          <div ref={playerStatsRef} id="player-stats-board" style={{padding:"16px 16px 40px", display:"flex", flexDirection:"column", gap:14, background:"#FAF7F2"}}>

            <div style={{background:"#FFFFFF", border:"2px solid #16232E", borderRadius:18, padding:"12px 14px", boxShadow:"6px 8px 0 #16232E"}}>
              <div style={{fontSize:10, color:"#617181", fontWeight:800, letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:4}}>Statistik Pemain · {mode === "alltime" ? "All Time" : "Sesi Ini"}</div>
              <div style={{display:"flex", alignItems:"center", gap:8}}>
                <div style={{fontFamily:"'Space Grotesk', sans-serif", fontStyle:"italic", fontWeight:700, fontSize:24, color:"#E4574F", textTransform:"uppercase", flex:1}}>{player.name}</div>
                <TierBadge tier={player.tier} />
              </div>
              <div style={{fontSize:11, color:"#44515E", marginTop:4}}>{stats.total} match dimainkan · {stats.wins}W {stats.draws}D {stats.losses}L</div>
            </div>

            {/* Overview boxes */}
            <div style={{display:"flex", gap:8}}>
              <StatBox label="Win Rate" value={`${stats.winRate}%`} sub={`${stats.wins}W ${stats.losses}L`} color={stats.winRate>=50?"#16232E":"#E4574F"} />
              <StatBox label="Total Poin" value={stats.totalPts} sub={`+${stats.totalR}R underdog`} color="#E4574F" />
              <StatBox label="rata point/match" value={stats.avgScore} sub={`${stats.avgAgainst} kehilangan point/match`} />
            </div>
            <div style={{display:"flex", gap:8}}>
              <StatBox label="Match" value={stats.total} sub={`${stats.wins}W ${stats.draws}D ${stats.losses}L`} />
              <StatBox label="Avg Menang" value={stats.total>0?`${Math.round((stats.wins/stats.total)*100)}%`:"—"} sub="per match" color="#9A6A00" />
              <StatBox label="Selisih Poin" value={signed(diffTotal)} color={diffTotal>=0?"#16232E":"#E4574F"} sub={`Total dari ${stats.total} match`} />
            </div>

            {/* Streak */}
            {stats.total > 0 && (
              <div style={{background:stats.streakType==="W"?"#16232E12":"#E4574F12", border:`1px solid ${stats.streakType==="W"?"#16232E25":"#E4574F25"}`, borderRadius:12, padding:"12px 16px", display:"flex", alignItems:"center", gap:12}}>
                <span style={{fontSize:28}}>{stats.streakType==="W"?"🔥":"🧊"}</span>
                <div>
                  <div style={{fontSize:14, fontWeight:700, color:stats.streakType==="W"?"#16232E":"#E4574F"}}>
                    {stats.streak > 0 && stats.streakType ? `${stats.streak} ${stats.streakType==="W"?"Menang":"Kalah"} Beruntun` : "Belum ada streak"}
                  </div>
                  <div style={{fontSize:11, color:"#617181"}}>Best: 🏆{stats.maxWin} menang · 😢{stats.maxLose} kalah beruntun</div>
                </div>
              </div>
            )}

            {/* Tren poin per sesi */}
            {stats.sessTrend.length > 0 && (
              <div style={{background:"#FFFFFF", border:"1px solid #16232E0a", borderRadius:12, padding:14}}>
                <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:10, marginBottom:10}}>
                  <div>
                    <div style={{fontSize:11, fontWeight:700, color:"#617181", letterSpacing:"0.06em"}}>📈 TREN POIN PER SESI</div>
                    {stats.sessTrend.length > 1 && (
                      <div style={{fontSize:10, color:"#778899", marginTop:2}}>
                        {trendRange === "all" ? "All Time" : `${Math.min(trendRange, stats.sessTrend.length)} sesi terakhir`} dari {stats.sessTrend.length} sesi tercatat
                      </div>
                    )}
                  </div>
                  {stats.sessTrend.length > 12 && (
                    <div style={{display:"flex", gap:4, background:"#FAF7F2", border:"1px solid #16232E14", borderRadius:8, padding:3}}>
                      {[[12,"12"],[24,"24"],["all","Semua"]].map(([value,label]) => (
                        <button key={label} onClick={() => setTrendRange(value)} style={{border:"none", borderRadius:6, padding:"5px 8px", background:trendRange===value?"#E4574F":"transparent", color:trendRange===value?"#fff":"#44515E", fontSize:10, fontWeight:700, cursor:"pointer"}}>{label}</button>
                      ))}
                    </div>
                  )}
                </div>
                {stats.sessTrend.length === 1 ? (
                  <div style={{fontSize:12, color:"#778899", textAlign:"center", padding:"8px 0"}}>Butuh minimal 2 sesi untuk melihat tren</div>
                ) : (
                  <div>
                    {(() => {
                      const visibleTrend = trendRange === "all" ? stats.sessTrend : stats.sessTrend.slice(-trendRange);
                      const maxPts = Math.max(...visibleTrend.map(s=>s.pts),1);
                      const first = visibleTrend[0];
                      const last = visibleTrend[visibleTrend.length-1];
                      const best = visibleTrend.reduce((top, s) => s.pts > top.pts ? s : top, first);
                      const delta = last.pts - first.pts;
                      const labelStep = visibleTrend.length > 36 ? 10 : visibleTrend.length > 24 ? 5 : visibleTrend.length > 12 ? 3 : 1;
                      return (
                        <>
                          <div style={{display:"flex", gap:8, marginBottom:10}}>
                            <div style={{flex:1, background:"#FAF7F2", border:"1px solid #16232E14", borderRadius:8, padding:"7px 9px"}}>
                              <div style={{fontSize:9, color:"#778899", fontWeight:700, letterSpacing:"0.05em"}}>PERUBAHAN</div>
                              <div style={{fontSize:14, color:delta>0?"#16232E":delta<0?"#E4574F":"#44515E", fontWeight:800}}>{delta>0?`+${delta}`:delta} pts</div>
                            </div>
                            <div style={{flex:1, background:"#FAF7F2", border:"1px solid #16232E14", borderRadius:8, padding:"7px 9px"}}>
                              <div style={{fontSize:9, color:"#778899", fontWeight:700, letterSpacing:"0.05em"}}>TERTINGGI</div>
                              <div style={{fontSize:14, color:"#16232E", fontWeight:800}}>{best.pts} <span style={{fontSize:10, color:"#617181", fontWeight:600}}>{best.label.replace("Sesi ","S")}</span></div>
                            </div>
                          </div>
                          <div style={{display:"flex", gap:3, alignItems:"flex-end", height:66, marginBottom:6}}>
                            {visibleTrend.map((s,i)=>{
                              const originalIndex = stats.sessTrend.length - visibleTrend.length + i;
                              const isLast = originalIndex===stats.sessTrend.length-1;
                              const prev = originalIndex>0?stats.sessTrend[originalIndex-1]:null;
                              const trend = prev ? (s.pts>prev.pts?"up":s.pts<prev.pts?"down":"flat") : "flat";
                              const showLabel = i===0 || i===visibleTrend.length-1 || i % labelStep === 0;
                              const barColor = isLast ? "linear-gradient(180deg,#E4574F,#E4574F)" : trend==="up"?"#16232E60":trend==="down"?"#E4574F60":"#16232E20";
                              return (
                                <div key={`${s.label}-${i}`} title={`${s.label}: ${s.pts} pts`} style={{flex:1, minWidth:trendRange==="all"?3:6, display:"flex", flexDirection:"column", alignItems:"center", gap:2}}>
                                  {(visibleTrend.length <= 24 || isLast || s.pts === best.pts) && <div style={{fontSize:8, color:"#617181", minHeight:10}}>{s.pts}</div>}
                                  <div style={{width:"100%", height:`${Math.max(6,(s.pts/maxPts)*48)}px`, background:barColor, borderRadius:"3px 3px 0 0"}} />
                                  <div style={{fontSize:8, color:showLabel?"#778899":"transparent", textAlign:"center", lineHeight:1, minHeight:9}}>{s.label.replace("Sesi ","S")}</div>
                                </div>
                              );
                            })}
                          </div>
                        </>
                      );
                    })()}
                    <div style={{display:"flex", gap:10, justifyContent:"center", marginTop:4}}>
                      {[["#16232E60","Naik"],["#E4574F60","Turun"],["linear-gradient(180deg,#E4574F,#E4574F)","Terkini"]].map(([c,l])=>(
                        <div key={l} style={{display:"flex", alignItems:"center", gap:4, fontSize:10, color:"#617181"}}>
                          <div style={{width:8, height:8, borderRadius:2, background:c}} />{l}
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* Win rate vs tier */}
            {Object.keys(stats.tierStats).length > 0 && (
              <div style={{background:"#FFFFFF", border:"1px solid #16232E0a", borderRadius:12, padding:14}}>
                <div style={{fontSize:11, fontWeight:700, color:"#617181", letterSpacing:"0.06em", marginBottom:10}}>📊 WIN RATE VS TIER</div>
                <div style={{display:"flex", flexDirection:"column", gap:7}}>
                  {Object.entries(TIER_WEIGHT).filter(([t])=>stats.tierStats[t]).map(([tier])=>{
                    const ts = stats.tierStats[tier];
                    const tot = ts.w+ts.l;
                    const pct = tot>0?Math.round((ts.w/tot)*100):0;
                    const c = TIER_COLORS[tier];
                    return (
                      <div key={tier} style={{display:"flex", alignItems:"center", gap:8}}>
                        <span style={{fontSize:11, background:c.bg, color:c.text, border:`1px solid ${c.border}`, borderRadius:4, padding:"1px 6px", minWidth:28, textAlign:"center", fontWeight:700}}>Tier {tier}</span>
                        <div style={{flex:1, height:8, background:"#FAF7F2", borderRadius:99, overflow:"hidden"}}>
                          <div style={{height:"100%", width:`${pct}%`, background:pct>=50?"#16232E":"#E4574F", borderRadius:99, transition:"width 0.5s"}} />
                        </div>
                        <span style={{fontSize:12, color:pct>=50?"#16232E":"#E4574F", fontWeight:700, minWidth:36, textAlign:"right"}}>{pct}%</span>
                        <span style={{fontSize:10, color:"#778899", minWidth:44}}>{ts.w}W {ts.l}L</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Highlights: Partner, Nemesis, Mangsa */}
            {(stats.bestPartner||stats.nemesis||stats.favorite) && (
              <div style={{display:"flex", flexDirection:"column", gap:8}}>
                <div style={{fontSize:11, fontWeight:700, color:"#617181", letterSpacing:"0.06em"}}>🎖 HIGHLIGHTS</div>
                {stats.bestPartner && (
                  <div style={{background:"#16232E12", border:"1px solid #16232E25", borderRadius:18, padding:"10px 14px", display:"flex", alignItems:"center", gap:10}}>
                    <span style={{fontSize:20}}>🤝</span>
                    <div style={{flex:1}}>
                      <div style={{fontSize:11, color:"#16232E", fontWeight:700}}>PARTNER TERBAIK</div>
                      <div style={{fontSize:14, fontWeight:700, color:"#16232E"}}>{getPlayer(parseInt(stats.bestPartner[0]))?.name||"?"}</div>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div style={{fontSize:13, fontWeight:700, color:"#16232E"}}>{stats.bestPartner[1].w}W</div>
                      <div style={{fontSize:10, color:"#617181"}}>{stats.bestPartner[1].l}L bersama</div>
                    </div>
                  </div>
                )}
                {stats.nemesis && stats.nemesis[1].l > 0 && (
                  <div style={{background:"#ef444412", border:"1px solid #ef444425", borderRadius:18, padding:"10px 14px", display:"flex", alignItems:"center", gap:10}}>
                    <span style={{fontSize:20}}>😤</span>
                    <div style={{flex:1}}>
                      <div style={{fontSize:11, color:"#E4574F", fontWeight:700}}>MUSUH BEBUYUTAN</div>
                      <div style={{fontSize:14, fontWeight:700, color:"#16232E"}}>{getPlayer(parseInt(stats.nemesis[0]))?.name||"?"}</div>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div style={{fontSize:13, fontWeight:700, color:"#E4574F"}}>Kalah {stats.nemesis[1].l}x</div>
                      <div style={{fontSize:10, color:"#617181"}}>Menang {stats.nemesis[1].w}x</div>
                    </div>
                  </div>
                )}
                {stats.favorite && stats.favorite[1].w > 0 && (
                  <div style={{background:"#F0B42912", border:"1px solid #F0B42925", borderRadius:18, padding:"10px 14px", display:"flex", alignItems:"center", gap:10}}>
                    <span style={{fontSize:20}}>🎯</span>
                    <div style={{flex:1}}>
                      <div style={{fontSize:11, color:"#9A6A00", fontWeight:700}}>MANGSA EMPUK</div>
                      <div style={{fontSize:14, fontWeight:700, color:"#16232E"}}>{getPlayer(parseInt(stats.favorite[0]))?.name||"?"}</div>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div style={{fontSize:13, fontWeight:700, color:"#9A6A00"}}>Menang {stats.favorite[1].w}x</div>
                      <div style={{fontSize:10, color:"#617181"}}>Kalah {stats.favorite[1].l}x</div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* Riwayat Tier */}
            {tierHistory.length > 0 && (
              <div style={{background:"#FFFFFF", border:"1px solid #16232E0a", borderRadius:12, padding:14}}>
                <div style={{fontSize:11, fontWeight:700, color:"#617181", letterSpacing:"0.06em", marginBottom:8}}>📋 RIWAYAT TIER</div>
                {tierHistory.map((h,i)=>(
                  <div key={i} style={{display:"flex", alignItems:"center", gap:8, padding:"6px 0", borderBottom:i<tierHistory.length-1?"1px solid #16232E08":"none"}}>
                    <span style={{fontSize:13}}>{(h.type==="naik"||h.type==="resmi")?"🚀":"🔧"}</span>
                    <span style={{fontFamily:"'DM Mono',monospace", fontSize:12, color:(h.type==="naik"||h.type==="resmi")?"#E4574F":"#9A6A00", fontWeight:700}}>{h.from}→{h.to}</span>
                    <span style={{fontSize:12, color:"#16232E", flex:1}}>{h.sessionLabel}</span>
                    <span style={{fontSize:11, color:"#778899"}}>{h.date}</span>
                  </div>
                ))}
              </div>
            )}

            {/* H2H Rekor Lawan */}
            {Object.keys(stats.opponentStats).length > 0 && (
              <div style={{background:"#FFFFFF", border:"1px solid #16232E0a", borderRadius:12, padding:14}}>
                <div style={{fontSize:11, fontWeight:700, color:"#617181", letterSpacing:"0.06em", marginBottom:8}}>⚔️ REKOR LAWAN</div>
                {Object.entries(stats.opponentStats).sort((a,b)=>(b[1].w+b[1].l)-(a[1].w+a[1].l)).map(([oid, stat])=>{
                  const opp = getPlayer(parseInt(oid));
                  if (!opp) return null;
                  const tot = stat.w+stat.l+stat.d;
                  const pct = tot>0?Math.round((stat.w/tot)*100):0;
                  return (
                    <div key={oid} style={{display:"flex", alignItems:"center", gap:8, padding:"7px 0", borderBottom:"1px solid #16232E06"}}>
                      <TierBadge tier={opp.tier} small />
                      <span style={{flex:1, fontSize:13, color:"#16232E", fontWeight:500}}>{opp.name}</span>
                      <span style={{fontSize:12, color:"#16232E", fontFamily:"'DM Mono',monospace"}}>{stat.w}W</span>
                      {stat.d>0&&<span style={{fontSize:12, color:"#9A6A00", fontFamily:"'DM Mono',monospace"}}>{stat.d}D</span>}
                      <span style={{fontSize:12, color:"#E4574F", fontFamily:"'DM Mono',monospace"}}>{stat.l}L</span>
                      <span style={{fontSize:11, color:pct>=50?"#16232E":"#E4574F", fontWeight:700, minWidth:34, textAlign:"right"}}>{pct}%</span>
                    </div>
                  );
                })}
              </div>
            )}

            {stats.total === 0 && (
              <div style={{textAlign:"center", padding:"40px 16px", color:"#617181"}}>
                <div style={{fontSize:32, marginBottom:12}}>🏸</div>
                <div style={{fontSize:14, fontWeight:600}}>Belum ada data match</div>
                <div style={{fontSize:12, marginTop:4}}>{mode==="session"?"Belum ada match di sesi ini":"Pemain ini belum pernah bermain"}</div>
              </div>
            )}

          </div>
        </div>
      );
    }

    // ===== SESSION SCREEN =====
    function SessionScreen({ sessions, matches, players, checkedIn, checkedInBySession, currentSessionId, wsName, wsEmoji, readOnly = false, onSelectSession, onNewSession, onDeleteSession, onBack, onBackup, onRestore, onEditPlayer, onAddPlayer, onDeletePlayer, onViewStats, newPlayerName, setNewPlayerName, newPlayerTier, setNewPlayerTier, newPlayerGender, setNewPlayerGender }) {
      const medals = ["🥇","🥈","🥉"];
      const [sessionTab, setSessionTab] = React.useState("sessions"); // sessions | players | rules
      const [allTimeShareBusy, setAllTimeShareBusy] = React.useState(null);

      const getAllTimeStandingsBlob = async () => {
        const el = document.getElementById("alltime-standings-board");
        if (!el || !window.html2canvas) throw new Error("Klasemen All Time belum siap");
        return createGlassExportBlob(el);
      };

      const handleDownloadAllTimeImage = async () => {
        setAllTimeShareBusy("download");
        try {
          const blob = await getAllTimeStandingsBlob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `Klasemen-All-Time-CourtRank-${new Date().toISOString().slice(0, 10)}.jpg`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch (e) {
          console.error(e);
        }
        setAllTimeShareBusy(null);
      };

      const handleShareAllTimeWA = async (allTimeStandings, allDoneMatches) => {
        setAllTimeShareBusy("share");
        try {
          const blob = await getAllTimeStandingsBlob();
          const file = new File([blob], "klasemen-all-time.jpg", { type: "image/jpeg" });
          let textMsg = `🏆 *KLASEMEN ALL TIME COURTRANK*\n\n`;
          textMsg += `${wsName} · ${sessions.length} sesi · ${allDoneMatches.length} match selesai\n`;
          if (allTimeStandings.length > 0) {
            const wow = allTimeStandings[0];
            const sos = allTimeStandings.length > 1 ? allTimeStandings[allTimeStandings.length - 1] : null;
            let mbgAt = null, maxR = 0;
            allTimeStandings.forEach(p => {
              if (p.totalR > maxR) {
                maxR = p.totalR;
                mbgAt = p;
              }
            });
            textMsg += `\n🏆 *WOW ALL TIME: ${wow.name}*`;
            textMsg += `\n(Winner Over Winners) · ${wow.P} pts · ${wow.W}W ${wow.L}L`;
            if (sos) {
              textMsg += `\n\n🤡 *SOS ALL TIME: ${sos.name}*`;
              textMsg += `\n(Score Optimization Needed) · ${sos.P} pts`;
            }
            if (mbgAt) {
              textMsg += `\n\n📈 *MBG ALL TIME: ${mbgAt.name}*`;
              textMsg += `\n(Making Big Gains) · +${mbgAt.totalR}R`;
            }
          }
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ title: "Klasemen All Time CourtRank", text: textMsg, files: [file] });
          } else {
            window.open(`https://wa.me/?text=${encodeURIComponent(textMsg)}`, "_blank");
          }
        } catch (e) {
          if (e.name !== "AbortError") console.error(e);
        }
        setAllTimeShareBusy(null);
      };

      const getSessionStats = (sess) => {
        const sessMatches = matches.filter(m => m.status === "done" && (m.sessionId === sess.id || (!m.sessionId && sess.id === sessions[0]?.id)));
        const sessCheckedIn = new Set(checkedInBySession?.[sess.id] || []);
        const sessStandings = buildStandings(players, sessMatches, sessCheckedIn, sess.useMCompensation !== false).filter(p => sessCheckedIn.has(p.id));
        const wow = sessStandings[0] || null;
        const sos = sessStandings.length > 1 ? sessStandings[sessStandings.length - 1] : null;
        // MBG: Making Big Gains, pemain dengan subsidi tier terbesar
        let mbg = null, maxR = 0;
        sessStandings.forEach(p => { if (p.totalR > maxR) { maxR = p.totalR; mbg = p; } });

        return { matchCount: sessMatches.length, wow, sos, mbg: maxR > 0 ? mbg : null };
      };

      return (
        <div style={{ minHeight: "100dvh", background: "transparent", color: "#16232E", maxWidth: 430, margin: "0 auto", position: "relative", overflowX: "hidden" }}>
          {/* Header */}
          <div className="cr-glass-header" style={{ background: "linear-gradient(135deg, #FFFFFF, #FAF7F2)", borderBottom: "2px solid #16232E", padding: "calc(12px + var(--cr-safe-top)) 16px 12px", position: "sticky", top: 0, zIndex: 100 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <button onClick={onBack} style={{ background: "#16232E10", border: "none", borderRadius: 16, padding: "8px 12px", color: "#44515E", fontSize: 13, cursor: "pointer" }}>←</button>
              <div style={{ width: 34, height: 34, borderRadius: 9, background: "#E4574F", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>{wsEmoji}</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontStyle: "normal", fontWeight: 700, fontSize: 20, color: "#E4574F", textTransform: "uppercase", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", lineHeight: 1.1 }}>{wsName}</div>
                <div style={{ fontSize: 11, color: "#44515E" }}>{sessions.length} sesi · {players.length} pemain · {matches.filter(m => m.status === "done").length} match</div>
              </div>
              {readOnly ? (
                <div style={{ background: "#16232E12", border: "1px solid #16232E35", color: "#16232E", borderRadius: 12, padding: "6px 8px", fontSize: 10, fontWeight: 850, whiteSpace: "nowrap" }}>Lihat saja</div>
              ) : (
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 5, minWidth: 92 }}>
                  <button title="Backup data Arena" onClick={onBackup} style={{ background: "#FFFFFF", border: "1.5px solid #16232E", color: "#44515E", borderRadius: 11, padding: "6px 4px", fontSize: 10, fontWeight: 850, cursor: "pointer" }}>Backup</button>
                  <button title="Load file backup" onClick={onRestore} style={{ background: "#FFFFFF", border: "1.5px solid #16232E", color: "#44515E", borderRadius: 11, padding: "6px 4px", fontSize: 10, fontWeight: 850, cursor: "pointer" }}>Load</button>
                </div>
              )}
            </div>
          </div>

          <div style={{ padding: "16px 16px calc(104px + var(--cr-safe-bottom))" }}>

            {/* === KLASEMEN ALL TIME TAB === */}
            {sessionTab === "alltime" && (() => {
              const allDoneMatches = matches.filter(m => m.status === "done");
              const allTimeStandings = buildStandings(players, allDoneMatches, new Set(players.map(p => p.id)), false);
              const getMatchSessionIndex = (match) => {
                const idx = sessions.findIndex(sess => sess.id === match.sessionId);
                return idx >= 0 ? idx : 0;
              };
              const doneSessionIndexes = [...new Set(allDoneMatches.map(getMatchSessionIndex))].sort((a, b) => a - b);
              const latestDoneSessionIndex = doneSessionIndexes[doneSessionIndexes.length - 1];
              const previousDoneSessionIndex = doneSessionIndexes.filter(idx => idx < latestDoneSessionIndex).pop();
              const previousAllTimeMatches = previousDoneSessionIndex === undefined ? [] : allDoneMatches.filter(match => getMatchSessionIndex(match) <= previousDoneSessionIndex);
              const previousAllTimeStandings = previousAllTimeMatches.length > 0 ? buildStandings(players, previousAllTimeMatches, new Set(players.map(p => p.id)), false).filter(player => player.matchesPlayed > 0) : [];
              const previousRankMap = new Map(previousAllTimeStandings.map((player, idx) => [player.id, idx + 1]));
              const getRankMove = (playerId, currentRank) => {
                if (previousRankMap.size === 0) return null;
                const previousRank = previousRankMap.get(playerId);
                if (!previousRank) return { label: "NEW", color: "#123A6B", bg: "#D9E8FF", border: "#3A7BD5", title: "Baru masuk ranking dibanding sesi sebelumnya" };
                const delta = previousRank - currentRank;
                if (delta > 0) return { label: `▲${delta}`, color: "#0F5132", bg: "#DDF7E8", border: "#2E8B57", title: `Naik ${delta} peringkat dari sesi sebelumnya` };
                if (delta < 0) return { label: `▼${Math.abs(delta)}`, color: "#7A1B18", bg: "#FFE0DE", border: "#E4574F", title: `Turun ${Math.abs(delta)} peringkat dari sesi sebelumnya` };
                return { label: "-", color: "#617181", bg: "#F2F4F6", border: "#CBD5E1", title: "Ranking tetap dibanding sesi sebelumnya" };
              };
              const wow = allTimeStandings[0];
              const sos = allTimeStandings[allTimeStandings.length - 1];
              let mbgAt = null, maxR = 0;
              allTimeStandings.forEach(p => { if (p.totalR > maxR) { maxR = p.totalR; mbgAt = p; } });
              return (
                <div>
                  <div id="alltime-standings-board" className="cr-share-surface" style={{ width: "100%", maxWidth: "100%", padding: "14px 0", borderRadius: 18, marginBottom: 16, overflow: "hidden" }}>
                  <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 28, fontWeight: 700, color: "#16232E", textTransform: "uppercase", letterSpacing: "-0.02em", marginBottom: 4 }}>KLASEMEN ALL TIME</div>
                  <div style={{ fontSize: 12, color: "#617181", marginBottom: 16 }}>{sessions.length} sesi · {allDoneMatches.length} total match</div>

                  {allTimeStandings.length === 0 && (
                    <div style={{ textAlign: "center", padding: "32px 16px", color: "#617181", fontSize: 13 }}>
                      <div style={{ fontSize: 32, marginBottom: 8 }}>🏸</div>Belum ada match selesai
                    </div>
                  )}

                  {allTimeStandings.length >= 2 && (
                    <div style={{ marginBottom: 16, display: "flex", flexDirection: "column", gap: 6 }}>
                      <div style={{ background: "linear-gradient(135deg, #9A6A0015, #F0B42915)", border: "1px solid #9A6A0030", borderRadius: 18, padding: "10px 14px" }}>
                        <strong style={{ color: "#9A6A00", fontSize: 14, display: "block", marginBottom: 2 }}>🏆 WOW ALL TIME: {wow?.name}</strong>
                        <span style={{ fontSize: 11, color: "#44515E" }}>(Winner Over Winners) · {wow?.P} pts · {wow?.W}W {wow?.L}L</span>
                      </div>
                      <div style={{ display: "flex", gap: 6 }}>
                        <div style={{ flex: 1, background: "#E4574F15", border: "1px solid #E4574F30", borderRadius: 18, padding: "10px 14px" }}>
                          <strong style={{ color: "#E4574F", fontSize: 13, display: "block", marginBottom: 2 }}>🤡 SOS ALL TIME: {sos?.name}</strong>
                          <span style={{ fontSize: 11, color: "#44515E" }}>(Score Optimization Needed) · {sos?.P} pts</span>
                        </div>
                        {mbgAt && (
                          <div style={{ flex: 1, background: "var(--cr-accent-blue-soft)", border: "1px solid var(--cr-accent-blue-line)", borderRadius: 18, padding: "10px 14px" }}>
                            <strong style={{ color: "#16232E", fontSize: 13, display: "block", marginBottom: 2 }}>📈 MBG ALL TIME: {mbgAt.name}</strong>
                            <span style={{ fontSize: 11, color: "#44515E" }}>(Making Big Gains) · +{mbgAt.totalR}R</span>
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  {allTimeStandings.length > 0 && (
                    <div className="cr-standings-wrap">
                      <table className="cr-standings-table cr-standings-alltime" style={{ borderCollapse: "collapse", fontSize: 12 }}>
                        <thead>
                          <tr style={{ borderBottom: "1px solid #16232E14" }}>
                            {["#", "Pemain", "Tier", "P", "M", "W-D-L", "TS", "Diff", "R"].map((h, i) => (
                              <th key={i} style={{ padding: "6px 6px", color: "#617181", fontWeight: 600, textAlign: i === 1 ? "left" : "center", whiteSpace: "nowrap" }}>{h}</th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {allTimeStandings.map((p, idx) => {
                            const medal = ["🥇","🥈","🥉"][idx] || "";
                            const rankMove = p.matchesPlayed > 0 ? getRankMove(p.id, idx + 1) : null;
                            return (
                              <tr key={p.id} style={{ borderBottom: "1px solid #16232E06", background: idx===0?"#9A6A0008":idx===allTimeStandings.length-1?"#E4574F08":"none" }}>
                                <td style={{ padding: "10px 6px", textAlign: "center" }}>{medal || <span style={{ color: "#617181", fontSize: 11 }}>{idx+1}</span>}</td>
                                <td style={{ padding: "10px 8px", fontSize: 13, fontWeight: 500, whiteSpace: "nowrap", cursor: "pointer" }}
                                  onClick={() => onViewStats && onViewStats(p)}>
                                  <span style={{ display: "inline-flex", alignItems: "center", gap: 5, maxWidth: "100%" }}>
                                    <span style={{ borderBottom: "1px dashed #E4574F60", overflow: "hidden", textOverflow: "ellipsis" }}>{p.name}</span>
                                    {rankMove && <span title={rankMove.title} style={{ flex: "0 0 auto", minWidth: 28, height: 18, padding: "0 5px", borderRadius: 999, background: rankMove.bg, border: `1.5px solid ${rankMove.border}`, color: rankMove.color, display: "inline-flex", alignItems: "center", justifyContent: "center", fontFamily: "'DM Mono', monospace", fontSize: 9, fontWeight: 900, lineHeight: 1 }}>{rankMove.label}</span>}
                                   
                                  </span>
                                </td>
                                <td style={{ padding: "10px 6px", textAlign: "center" }}><TierBadge tier={p.tier} small /></td>
                                <td style={{ padding: "10px 6px", textAlign: "center", fontWeight: 900, color: "#E4574F", fontFamily: "'DM Mono', monospace", fontSize: 13 }}>{p.P}</td>
                                <td style={{ padding: "10px 6px", textAlign: "center", color: "#44515E" }}>{p.matchesPlayed}</td>
                                <td style={{ padding: "10px 6px", textAlign: "center", fontFamily: "'DM Mono', monospace", fontWeight: 400 }}><span style={{ color: "#16232E" }}>{p.W}</span><span style={{ color: "#617181" }}>-</span><span style={{ color: "#9A6A00" }}>{p.D}</span><span style={{ color: "#617181" }}>-</span><span style={{ color: "#E4574F" }}>{p.L}</span></td>
                                <td style={{ padding: "10px 6px", textAlign: "center", fontWeight: 400, color: "#44515E", fontFamily: "'DM Mono', monospace" }}>{p.totalFor}</td>
                                <td style={{ padding: "10px 6px", textAlign: "center", fontWeight: 400, color: p.diff>=0?"#16232E":"#E4574F", fontFamily: "'DM Mono', monospace" }}>{p.diff>=0?"+":""}{p.diff}</td>
                                <td style={{ padding: "10px 6px", textAlign: "center", fontWeight: 400, color: "#16232E", fontFamily: "'DM Mono', monospace" }}>{p.totalR > 0 ? `+${p.totalR}` : "—"}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                      <StandingsLegend />
                      {previousRankMap.size > 0 && (
                        <div style={{ marginTop: 8, padding: "9px 12px", background: "#FFFFFF", border: "1.5px solid #16232E", borderRadius: 14, color: "#44515E", fontSize: 11, lineHeight: 1.45 }}>
                          <strong style={{ color: "#16232E" }}>Ranking:</strong> ▲ naik, ▼ turun, - tetap, NEW baru masuk dibanding sesi selesai sebelumnya.
                        </div>
                      )}
                    </div>
                  )}
                  </div>
                  {allTimeStandings.length > 0 && (
                    <div style={{ display: "flex", gap: 8, marginTop: 8, paddingBottom: 16 }}>
                      <button onClick={handleDownloadAllTimeImage} disabled={allTimeShareBusy !== null} style={{ flex: 1, background: "#FFFFFF", border: "2px solid #16232E", borderRadius: 18, padding: "13px 10px", cursor: allTimeShareBusy !== null ? "default" : "pointer", color: "#44515E", fontWeight: 800, fontSize: 13 }}>{allTimeShareBusy === "download" ? "⏳" : "💾"} Simpan Gambar</button>
                      <button onClick={() => handleShareAllTimeWA(allTimeStandings, allDoneMatches)} disabled={allTimeShareBusy !== null} style={{ flex: 1, background: allTimeShareBusy === "share" ? "#778899" : "linear-gradient(135deg, #16232E, #2D4F80)", border: "none", borderRadius: 12, padding: "13px 10px", cursor: allTimeShareBusy !== null ? "default" : "pointer", color: "#fff", fontWeight: 700, fontSize: 13 }}>{allTimeShareBusy === "share" ? "⏳" : "💬"} Kirim WA</button>
                    </div>
                  )}
                </div>
              );
            })()}

            {/* === STATISTIK TAB === */}
            {sessionTab === "stats" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <RankingTrendChart players={players} matches={matches} sessions={sessions} />
                <div style={{ fontSize: 13, color: "#617181" }}>Tap nama pemain untuk melihat statistik lengkap</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {players.map(p => {
                    const allDone = matches.filter(m => m.status === "done" && [...m.team1,...m.team2].includes(p.id));
                    const wins = allDone.filter(m => {
                      const onT1 = m.team1.includes(p.id);
                      const res = calcMatchResult(m, players);
                      return onT1 ? res.t1Win : res.t2Win;
                    }).length;
                    const winRate = allDone.length > 0 ? Math.round((wins/allDone.length)*100) : 0;
                    return (
                      <div key={p.id} onClick={() => onViewStats && onViewStats(p)} style={{
                        display: "flex", alignItems: "center", gap: 12, padding: "12px 14px",
                        background: "#FFFFFF", border: "2px solid #16232E", borderRadius: 12, cursor: "pointer",
                      }}>
                        <div style={{ width: 38, height: 38, borderRadius: 10, background: "linear-gradient(135deg,#E4574F30,#E4574F30)", border: "2px solid #E4574F", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 800, color: "#E4574F" }}>{p.name.slice(0,2).toUpperCase()}</div>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontSize: 13, fontWeight: 600, color: "#16232E" }}>{p.name}</div>
                          <div style={{ fontSize: 11, color: "#617181", marginTop: 1 }}>{allDone.length} match · {wins}W · {winRate}% win rate</div>
                        </div>
                        <TierBadge tier={p.tier} small />
                        <div style={{ textAlign: "right" }}>
                          <div style={{ fontSize: 14, fontWeight: 800, color: winRate >= 50 ? "#16232E" : "#E4574F", fontFamily: "'DM Mono', monospace" }}>{winRate}%</div>
                          <div style={{ fontSize: 9, color: "#778899" }}>win rate</div>
                        </div>
                        <span style={{ color: "#E4574F80", fontSize: 14 }}>›</span>
                      </div>
                    );
                  })}
                  {players.length === 0 && (
                    <div style={{ textAlign: "center", padding: "32px 16px", color: "#617181", fontSize: 13 }}>Belum ada pemain</div>
                  )}
                </div>
              </div>
            )}

            {/* === PLAYERS TAB === */}
            {sessionTab === "players" && (
              <div>
                {!readOnly && <div style={{ background: "#FFFFFF", borderRadius: 22, padding: 16, border: "2px solid #16232E", boxShadow: "3px 3px 0 #16232E", marginBottom: 16 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: "#16232E", marginBottom: 12 }}>+ Tambah Pemain</div>
                  <input type="text" placeholder="Nama Pemain..." value={newPlayerName} onChange={e => setNewPlayerName(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && onAddPlayer()}
                    style={{ width: "100%", background: "#FAF7F2", border: "1px solid #16232E20", padding: "12px 14px", borderRadius: 14, color: "#16232E", fontSize: 13, outline: "none", marginBottom: 8 }} />
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
                    <select value={newPlayerTier} onChange={e => setNewPlayerTier(e.target.value)}
                      style={{ flex: 1, background: "#FAF7F2", border: "1px solid #16232E20", padding: "12px", borderRadius: 14, color: "#16232E", fontSize: 13, outline: "none" }}>
                      {Object.keys(TIER_WEIGHT).map(t => <option key={t} value={t}>Tier {t} — {TIER_WEIGHT[t]} pts</option>)}
                    </select>
                    <select value={newPlayerGender} onChange={e => setNewPlayerGender(e.target.value)}
                      style={{ flex: 1, background: "#FAF7F2", border: "1px solid #16232E20", padding: "12px", borderRadius: 14, color: "#16232E", fontSize: 13, outline: "none" }}>
                      {Object.entries(GENDER_OPTIONS).map(([key, opt]) => <option key={key} value={key}>Gender — {opt.label}</option>)}
                    </select>
                  </div>
                  <button onClick={onAddPlayer} style={{ width: "100%", minHeight: 44, background: "#E4574F", border: "2px solid #E4574F", borderRadius: 14, padding: "10px 20px", color: "#fff", fontWeight: 850, cursor: "pointer", boxShadow: "3px 3px 0 #16232E" }}>Tambah Pemain</button>
                </div>

                }{Object.keys(TIER_WEIGHT).map(tier => {
                  const tp = players.filter(p => p.tier === tier);
                  if (!tp.length) return null;
                  const c = TIER_COLORS[tier];
                  return (
                    <div key={tier} style={{ marginBottom: 14 }}>
                      <div style={{ fontSize: 11, fontWeight: 600, color: c.text, background: c.bg, display: "inline-block", padding: "2px 10px", borderRadius: 6, marginBottom: 8, border: `1px solid ${c.border}` }}>
                        Tier {tier} · {TIER_WEIGHT[tier]} pts · {tp.length} pemain
                      </div>
                      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                        {tp.map(p => {
                          const history = (p.tierHistory||[]).filter(h=>h.type!=="init");
                          return (
                            <div key={p.id} style={{ background: "#FFFFFF", border: "2px solid #16232E", borderRadius: 18, padding: "10px 14px" }}>
                              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                                <div style={{ width: 32, height: 32, borderRadius: 8, background: "#16232E08", border: "1px solid #16232E15", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 700, color: "#617181" }}>{p.name.slice(0,2).toUpperCase()}</div>
                                <div style={{ flex: 1 }}>
                                  <div onClick={() => onViewStats && onViewStats(p)} style={{ fontSize: 13, fontWeight: 600, color: "#16232E", cursor: "pointer", borderBottom: "1px dashed #E4574F40", display: "inline-block" }}>{p.name}</div>
                                  {history.length > 0 && (
                                    <div style={{ fontSize: 10, color: "#617181", marginTop: 1 }}>
                                      {(history[history.length-1].type === "naik" || history[history.length-1].type === "resmi") ? "🚀" : "🔧"} Tier terakhir diubah di {history[history.length-1].sessionLabel}
                                    </div>
                                  )}
                                </div>
                                <span style={{ fontSize: 10, fontWeight: 850, color: GENDER_OPTIONS[normalizeGender(p.gender)].color, background: GENDER_OPTIONS[normalizeGender(p.gender)].bg, border: `1px solid ${GENDER_OPTIONS[normalizeGender(p.gender)].border}`, borderRadius: 999, padding: "3px 7px", whiteSpace: "nowrap" }}>{GENDER_OPTIONS[normalizeGender(p.gender)].icon} {GENDER_OPTIONS[normalizeGender(p.gender)].short}</span>
                                <TierBadge tier={p.tier} small />
                                {!readOnly && <button onClick={() => onEditPlayer(p)} style={{ background: "#FFFFFF", border: "2px solid #16232E", color: "#44515E", borderRadius: 6, padding: "4px 10px", fontSize: 11, cursor: "pointer" }}>Edit</button>}
                                {!readOnly && <button onClick={(e) => onDeletePlayer(p.id, p.name, e)} style={{ background: "#FFE9EC30", border: "1px solid #E4574F50", color: "#E4574F", borderRadius: 6, padding: "4px 8px", fontSize: 11, cursor: "pointer" }}>✕</button>}
                              </div>
                              {history.length > 0 && (
                                <div style={{ marginTop: 8, paddingTop: 8, borderTop: "1px solid #16232E08" }}>
                                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                                    {history.map((h,i) => (
                                      <span key={i} style={{ fontSize: 10, background: (h.type==="naik"||h.type==="resmi")?"#E4574F15":"#F0B42915", border: `1px solid ${(h.type==="naik"||h.type==="resmi")?"#E4574F30":"#F0B42930"}`, color: (h.type==="naik"||h.type==="resmi")?"#E4574F":"#9A6A00", borderRadius: 6, padding: "2px 7px" }}>
                                        {(h.type==="naik"||h.type==="resmi")?"🚀":"🔧"} {h.from}→{h.to} · {h.sessionLabel}
                                      </span>
                                    ))}
                                  </div>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
                {players.length === 0 && (
                  <div style={{ textAlign: "center", padding: "32px 16px", color: "#617181", fontSize: 13 }}>Belum ada pemain. Tambah pemain di atas!</div>
                )}
              </div>
            )}

            {/* === RULES TAB === */}
            {sessionTab === "rules" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <div style={{ background: "#FFFFFF", border: "2px solid #E4574F", borderRadius: 16, padding: 16, boxShadow: "3px 3px 0 #16232E" }}>
                  <div style={{ fontSize: 12, color: "#E4574F", fontWeight: 850, letterSpacing: "0.06em", marginBottom: 10, textAlign: "center" }}>RUMUS UTAMA KLASEMEN</div>
                  {[
                    { label: "Harian · M aktif", m: true, note: "Dipakai kalau kompensasi M dinyalakan di tab Atur." },
                    { label: "Harian · M mati / All Time", m: false, note: "Dipakai kalau kompensasi M dimatikan, dan untuk Klasemen All Time." },
                  ].map(row => (
                    <div key={row.label} style={{ background: row.m ? "#DDF7E8" : "#FAF7F2", border: `1px solid ${row.m ? "#2E8B5740" : "#16232E20"}`, borderRadius: 14, padding: "10px 12px", marginTop: 8 }}>
                      <div style={{ fontSize: 11, color: row.m ? "#0F5132" : "#44515E", fontWeight: 850, marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.04em" }}>{row.label}</div>
                      <div style={{ display: "flex", alignItems: "center", gap: 5, flexWrap: "wrap", fontFamily: "'DM Mono', monospace", fontSize: 17, fontWeight: 900, color: "#16232E", lineHeight: 1.25 }}>
                        <span>P =</span>
                        <span style={{ color: "#123A6B", background: "#D9E8FF", border: "2px solid #3A7BD5", borderRadius: 8, padding: "1px 6px" }}>TS</span>
                        <span>+</span>
                        <span style={{ color: "#7A1B18", background: "#FFE0DE", border: "2px solid #E4574F", borderRadius: 8, padding: "1px 6px" }}>S</span>
                        <span>+</span>
                        <span style={{ color: "#5A3A00", background: "#FFE1A3", border: "2px solid #9A6A00", borderRadius: 8, padding: "1px 6px" }}>R</span>
                        {row.m && <><span>+</span><span style={{ color: "#0F5132", background: "#DDF7E8", border: "2px solid #2E8B57", borderRadius: 8, padding: "1px 6px" }}>M</span></>}
                      </div>
                      <div style={{ fontSize: 11, color: "#44515E", marginTop: 6, lineHeight: 1.35 }}>{row.note}</div>
                    </div>
                  ))}
                </div>
                {[
                  { code: "TS", color: "#D9E8FF", text: "#123A6B", border: "#3A7BD5", label: "Total Poin (Poin Murni)", points: ["Angka murni yang dicetak pemain.", "Diambil dari total poin semua set/game."] },
                  { code: "S", color: "#FFE0DE", text: "#7A1B18", border: "#E4574F", label: "Status Match", points: ["Menang = +3", "Seri/Draw = +1", "Kalah = 0", "Jika jumlah set imbang, total poin lebih besar tetap dihitung menang."] },
                  { code: "R", color: "#FFE1A3", text: "#5A3A00", border: "#9A6A00", label: "Subsidi Tier (Underdog)", points: ["Selisih tier >=200: menang +4, draw/kalah +2", "Selisih tier >=50: menang +2, draw/kalah +1", "Hanya diberikan ke tim underdog."] },
                  { code: "M", color: "#DDF7E8", text: "#0F5132", border: "#2E8B57", label: "Kompensasi Absen (Harian)", points: ["Opsional, bisa dinyalakan atau dimatikan per sesi di tab Atur.", "+10 per match terlewat vs pemain yang paling banyak main.", "Hanya untuk pemain yang check-in di sesi itu.", "Tidak berlaku di Klasemen All Time."] },
                ].map(item => (
                  <div key={item.code} style={{ background: "#FFFFFF", borderRadius: 22, padding: 16, boxShadow: "3px 3px 0 #16232E", border: "2px solid #16232E" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                      <span style={{ background: item.color, color: item.text, border: `2px solid ${item.border}`, padding: "4px 9px", borderRadius: 8, fontSize: 12, fontWeight: 900, fontFamily: "'DM Mono', monospace", minWidth: 34, textAlign: "center" }}>{item.code}</span>
                      <span style={{ fontWeight: 800, fontSize: 14, color: "#16232E" }}>{item.label}</span>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
                      {item.points.map((point, idx) => (
                        <div key={idx} style={{ display: "grid", gridTemplateColumns: "22px 1fr", gap: 8, alignItems: "start", fontSize: 13, color: "#334155", lineHeight: 1.4 }}>
                          <span style={{ width: 22, height: 22, borderRadius: 999, background: item.color, color: item.text, border: `2px solid ${item.border}`, display: "inline-flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 900, fontFamily: "'DM Mono', monospace" }}>{idx + 1}</span>
                          <span>{point}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
                <div style={{ background: "#FFFFFF", borderRadius: 22, padding: 16, boxShadow: "3px 3px 0 #16232E", border: "2px solid #16232E" }}>
                  <div style={{ fontSize: 12, color: "#16232E", fontWeight: 850, marginBottom: 8, letterSpacing: "0.04em" }}>TIE-BREAKER</div>
                  <div style={{ fontSize: 13, color: "#334155", lineHeight: 1.6 }}>1. DIFF — selisih poin dibuat vs poin lawan<br/>2. W — jumlah kemenangan terbanyak</div>
                </div>
              </div>
            )}

            {/* === SESSIONS TAB === */}
            {sessionTab === "sessions" && <div>
            {/* Sessions list */}
            {/* New Session Button */}
            {!readOnly && <button onClick={onNewSession} style={{
              width: "100%", padding: "18px", marginBottom: 18,
              background: "#E4574F",
              border: "none", borderRadius: 16, color: "#fff",
              fontWeight: 700, fontSize: 14, cursor: "pointer",
              boxShadow: "3px 3px 0 #16232E",
              display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
            }}>✨ Mulai Sesi Baru</button>}

            <div style={{ fontSize: 12, fontWeight: 700, color: "#617181", letterSpacing: "0.06em", textTransform: "uppercase", marginBottom: 10 }}>Riwayat Sesi</div>

            {sessions.length === 0 && (
              <div style={{ textAlign: "center", padding: "32px 16px", background: "#FFFFFF", borderRadius: 22, border: "1px dashed #E4574F30", color: "#617181", fontSize: 13, boxShadow: "3px 3px 0 #16232E" }}>
                Belum ada sesi. Mulai sesi baru!
              </div>
            )}

            {[...sessions].reverse().map((sess, idx) => {
              const stats = getSessionStats(sess);
              const isActive = sess.id === currentSessionId;
              return (
                <div key={sess.id} onClick={() => onSelectSession(sess.id)}
                  style={{
                    background: isActive ? "linear-gradient(135deg, #FFFFFF, #FAF7F2)" : "#FFFFFF",
                    border: `1px solid ${isActive ? "#E4574F60" : "#16232E0a"}`,
                    borderRadius: 22, padding: 18, marginBottom: 14, cursor: "pointer", boxShadow: isActive ? "0 18px 42px #E4574F18" : "0 12px 34px #44515E10",
                    transition: "all 0.15s",
                  }}>
                  {/* Top row */}
                  <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 10 }}>
                    <div>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <span style={{ fontWeight: 700, fontSize: 14, color: isActive ? "#E4574F" : "#16232E" }}>{sess.label}</span>
                        {isActive && <span style={{ fontSize: 10, background: "#E4574F40", color: "#E4574F", border: "2px solid #E4574F", borderRadius: 20, padding: "1px 8px", fontWeight: 700 }}>AKTIF</span>}
                      </div>
                      <div style={{ fontSize: 11, color: "#617181", marginTop: 2 }}>{sess.date}</div>
                    </div>
                    <div style={{ textAlign: "right", display: "flex", flexDirection: "row", alignItems: "center", gap: 8 }}>
                      <div>
                        <div style={{ fontSize: 18, fontWeight: 800, color: isActive ? "#E4574F" : "#16232E", fontFamily: "'DM Mono', monospace" }}>{stats.matchCount}</div>
                        <div style={{ fontSize: 10, color: "#617181" }}>match</div>
                      </div>
                      {!readOnly && <button className="cr-compact-icon" type="button" onClick={event => { event.stopPropagation(); onDeleteSession?.(sess.id); }} disabled={sessions.length <= 1} aria-label={`Hapus ${sess.label}`} title={sessions.length <= 1 ? "Minimal harus ada 1 sesi" : `Hapus ${sess.label}`} style={{ width: 30, height: 30, display: "inline-flex", alignItems: "center", justifyContent: "center", padding: 0, background: "#FFFFFF", border: "1.5px solid #E4574F", borderRadius: 8, color: "#E4574F", fontSize: 17, lineHeight: 1, fontWeight: 900, cursor: sessions.length <= 1 ? "default" : "pointer" }}>×</button>}
                    </div>
                  </div>

                  {/* WOW / SOS / MBG / AFK */}
                  {stats.matchCount > 0 && (
                    <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                      {stats.wow && (
                        <div style={{ display: "flex", alignItems: "center", gap: 6, background: "#9A6A0010", borderRadius: 8, padding: "5px 10px" }}>
                          <span style={{ fontSize: 13 }}>🏆</span>
                          <span style={{ fontSize: 11, color: "#9A6A00", fontWeight: 700, minWidth: 52 }}>WOW</span>
                          <span style={{ fontSize: 12, color: "#16232E", fontWeight: 600 }}>{stats.wow.name}</span>
                          <span style={{ fontSize: 11, color: "#617181", marginLeft: "auto", fontFamily: "'DM Mono', monospace" }}>{stats.wow.P}pts · {stats.wow.W}W</span>
                        </div>
                      )}
                      {stats.sos && (
                        <div style={{ display: "flex", alignItems: "center", gap: 6, background: "#ef444415", borderRadius: 8, padding: "5px 10px" }}>
                          <span style={{ fontSize: 13 }}>🤡</span>
                          <span style={{ fontSize: 11, color: "#E4574F", fontWeight: 700, minWidth: 52 }}>SOS</span>
                          <span style={{ fontSize: 12, color: "#16232E", fontWeight: 600 }}>{stats.sos.name}</span>
                          <span style={{ fontSize: 11, color: "#617181", marginLeft: "auto", fontFamily: "'DM Mono', monospace" }}>{stats.sos.P}pts · {stats.sos.W}W</span>
                        </div>
                      )}
                      {stats.mbg && (
                        <div style={{ display: "flex", alignItems: "center", gap: 6, background: "var(--cr-accent-blue-soft)", borderRadius: 8, padding: "5px 10px" }}>
                          <span style={{ fontSize: 13 }}>📈</span>
                          <span style={{ fontSize: 11, color: "var(--cr-accent-blue)", fontWeight: 700, minWidth: 52 }}>MBG</span>
                          <span style={{ fontSize: 12, color: "#16232E", fontWeight: 600 }}>{stats.mbg.name}</span>
                          <span style={{ fontSize: 11, color: "#617181", marginLeft: "auto", fontFamily: "'DM Mono', monospace" }}>+{stats.mbg.totalR}R</span>
                        </div>
                      )}
                      {stats.matchCount > 0 && !stats.wow && (
                        <div style={{ fontSize: 12, color: "#778899", textAlign: "center", padding: "4px 0" }}>Belum ada match selesai</div>
                      )}
                    </div>
                  )}

                  {stats.matchCount === 0 && (
                    <div style={{ fontSize: 12, color: "#778899" }}>Belum ada match di sesi ini</div>
                  )}

                  <div style={{ marginTop: 10, fontSize: 11, color: isActive ? "#E4574F" : "#778899", fontWeight: 600, textAlign: "right" }}>
                    {isActive ? "▶ Lanjutkan sesi ini →" : "Tap untuk buka →"}
                  </div>
                </div>
              );
            })}

            </div>}
          </div>

          <nav className="cr-bottom-nav cr-bottom-nav-five" aria-label="Navigasi arena">
            {[
              { key: "sessions", icon: "📅", text: "Sesi" },
              { key: "alltime", icon: "🏆", text: "Klasemen" },
              { key: "stats", icon: "📊", text: "Statistik" },
              { key: "players", icon: "👥", text: "Pemain" },
              { key: "rules", icon: "📖", text: "Aturan" },
            ].map(t => (
              <button key={t.key} type="button" className={`cr-bottom-tab ${sessionTab === t.key ? "cr-bottom-tab-active" : ""}`} onClick={() => setSessionTab(t.key)} aria-current={sessionTab === t.key ? "page" : undefined}>
                <span aria-hidden="true">{t.icon}</span>
                <span>{t.text}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    // ===== WORKSPACE SCREEN =====
    function WorkspaceScreen({ workspaces, onOpen, onCreate, onRename, onReset, onDelete, onShare, onShareBackup, onBackup, onRestore, confirmDialog, setConfirmDialog }) {
      const [creating, setCreating] = React.useState(false);
      const [newName, setNewName] = React.useState("");
      const [renamingId, setRenamingId] = React.useState(null);
      const [renameName, setRenameName] = React.useState("");
      const [openActionsId, setOpenActionsId] = React.useState(null);
      const [shareMenuWs, setShareMenuWs] = React.useState(null);
      const shareBusyRef = React.useRef(false);
      const lastShareTapRef = React.useRef(0);
      const [newEmoji, setNewEmoji] = React.useState("🏸");
      const emojis = ["🏸","🎾","🏓","⚽","🏀","🏐","🥏","🎱"];
      const fmtDate = (ts) => ts ? new Date(ts).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : "-";
      const runShareBackup = (event, ws) => {
        if (event) event.stopPropagation();
        const now = Date.now();
        if (shareBusyRef.current || now - lastShareTapRef.current < 900) return;
        shareBusyRef.current = true;
        lastShareTapRef.current = now;
        setTimeout(() => { shareBusyRef.current = false; }, 1200);
        if (!ws) {
          window.alert("Arena tidak ditemukan. Tutup panel Bagikan lalu coba lagi.");
          return;
        }
        if (typeof onShareBackup !== "function") {
          window.alert("Fitur Backup JSON belum siap. Coba refresh halaman.");
          return;
        }
        onShareBackup(ws);
        setShareMenuWs(null);
      };
      return (
        <div style={{ minHeight: "100dvh", background: "var(--cr-bg)", color: "var(--cr-ink)", maxWidth: 430, margin: "0 auto", padding: "calc(20px + var(--cr-safe-top)) 16px calc(40px + var(--cr-safe-bottom))" }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 24 }}>
            <div>
              <div style={{ display: "flex", alignItems: "baseline", gap: 0, fontFamily: "'Space Grotesk', sans-serif", fontStyle: "normal", fontSize: 32, fontWeight: 700, lineHeight: 1, letterSpacing: "0", textTransform: "uppercase" }}>
                <span style={{ color: "#E4574F" }}>COURT</span><span style={{ color: "#E4574F", WebkitTextStroke: "0.8px #E4574F", textStroke: "0.8px #E4574F" }}>RANK</span>
              </div>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 22, fontWeight: 700, marginTop: 24, color: "var(--cr-line)", textTransform: "uppercase", lineHeight: 1.15 }}>Pilih Arena</div>
              <div style={{ fontSize: 14, color: "var(--cr-muted)", marginTop: 6, lineHeight: 1.45, maxWidth: 300 }}>Pilih arena untuk melanjutkan aktivitasmu hari ini.</div>
            </div>

          </div>

          {workspaces.length === 0 && !creating && (
            <div style={{ textAlign: "center", padding: "32px 16px", background: "#FFFFFF", borderRadius: 22, border: "1px dashed #E4574F35", boxShadow: "3px 3px 0 #16232E", marginBottom: 20 }}>
              <div style={{ fontSize: 32, marginBottom: 12 }}>👋</div>
              <div style={{ fontWeight: 600, color: "#16232E", marginBottom: 6 }}>Belum ada Arena</div>
              <div style={{ fontSize: 13, color: "#617181" }}>Buat Arena baru untuk mulai, atau buka link Bagikan dari teman</div>
            </div>
          )}

          <div style={{ display: "flex", flexDirection: "column", gap: 12, marginBottom: 16 }}>
            {[...workspaces].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).map(ws => (
              <div key={ws.id} style={{ background: "var(--cr-surface)", border: "2px solid var(--cr-line)", borderRadius: 22, padding: 16, boxShadow: "var(--cr-shadow-hard)" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: openActionsId === ws.id ? 16 : 0 }}>
                  <div style={{ width: 40, height: 40, borderRadius: 14, background: "var(--cr-primary)", boxShadow: "0 8px 18px rgba(228, 87, 79,0.22)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, flex: "0 0 auto" }}>{ws.emoji}</div>
                  <div onClick={() => { if (!ws.readOnly) { setRenamingId(ws.id); setRenameName(ws.name); } }} title={ws.readOnly ? "Arena lihat saja" : "Tap untuk rename Arena"} style={{ flex: 1, minWidth: 0, cursor: ws.readOnly ? "default" : "pointer", padding: "4px 2px", borderRadius: 12 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6, fontWeight: 800, fontSize: 17, color: "#16232E", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}><span style={{ overflow: "hidden", textOverflow: "ellipsis" }}>{ws.name}</span>{!ws.readOnly && <span style={{ fontSize: 11, color: "#44515E", flex: "0 0 auto" }}>✎</span>}</div>
                    <div style={{ fontSize: 12, color: "#44515E", marginTop: 4, lineHeight: 1.35 }}>Update: {fmtDate(ws.updatedAt)}</div>
                    {ws.readOnly && (
                      <div style={{ display: "inline-flex", alignItems: "center", gap: 4, marginTop: 6, background: "#16232E12", border: "1px solid #16232E35", color: "#16232E", borderRadius: 999, padding: "3px 8px", fontSize: 10, fontWeight: 900 }}>
                        🔒 Lihat saja
                      </div>
                    )}
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, flex: "0 0 auto" }}>
                    <button onClick={() => onOpen(ws)} style={{ background: "var(--cr-primary)", border: "2px solid var(--cr-line)", color: "#fff", borderRadius: 16, padding: "14px 18px", fontSize: 15, fontWeight: 850, cursor: "pointer", boxShadow: "var(--cr-shadow-hard)", minWidth: 82 }}>Buka</button>
                    <button
                      type="button"
                      title={openActionsId === ws.id ? "Tutup pengelolaan Arena" : "Kelola Arena"}
                      aria-label={openActionsId === ws.id ? "Tutup pengelolaan Arena" : "Kelola Arena"}
