          const compressed = window.LZString.compressToEncodedURIComponent(JSON.stringify(minified));
          const baseUrl = window.location.href.split('?')[0].split('#')[0];
          const link = `${baseUrl}?d=${encodeURIComponent(compressed)}`;
          const doneMatches = safeMatches.filter(m => m.status === "done").length;
          const title = `Bagikan ${wsFixed.name}`;
          const msg = `🎾 *BAGIKAN ARENA COURTRANK — ${wsFixed.name.toUpperCase()}*\n\nData Arena lengkap:\n👥 ${safePlayers.length} pemain\n📅 ${safeSessions.length} sesi\n✅ ${doneMatches} match selesai\n\nBuka link ini untuk melihat data lengkap atau lanjut input sebagai operator.`;
          if (navigator.share) {
            showNotify("Pilih aplikasi untuk membagikan link Arena.", "success");
            navigator.share({ title, text: msg, url: link }).then(() => showNotify("Link Bagikan siap dikirim!", "success")).catch(err => {
              if (err.name !== "AbortError") {
                fallbackCopy(`${msg}\nLink: ${link}`);
                showNotify("Link Bagikan disalin.", "success");
              }
            });
          } else if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(`${msg}\nLink: ${link}`).then(() => showNotify("Link Bagikan disalin!", "success")).catch(() => fallbackCopy(`${msg}\nLink: ${link}`));
          } else {
            fallbackCopy(`${msg}\nLink: ${link}`);
            showNotify("Link Bagikan disalin!", "success");
          }
        } catch (e) {
          console.error(e);
          showNotify("Gagal membuat link Bagikan", "error");
        }
      };

      if (screen === "workspace") {
        return <WorkspaceScreen
          workspaces={workspaces}
          onOpen={handleOpenWorkspace}
          onCreate={handleCreateWorkspace}
          onRename={handleRenameWorkspace}
          onReset={handleResetWorkspace}
          onDelete={handleDeleteWorkspace}
          onShare={handleShareWorkspace}
          onBackup={handleDownloadWorkspaceBackup}
          onShareBackup={handleShareWorkspaceBackup}
          onRestore={handleRestoreWorkspaceBackup}
          confirmDialog={confirmDialog}
          setConfirmDialog={setConfirmDialog}
        />;
      }

      const statsPlayer = statsPlayerId ? players.find(p => p.id === statsPlayerId) : null;

      if (screen === "stats" && statsPlayer) {
        return <><PlayerStatsScreen
          player={statsPlayer}
          players={players}
          matches={matches}
          sessions={sessions}
          currentSessionId={currentSessionId}
          initialMode={statsFrom === "app" ? "session" : "alltime"}
          showModeSwitch={false}
          onBack={() => goBackInApp(() => setScreen(statsFrom))}
        />
        {editingPlayer && (
          <EditPlayerModal
            player={editingPlayer}
            currentSessionId={currentSessionId}
            currentSessionLabel={sessions.find(s=>s.id===currentSessionId)?.label||"Sesi ini"}
            onClose={() => setEditingPlayer(null)}
            onSave={(id, newName, newTier, newGender, changeType) => {
              if (readOnly) {
                showNotify("Mode lihat saja: data tidak bisa diedit.", "error");
                setEditingPlayer(null);
                return;
              }
              const player = players.find(p => p.id === id);
              const tierChanged = player && newTier !== player.tier;
              setPlayers(prev => prev.map(p => {
                if (p.id !== id) return p;
                const updated = { ...p, name: newName, tier: newTier, gender: normalizeGender(newGender) };
                if (tierChanged) {
                  const histEntry = { from: p.tier, to: newTier, sessionId: currentSessionId, sessionLabel: sessions.find(s=>s.id===currentSessionId)?.label||"Sesi ini", date: new Date().toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}), type: changeType };
                  updated.tierHistory = [...(p.tierHistory||[]), histEntry];
                }
                return updated;
              }));
              if (tierChanged && changeType === "koreksi") {
                setMatches(prev => prev.map(m => {
                  const firstSessionId = sessions[0]?.id || "s1";
                  const isCurrentSessionMatch = m.sessionId === currentSessionId || (!m.sessionId && currentSessionId === firstSessionId);
                  if (!isCurrentSessionMatch) return m;
                  if (![...m.team1,...m.team2].includes(id)) return m;
                  return { ...m, tierSnapshot: { ...(m.tierSnapshot||{}), [id]: newTier } };
                }));
              }
              setEditingPlayer(null);
            }}
          />
        )}
        </>;
      }

      if (screen === "session") {
        const wsName = workspaces.find(w => w.id === workspaceId)?.name || "Arena";
        const wsEmoji = workspaces.find(w => w.id === workspaceId)?.emoji || "🏸";
        return <><SessionScreen
          sessions={sessions}
          matches={matches}
          players={players}
          checkedIn={checkedIn}
          checkedInBySession={checkedInBySession}
          currentSessionId={currentSessionId}
          wsName={wsName}
          wsEmoji={wsEmoji}
          onSelectSession={(sId) => { setCurrentSessionId(sId); setScreen("app"); }}
          onDeleteSession={handleDeleteSession}
          onNewSession={() => {
            if (readOnly) return showNotify("Mode lihat saja: data tidak bisa diedit.", "error");
            const sessionNum = sessions.length + 1;
            const newSession = {
              id: `s${Date.now()}`,
              label: `Sesi ${sessionNum}`,
              date: new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' }),
              createdAt: Date.now(),
              useMCompensation: true,
            };
            setSessions(prev => [...prev, newSession]);
            setCurrentSessionId(newSession.id);
            setCheckedInBySession(prev => ({ ...prev, [newSession.id]: [] }));
            setScreen("app");
            showNotify(`${newSession.label} dimulai!`, "success");
          }}
          onBack={() => goBackInApp(() => setScreen("workspace"))}
          onBackup={() => handleDownloadWorkspaceBackup(workspaces.find(w => w.id === workspaceId))}
          onRestore={() => handleRestoreWorkspaceBackup(workspaces.find(w => w.id === workspaceId))}
          onViewStats={(p) => { setStatsPlayerId(p.id); setStatsFrom("session"); setScreen("stats"); }}
          onEditPlayer={(p) => { setEditingPlayer(p); }}
          onAddPlayer={handleAddPlayer}
          onDeletePlayer={handleDeletePlayer}
          newPlayerName={newPlayerName}
          setNewPlayerName={setNewPlayerName}
          newPlayerTier={newPlayerTier}
          setNewPlayerTier={setNewPlayerTier}
          newPlayerGender={newPlayerGender}
          setNewPlayerGender={setNewPlayerGender}
        />
        {editingPlayer && (
          <EditPlayerModal
            player={editingPlayer}
            currentSessionId={currentSessionId}
            currentSessionLabel={sessions.find(s=>s.id===currentSessionId)?.label||"Sesi ini"}
            onClose={() => setEditingPlayer(null)}
            onSave={(id, newName, newTier, newGender, changeType) => {
              const player = players.find(p => p.id === id);
              const tierChanged = player && newTier !== player.tier;
              setPlayers(prev => prev.map(p => {
                if (p.id !== id) return p;
                const updated = { ...p, name: newName, tier: newTier, gender: normalizeGender(newGender) };
                if (tierChanged) {
                  const histEntry = {
                    from: p.tier, to: newTier,
                    sessionId: currentSessionId,
                    sessionLabel: sessions.find(s=>s.id===currentSessionId)?.label||"Sesi ini",
                    date: new Date().toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}),
                    type: changeType,
                  };
                  updated.tierHistory = [...(p.tierHistory||[]), histEntry];
                }
                return updated;
              }));
              if (tierChanged && changeType === "koreksi") {
                setMatches(prev => prev.map(m => {
                  const firstSessionId = sessions[0]?.id || "s1";
                  const isCurrentSessionMatch = m.sessionId === currentSessionId || (!m.sessionId && currentSessionId === firstSessionId);
                  if (!isCurrentSessionMatch) return m;
                  if (![...m.team1, ...m.team2].includes(id)) return m;
                  return { ...m, tierSnapshot: { ...(m.tierSnapshot||{}), [id]: newTier } };
                }));
              }
              setEditingPlayer(null);
            }}
          />
        )}
        {confirmDialog && (
          <div style={{ position: "fixed", inset: 0, background: "#000000cc", zIndex: 1500, display: "flex", alignItems: "flex-end", justifyContent: "center", padding: "20px 16px calc(20px + var(--cr-safe-bottom))" }} onClick={() => setConfirmDialog(null)}>
            <div className="cr-glass-modal" style={{ background: "var(--cr-surface)", borderRadius: "24px 24px 18px 18px", padding: 20, width: "100%", maxWidth: 390, border: "2px solid var(--cr-line)", textAlign: "center", boxShadow: "var(--cr-shadow-hard)" }} onClick={e => e.stopPropagation()}>
              <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 12, color: confirmDialog.isDanger ? "#E4574F" : "#16232E" }}>{confirmDialog.title}</div>
              <div style={{ fontSize: 13, color: "#44515E", marginBottom: 24, lineHeight: 1.5 }}>{confirmDialog.message}</div>
              <div style={{ display: "flex", gap: 10 }}>
                <button onClick={() => setConfirmDialog(null)} style={{ flex: 1, padding: "12px", borderRadius: 14, background: "#16232E10", border: "1px solid #16232E12", color: "var(--cr-ink)", fontWeight: 700, cursor: "pointer" }}>Batal</button>
                <button onClick={confirmDialog.onConfirm} style={{ flex: 1, padding: "12px", borderRadius: 14, background: confirmDialog.isDanger ? "var(--cr-danger-soft)" : "var(--cr-primary)", border: confirmDialog.isDanger ? "2px solid #E4574F45" : "2px solid var(--cr-primary)", color: confirmDialog.isDanger ? "var(--cr-primary-strong)" : "#FFFFFF", fontWeight: 800, cursor: "pointer" }}>{confirmDialog.isDanger ? "Hapus" : "OK"}</button>
              </div>
            </div>
          </div>
        )}
        </>;
      }

      if (!isLoaded) {
        return (
          <div style={{ minHeight: "100dvh", display: "flex", alignItems: "center", justifyContent: "center", background: "var(--cr-bg)", color: "var(--cr-primary)", padding: "24px 20px calc(24px + var(--cr-safe-bottom))" }}>
            <div style={{ width: "100%", maxWidth: 360, display: "flex", flexDirection: "column", gap: 14 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 4 }}>
                <div style={{ width: 48, height: 48, borderRadius: 16, background: "var(--cr-primary)", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 24, animation: "bounce 1s infinite" }}>🎾</div>
                <div>
                  <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 26, fontWeight: 800, color: "var(--cr-primary-strong)", fontStyle: "italic", letterSpacing: "0.01em" }}>COURTRANK</div>
                  <div style={{ fontSize: 13, fontWeight: 650, color: "var(--cr-muted)" }}>Menyiapkan data arena...</div>
                </div>
              </div>
              <div className="cr-skeleton" style={{ height: 82, borderRadius: 20, border: "2px solid rgba(22, 35, 46,0.18)" }} />
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <div className="cr-skeleton" style={{ height: 64, borderRadius: 16 }} />
                <div className="cr-skeleton" style={{ height: 64, borderRadius: 16 }} />
              </div>
            </div>
          </div>
        );
      }

      return (
        <div style={{
          minHeight: "100dvh", background: "transparent",
          color: "var(--cr-ink)", maxWidth: 430, margin: "0 auto",
          position: "relative", overflowX: "hidden",
        }}>
          {/* Header */}
          <div className="cr-glass-header" style={{
            background: "rgba(250,247,242,0.96)", backdropFilter: "blur(12px)",
            borderBottom: "2px solid var(--cr-line)", padding: "calc(12px + var(--cr-safe-top)) 16px 12px",
            position: "sticky", top: 0, zIndex: 100,
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <button aria-label="Kembali" onClick={() => goBackInApp(() => setScreen("session"))} style={{ width: 44, height: 44, background: "#16232E10", border: "1px solid #16232E12", borderRadius: 16, padding: 0, color: "#44515E", fontSize: 18, cursor: "pointer", flex: "0 0 auto" }}>←</button>
              <div style={{
                width: 40, height: 40, borderRadius: 14,
                background: "var(--cr-primary)", boxShadow: "0 8px 18px rgba(228, 87, 79,0.22)",
                display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: 18,
              }}>🎾</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontStyle: "normal", fontWeight: 700, fontSize: 20, color: "var(--cr-primary-strong)", textTransform: "uppercase", lineHeight: 1.1, letterSpacing: "0" }}>
                  {workspaces.find(w => w.id === workspaceId)?.emoji || "🎾"} {workspaces.find(w => w.id === workspaceId)?.name || "CourtRank"}
                </div>
                <div style={{ fontSize: 12, color: "var(--cr-muted)", marginTop: 2, fontWeight: 500 }}>
                  {checkedIn.size} pemain · {currentSessionMatches.length} match di sesi
                </div>
              </div>
              <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                {gistStatus === "saving" && <span style={{ fontSize: 10, color: "#9A6A00" }}>💾 Menyimpan...</span>}
                {gistStatus === "saved" && <span style={{ fontSize: 10, color: "#16232E" }}>✅ Tersimpan</span>}
                {gistStatus === "error" && <span style={{ fontSize: 10, color: "#E4574F" }}>❌ Gagal</span>}
              </div>
            </div>
          </div>

          <div style={{ padding: "16px 16px calc(112px + var(--cr-safe-bottom))" }}>

            {/* === COURTS / MATCH TAB === */}
            {tab === "courts" && (
              <MatchWorkspace
                session={currentSession}
                sessions={sessions}
                players={players}
                checkedIn={checkedIn}
                matches={currentSessionMatches}
                readOnly={readOnly}
                useMCompensation={useMCompensation}
                onUpdateSession={updateCurrentSession}
                onTogglePlayer={toggleCheckIn}
                onSelectAll={() => setCheckedIn(new Set(players.map(player => player.id)))}
                onClearPlayers={() => setCheckedIn(new Set())}
                onToggleCompensation={() => setUseMCompensation(!useMCompensation)}
                onGenerate={handleWorkspaceGenerate}
                onManualMatch={handleWorkspaceManualMatch}
                onEditMatch={match => setScoreModal(match)}
                onUpdateScore={handleUpdateOngoingScore}
                onDeleteMatch={handleDeleteMatch}
                onNotify={showNotify}
              />
            )}
            {false && (
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                {readOnly ? (
                  <div style={{ background: "#16232E12", border: "2px solid #16232E", borderRadius: 16, padding: "12px 14px", color: "#16232E", fontSize: 12, fontWeight: 750, textAlign: "center" }}>Mode lihat saja · input dan edit data dinonaktifkan</div>
                ) : (
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                    <button onClick={handleSmartMatch} style={{
                      minHeight: 52, padding: "14px 12px", background: "var(--cr-surface)",
                      border: "2px solid var(--cr-line)", borderRadius: 18, color: "var(--cr-primary)", fontWeight: 900, cursor: "pointer", fontSize: 14, boxShadow: "3px 3px 0 #E4574F",
                    }}>⚡ Quick Match</button>
                    <button onClick={() => handleAutoRound("rotation")} style={{
                      minHeight: 52, padding: "14px 12px", background: "var(--cr-surface)",
                      border: "2px solid var(--cr-line)", borderRadius: 18, color: "var(--cr-ink)", fontWeight: 900, cursor: "pointer", fontSize: 14, boxShadow: "3px 3px 0 #F0B429",
                    }}>🔄 Auto Rounds</button>
                    <button onClick={() => {
                      setManualCourt(courts.find(c => !occupiedCourts.has(c)) || 1);
                      setManualModal(true);
                    }} style={{
                      gridColumn: "1 / -1", minHeight: 48, padding: "12px", background: "var(--cr-surface)", border: "2px solid var(--cr-line)",
                      borderRadius: 18, color: "var(--cr-ink)", fontWeight: 850, cursor: "pointer", fontSize: 14, boxShadow: "3px 3px 0 #16232E",
                    }}>🎯 Manual</button>
                  </div>
                )}


                {!readOnly && autoRoundPreview && (
                  <AutoRoundSchedulePanel
                    preview={autoRoundPreview}
                    players={players}
                    checkedIn={checkedIn}
                    session={currentSession}
                    onShuffle={handleAutoRound}
                    onEdit={handleEditAutoRoundMatch}
                    onConfirm={handleConfirmAutoRounds}
                    onClose={handleCloseAutoRound}
                  />
                )}
                {autoRoundOngoingMatches.length > 0 && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
                      <div style={{ fontSize: 12, color: "#617181", fontWeight: 800, letterSpacing: "0.06em", textTransform: "uppercase" }}>Match Berlangsung · Auto Rounds</div>
                      <span style={{ flex: "0 0 auto", fontSize: 11, fontWeight: 850, color: "#16232E", background: "#F0B42935", border: "1px solid #F0B42980", borderRadius: 999, padding: "4px 8px" }}>{autoRoundOngoingMatches.length} match</span>
                    </div>
                    {autoRoundOngoingMatches.slice().sort((a, b) => (a.scheduleNo || 0) - (b.scheduleNo || 0)).map(match => {
                      const expanded = expandedAutoRoundMatchIds.has(match.id);
                      const playerName = id => players.find(p => p.id === id)?.name || "?";
                      const teamNames = ids => ids.map(playerName).join(" & ");
                      return (
                        <div key={match.id} style={{ background: "#FFFFFF", border: "2px solid #16232E", borderRadius: 12, overflow: "hidden", boxShadow: expanded ? "3px 3px 0 #16232E" : "2px 2px 0 #16232E" }}>
                          <button type="button" aria-expanded={expanded} aria-label={`${expanded ? "Tutup" : "Buka"} detail Match ${match.scheduleNo}`} onClick={() => setExpandedAutoRoundMatchIds(prev => {
                            const next = new Set(prev);
                            if (next.has(match.id)) next.delete(match.id);
                            else next.add(match.id);
                            return next;
                          })} style={{ width: "100%", minHeight: 72, display: "flex", flexDirection: "column", gap: 7, padding: "10px 12px", background: expanded ? "#FAF7F2" : "#FFFFFF", border: "none", color: "#16232E", cursor: "pointer" }}>
                            <span style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
                              <span style={{ fontSize: 13, fontWeight: 900 }}>Match {match.scheduleNo}</span>
                              <span style={{ flex: "0 0 auto", display: "inline-flex", alignItems: "center", gap: 5 }}>
                                <span style={{ fontSize: 10, fontWeight: 850, color: "#44515E", background: "#16232E08", border: "1px solid #16232E20", borderRadius: 999, padding: "3px 7px" }}>{match.mixType === "mixed" ? "Mix Gender" : match.mixType === "same" ? "Gender Sama" : "Bebas"}</span>
                                {match.genderAdjusted && <span style={{ fontSize: 10, fontWeight: 850, color: "#9A6A00", background: "#F0B42924", border: "1px solid #F0B42975", borderRadius: 999, padding: "3px 7px" }}>Penyesuaian</span>}
                                <span aria-hidden="true" style={{ width: 24, height: 24, display: "inline-flex", alignItems: "center", justifyContent: "center", borderRadius: 7, background: "#16232E0D", border: "1px solid #16232E20", fontSize: 12, fontWeight: 900 }}>{expanded ? "▴" : "▾"}</span>
                              </span>
                            </span>
                            <span style={{ width: "100%", display: "grid", gridTemplateColumns: "minmax(0,1fr) 24px minmax(0,1fr)", alignItems: "center", gap: 6 }}>
                              <span style={{ minWidth: 0, textAlign: "left", fontSize: 12, fontWeight: 800, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{teamNames(match.team1)}</span>
                              <span style={{ textAlign: "center", fontSize: 10, fontWeight: 900, color: "#617181" }}>VS</span>
                              <span style={{ minWidth: 0, textAlign: "right", fontSize: 12, fontWeight: 800, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{teamNames(match.team2)}</span>
                            </span>
                          </button>
                          {expanded && (
                            <div style={{ padding: "10px 12px 12px", borderTop: "1px solid #16232E20" }}>
                              <MatchCard
                                match={match}
                                players={players}
                                onScore={readOnly ? null : handleUpdateOngoingScore}
                                onEdit={readOnly ? null : () => setScoreModal(match)}
                              />
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
                <div style={{ fontSize: 12, color: "#617181", fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase" }}>
                  Lapangan Aktif
                </div>

                {courts.map(courtId => {
                  const activeMatch = ongoingMatches.find(m => m.source !== "auto-round" && m.courtId === courtId);
                  return (
                    <div key={courtId} style={{
                      background: "#FFFFFF", border: `2px solid ${activeMatch ? "#E4574F" : "#16232E"}`,
                      borderRadius: 22, padding: 16, boxShadow: "3px 3px 0 #16232E",
                    }}>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: activeMatch ? 10 : 0 }}>
                        <div style={{ fontSize: 14, fontWeight: 800, color: "#16232E" }}>Lapangan {courtId}</div>
                        <div style={{
                          fontSize: 11, color: activeMatch ? "#16232E" : "#617181",
                          background: activeMatch ? "#16232E18" : "#16232E08",
                          border: `1px solid ${activeMatch ? "#16232E35" : "#16232E10"}`,
                          borderRadius: 16, padding: "3px 9px", fontWeight: 700,
                        }}>{activeMatch ? "Berlangsung" : "Kosong"}</div>
                      </div>

                      {activeMatch ? (
                        <MatchCard
                          match={activeMatch}
                          players={players}
                          onScore={readOnly ? null : handleUpdateOngoingScore}
                          onEdit={readOnly ? null : () => setScoreModal(activeMatch)}
                        />
                      ) : (
                        <div style={{ fontSize: 12, color: "#617181", lineHeight: 1.5 }}>
                          Belum ada match di lapangan ini.
                        </div>
                      )}
                    </div>
                  );
                })}

                <div style={{ marginTop: 4 }}>
                  <div style={{ fontSize: 12, color: "#617181", fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", marginBottom: 10 }}>
                    Match Selesai Sesi Ini
                  </div>
                  {currentSessionMatches.filter(m => m.status === "done").length === 0 && (
                    <div style={{
                      textAlign: "center", padding: "24px 16px", background: "#FFFFFF",
                      borderRadius: 22, border: "2px solid #16232E", color: "#617181", fontSize: 13, boxShadow: "3px 3px 0 #16232E",
                    }}>
                      Belum ada match selesai di sesi ini.
                    </div>
                  )}
                  {currentSessionMatches.filter(m => m.status === "done").slice().reverse().map(match => (
                    <DoneMatchCard
                      key={match.id}
                      match={match}
                      players={players}
                      onEdit={readOnly ? null : () => setScoreModal(match)}
                    />
                  ))}
                </div>
              </div>
            )}

            {/* === STANDINGS TAB === */}
            {tab === "standings" && (
              <div>
                {/* KLASEMEN HARIAN */}
                <div id="standings-board" className="cr-share-surface" style={{ width: "100%", maxWidth: "100%", padding: "14px 0", borderRadius: 18, marginBottom: "16px", overflow: "hidden" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 20 }}>
                    <div>
                      <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 28, fontWeight: 700, color: "#16232E", textTransform: "uppercase", letterSpacing: "-0.02em" }}>KLASEMEN HARIAN</div>
                      <div style={{ fontSize: 12, color: "#44515E", marginTop: 4 }}>
                        {new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
                      </div>
                      <div style={{ fontSize: 11, color: "#E4574F", marginTop: 4, fontWeight: 600 }}>
                        {sessions.find(s => s.id === currentSessionId)?.label} · {sessions.find(s => s.id === currentSessionId)?.date}
                      </div>
                    </div>

                  </div>

                  {standingsHarian.length === 0 && (
                    <div style={{ textAlign: "center", padding: "24px 16px", background: "#FFFFFF", borderRadius: 12, border: "2px solid #16232E", marginBottom: 16 }}>
                      <div style={{ fontSize: 24, marginBottom: 8 }}>🏸</div>
                      <div style={{ fontSize: 14, fontWeight: 600, color: "#617181" }}>Belum ada match hari ini</div>
                      <div style={{ fontSize: 12, color: "#778899", marginTop: 4 }}>Mulai Smart Match atau Manual untuk mulai sesi ini</div>
                    </div>
                  )}

                  {standingsHarian.length > 0 && (
                    <div>
                      {/* WOW / SOS / MBG / AFK */}
                      {standingsHarian.length >= 2 && (() => {
                        const wow = standingsHarian[0];
                        const sos = standingsHarian[standingsHarian.length - 1];
                        return (
                          <div style={{ marginBottom: 16, display: "flex", flexDirection: "column", gap: 6 }}>
                            <div style={{ background: "linear-gradient(135deg, #9A6A0015, #F0B42915)", border: "1px solid #9A6A0030", borderRadius: 16, padding: "8px 12px" }}>
                              <strong style={{ color: "#9A6A00", fontSize: "14px", display: "block", marginBottom: "2px" }}>🏆 WOW HARI INI: {wow.name}</strong>
                              <span style={{ fontSize: "11px", color: "#44515E" }}>(Winner Over Winners) · {wow.P} pts · {wow.W}W {wow.L}L · Diff {wow.diff >= 0 ? "+" : ""}{wow.diff}</span>
                            </div>
                            <div style={{ display: "flex", gap: 6 }}>
                              <div style={{ flex: 1, background: "#E4574F15", border: "1px solid #E4574F30", borderRadius: 16, padding: "8px 12px" }}>
                                <strong style={{ color: "#E4574F", fontSize: "13px", display: "block", marginBottom: "2px" }}>🤡 SOS HARI INI: {sos.name}</strong>
                                <span style={{ fontSize: "11px", color: "#44515E" }}>(Score Optimization Needed) · {sos.P} pts</span>
                              </div>
                              {mbgPlayer && (
                                <div style={{ flex: 1, background: "var(--cr-accent-blue-soft)", border: "1px solid var(--cr-accent-blue-line)", borderRadius: 16, padding: "8px 12px" }}>
                                  <strong style={{ color: "var(--cr-accent-blue)", fontSize: "13px", display: "block", marginBottom: "2px" }}>📈 MBG HARI INI: {mbgPlayer.name}</strong>
                                  <span style={{ fontSize: "11px", color: "#44515E" }}>(Making Big Gains) · +{mbgPlayer.totalR}R</span>
                                </div>
                              )}
                            </div>
                            {afkPlayer && (
                              <div style={{ background: "#44515E15", border: "1px solid #44515E30", borderRadius: 16, padding: "8px 12px" }}>
                                <strong style={{ color: "#44515E", fontSize: "13px", display: "block", marginBottom: "2px" }}>😴 AFK HARI INI: {afkPlayer.name}</strong>
                                <span style={{ fontSize: "11px", color: "#617181" }}>(Attendance Frequency Kurang) · {afkPlayer.matchesPlayed} match · {afkPlayer.M} pts kompensasi</span>
                              </div>
                            )}
                          </div>
                        );
                      })()}

                      {/* TABLE */}
                      <div className="cr-standings-wrap">
                        <table className="cr-standings-table cr-standings-daily" style={{ borderCollapse: "collapse", fontSize: 12 }}>
                          <thead>
                            <tr style={{ borderBottom: "1px solid #16232E14" }}>
                              {["#", "Pemain", "Tier", "P", "M", "W-D-L", "TS", "Diff", "+M", "R"].map((h, i) => (
                                <th key={i} style={{ padding: "6px 6px", color: "#617181", fontWeight: 600, textAlign: i === 1 ? "left" : "center", whiteSpace: "nowrap" }}>{h}</th>
                              ))}
                            </tr>
                          </thead>
                          <tbody>
                            {standingsHarian.map((p, idx) => {
                              const medal = ["🥇","🥈","🥉"][idx] || "";
                              const isTop = idx === 0;
                              const isBot = idx === standingsHarian.length - 1;
                              return (
                                <tr key={p.id} style={{ borderBottom: "1px solid #16232E06", background: isTop ? "#9A6A0008" : isBot ? "#E4574F08" : "none" }}>
                                  <td style={{ padding: "10px 6px", textAlign: "center" }}>{medal || <span style={{ color: "#617181", fontSize: 11 }}>{idx + 1}</span>}</td>
                                  <td style={{ padding: "10px 8px", fontSize: 13, fontWeight: 500, whiteSpace: "nowrap", cursor: "pointer" }}
                                    onClick={() => { setStatsPlayerId(p.id); setStatsFrom("app"); setScreen("stats"); }}>
                                  <span style={{ borderBottom: "1px dashed #E4574F60" }}>{p.name}</span>
                                  </td>
                                  <td style={{ padding: "10px 6px", textAlign: "center" }}><TierBadge tier={p.tier} small /></td>
                                  <td style={{ padding: "10px 6px", textAlign: "center", fontWeight: 900, color: "#E4574F", fontFamily: "'DM Mono', monospace", fontSize: 13 }}>{p.P}</td>
                                  <td style={{ padding: "10px 6px", textAlign: "center", color: "#44515E" }}>{p.matchesPlayed}</td>
                                  <td style={{ padding: "10px 6px", textAlign: "center", fontFamily: "'DM Mono', monospace", fontWeight: 400 }}><span style={{ color: "#16232E" }}>{p.W}</span><span style={{ color: "#617181" }}>-</span><span style={{ color: "#9A6A00" }}>{p.D}</span><span style={{ color: "#617181" }}>-</span><span style={{ color: "#E4574F" }}>{p.L}</span></td>
                                  <td style={{ padding: "10px 6px", textAlign: "center", fontWeight: 400, color: "#44515E", fontFamily: "'DM Mono', monospace" }}>{p.totalFor}</td>
                                  <td style={{ padding: "10px 6px", textAlign: "center", fontWeight: 400, color: p.diff >= 0 ? "#16232E" : "#E4574F", fontFamily: "'DM Mono', monospace" }}>{p.diff >= 0 ? "+" : ""}{p.diff}</td>
                                  <td style={{ padding: "10px 6px", textAlign: "center", fontWeight: 400, color: "#9A6A00", fontFamily: "'DM Mono', monospace" }}>{p.M > 0 ? `+${p.M}` : "—"}</td>
                                  <td style={{ padding: "10px 6px", textAlign: "center", fontWeight: 400, color: "#16232E", fontFamily: "'DM Mono', monospace" }}>{p.totalR > 0 ? `+${p.totalR}` : "—"}</td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                      <StandingsLegend showMPlus={useMCompensation} />
                    </div>
                  )}
                </div>

                {/* Share */}
                {standingsHarian.length > 0 && (
                  <div style={{ display: "flex", gap: 8, marginTop: 8, paddingBottom: 16 }}>
                    <button onClick={handleDownloadImage} disabled={isProcessing !== null} style={{
                      flex: 1, background: "#FFFFFF", border: "2px solid #16232E", borderRadius: 18, padding: "13px 10px",
                      cursor: isProcessing !== null ? "default" : "pointer", color: "#44515E", fontWeight: 800, fontSize: 13,
                    }}>{isProcessing === "download" ? "⏳" : "💾"} Simpan Gambar</button>
                    <button onClick={handleShareWA} disabled={isProcessing !== null} style={{
                      flex: 1, background: isProcessing === "share" ? "#778899" : "linear-gradient(135deg, #16232E, #2D4F80)",
                      border: "none", borderRadius: 12, padding: "13px 10px", cursor: isProcessing !== null ? "default" : "pointer",
                      color: "#fff", fontWeight: 700, fontSize: 13,
                    }}>{isProcessing === "share" ? "⏳" : "💬"} Kirim WA</button>
                  </div>
                )}
              </div>
            )}

            {/* === STATISTIK SESI TAB === */}
            {tab === "stats" && (() => {
              const sessionPlayers = players.filter(p => checkedIn.has(p.id));
              const sessionDone = currentSessionMatches.filter(m => m.status === "done");
              return (
                <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                  <div style={{ background: "#FFFFFF", border: "2px solid #16232E", borderRadius: 18, padding: "14px 16px", boxShadow: "3px 3px 0 #16232E" }}>
                    <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 26, fontWeight: 700, color: "#16232E", textTransform: "uppercase" }}>Statistik Arena</div>
                    <div style={{ fontSize: 12, color: "#44515E", marginTop: 4 }}>All Time · {sessions.length} sesi · {matches.filter(m => m.status === "done").length} match selesai</div>
                  </div>
                    <div style={{ fontSize: 12, color: "#617181", fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase" }}>Pemain Hadir Sesi Ini</div>
                  {sessionPlayers.length === 0 && (
                    <div style={{ textAlign: "center", padding: "28px 16px", background: "#FFFFFF", borderRadius: 18, border: "2px solid #16232E", color: "#617181", fontSize: 13 }}>Belum ada pemain check-in di sesi ini.</div>
                  )}
                  {sessionPlayers.map(p => {
                    const myMatches = sessionDone.filter(m => [...m.team1, ...m.team2].includes(p.id));
                    let wins = 0, draws = 0, losses = 0, totalFor = 0, totalAgainst = 0, totalPts = 0;
                    myMatches.forEach(m => {
                      const onT1 = m.team1.includes(p.id);
                      const res = calcMatchResult(m, players);
                      const won = onT1 ? res.t1Win : res.t2Win;
                      const lost = onT1 ? res.t2Win : res.t1Win;
                      if (won) wins++; else if (lost) losses++; else draws++;
                      const myScore = onT1 ? res.t1Score : res.t2Score;
                      const oppScore = onT1 ? res.t2Score : res.t1Score;
                      totalFor += myScore;
                      totalAgainst += oppScore;
                      totalPts += myScore + (onT1 ? res.t1S : res.t2S) + (onT1 ? res.t1R : res.t2R);
                    });
                    const winRate = myMatches.length > 0 ? Math.round((wins / myMatches.length) * 100) : 0;
                    const diff = totalFor - totalAgainst;
                    return (
                      <div key={p.id} onClick={() => { setStatsPlayerId(p.id); setStatsFrom("app"); setScreen("stats"); }} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", background: "#FFFFFF", border: "2px solid #16232E", borderRadius: 16, boxShadow: "3px 3px 0 #16232E", cursor: "pointer" }}>
                        <div style={{ width: 38, height: 38, borderRadius: 12, background: "#E4574F20", border: "2px solid #E4574F", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 900, color: "#E4574F" }}>{p.name.slice(0,2).toUpperCase()}</div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                            <div style={{ fontSize: 13, fontWeight: 800, color: "#16232E", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{p.name}</div>
                            <TierBadge tier={p.tier} small />
                          </div>
                          <div style={{ fontSize: 11, color: "#617181", marginTop: 2 }}>{myMatches.length} match · {wins}W {draws}D {losses}L · Diff {diff >= 0 ? "+" : ""}{diff}</div>
                        </div>
                        <div style={{ textAlign: "right", minWidth: 54 }}>
                          <div style={{ fontSize: 15, fontWeight: 900, color: "#E4574F", fontFamily: "'DM Mono', monospace" }}>{totalPts}</div>
                          <div style={{ fontSize: 9, color: "#778899" }}>pts</div>
                        </div>
                        <div style={{ textAlign: "right", minWidth: 42 }}>
                          <div style={{ fontSize: 13, fontWeight: 800, color: winRate >= 50 ? "#16232E" : "#E4574F", fontFamily: "'DM Mono', monospace" }}>{winRate}%</div>
                          <div style={{ fontSize: 9, color: "#778899" }}>win</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })()}

            {/* === SETTINGS TAB === */}
            {!readOnly && tab === "settings" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>

                {/* Info Sesi Aktif */}
                <div style={{ background: "#FFFFFF", border: "1px solid #16232E30", borderRadius: 14, padding: "9px 12px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontSize: 10, fontWeight: 800, color: "#617181", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 2 }}>Sesi Aktif</div>
                    <div style={{ fontSize: 12, color: "#16232E", fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                      {sessions.find(s => s.id === currentSessionId)?.label} · {sessions.find(s => s.id === currentSessionId)?.date}
                    </div>
                  </div>
                  <div style={{ flex: "0 0 auto", fontSize: 11, color: "#16232E", fontWeight: 800, background: "#16232E12", border: "1px solid #16232E30", borderRadius: 999, padding: "4px 8px" }}>
                    {sessions.findIndex(s => s.id === currentSessionId) + 1}/{sessions.length}
                  </div>
                </div>

                {/* Jumlah Lapangan */}
                <div style={{ background: "#FFFFFF", borderRadius: 22, padding: 16, border: "2px solid #16232E", boxShadow: "3px 3px 0 #16232E" }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: "#617181", letterSpacing: "0.06em", textTransform: "uppercase", marginBottom: 12 }}>🏟 Lapangan</div>
                  <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                    <button onClick={handleReduceCourt} style={{ width: 36, height: 36, borderRadius: 9, background: "#16232E10", border: "1px solid #16232E20", color: "#16232E", fontSize: 20, cursor: "pointer", fontWeight: 700 }}>−</button>
                    <div style={{ flex: 1, textAlign: "center" }}>
                      <div style={{ fontSize: 28, fontWeight: 800, color: "#16232E", fontFamily: "'DM Mono', monospace" }}>{numCourts}</div>
                      <div style={{ fontSize: 11, color: "#617181" }}>lapangan aktif</div>
                    </div>
                    <button onClick={() => setNumCourts(n => n + 1)} style={{ width: 36, height: 36, borderRadius: 9, background: "#16232E10", border: "1px solid #16232E20", color: "#16232E", fontSize: 20, cursor: "pointer", fontWeight: 700 }}>+</button>
                  </div>
                </div>

                {/* Check-in cepat */}
                <div style={{ background: "#FFFFFF", borderRadius: 22, padding: 16, border: "2px solid #16232E", boxShadow: "3px 3px 0 #16232E" }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: "#617181", letterSpacing: "0.06em", textTransform: "uppercase" }}>👥 Check-in</div>
                    <div style={{ display: "flex", gap: 6 }}>
                      <button onClick={() => setCheckedIn(new Set(players.map(p => p.id)))} style={{ background: "#E4574F20", border: "2px solid #E4574F", borderRadius: 7, padding: "4px 10px", color: "#E4574F", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>Semua Hadir</button>
                      <button onClick={() => {
                        setCheckedIn(new Set(activePlayers));
                        if (activePlayers.size > 0) showNotify(`${activePlayers.size} pemain yang sedang bermain tetap check-in.`, "error");
                      }} style={{ background: "#16232E08", border: "1px solid #16232E15", borderRadius: 7, padding: "4px 10px", color: "#617181", fontSize: 11, cursor: "pointer" }}>Kosongkan</button>
                    </div>
                  </div>
                  <div style={{ fontSize: 12, color: "#617181", marginBottom: activePlayers.size > 0 ? 5 : 10 }}>{checkedIn.size} dari {players.length} hadir</div>
                  {activePlayers.size > 0 && (
                    <div style={{ fontSize: 10, color: "#9A6A00", lineHeight: 1.35, marginBottom: 10 }}>Pemain berlabel MAIN sedang berada di lapangan. Ganti pemain atau selesaikan match sebelum mengubah kehadirannya.</div>
                  )}
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                    {players.map(p => {
                      const isIn = checkedIn.has(p.id);
                      const isPlaying = activePlayers.has(p.id);
                      return (
                        <button type="button" key={p.id} title={isPlaying ? `${p.name} sedang bermain` : (isIn ? `Uncheck ${p.name}` : `Check-in ${p.name}`)} onClick={() => {
                          if (isPlaying) {
                            showNotify(`${p.name} sedang bermain. Ganti pemain atau selesaikan match terlebih dahulu.`, "error");
                            return;
                          }
                          toggleCheckIn(p.id);
                        }} style={{
                          display: "flex", alignItems: "center", gap: 6, padding: "6px 10px",
                          minHeight: 36, background: isPlaying ? "#F0B42924" : isIn ? "#E4574F20" : "#16232E08",
                          border: `1.5px solid ${isPlaying ? "#F0B429" : isIn ? "#E4574F" : "#16232E18"}`,
                          borderRadius: 8, cursor: isPlaying ? "help" : "pointer",
                        }}>
                          <span style={{ fontSize: 12, color: isIn ? "#16232E" : "#617181", fontWeight: isIn ? 700 : 500 }}>{p.name}</span>
                          <span aria-hidden="true" style={{ flex: "0 0 auto", width: 16, height: 16, display: "inline-flex", alignItems: "center", justifyContent: "center", borderRadius: 5, background: isIn ? "#E4574F" : "#FFFFFF", border: `1px solid ${isIn ? "#E4574F" : "#16232E35"}`, color: "#FFFFFF", fontSize: 10, fontWeight: 900 }}>{isIn ? "✓" : ""}</span>
                          {isPlaying && <span style={{ flex: "0 0 auto", fontSize: 8, lineHeight: 1, color: "#5A3A00", background: "#F0B42955", borderRadius: 4, padding: "3px 4px", fontWeight: 900 }}>MAIN</span>}
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Kompensasi M */}
                <div style={{ background: "#FFFFFF", borderRadius: 14, padding: "10px 12px", border: `1.5px solid ${useMCompensation ? "#2E8B57" : "#16232E30"}`, boxShadow: "2px 2px 0 #16232E", marginTop: -4 }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
                    <div style={{ minWidth: 0 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 2 }}>
                        <span style={{ width: 24, height: 24, borderRadius: 8, display: "inline-flex", alignItems: "center", justifyContent: "center", background: useMCompensation ? "#DDF7E8" : "#16232E10", color: useMCompensation ? "#0F5132" : "#44515E", border: `1px solid ${useMCompensation ? "#2E8B5740" : "#16232E20"}`, fontFamily: "'DM Mono', monospace", fontSize: 11, fontWeight: 900 }}>M</span>
                        <span style={{ fontSize: 12, fontWeight: 850, color: "#16232E", letterSpacing: "0.03em", textTransform: "uppercase" }}>Kompensasi Harian</span>
                      </div>
                      <div style={{ fontSize: 11, color: "#617181", lineHeight: 1.35 }}>
                        {useMCompensation ? "+10 poin untuk pemain yang match-nya lebih sedikit." : "Tidak dipakai di sesi ini."}
                      </div>
                    </div>
                    <button type="button" onClick={() => setUseMCompensation(!useMCompensation)} aria-pressed={useMCompensation} style={{ flex: "0 0 auto", width: 52, minHeight: 34, borderRadius: 999, border: `2px solid ${useMCompensation ? "#2E8B57" : "#16232E"}`, background: useMCompensation ? "#2E8B57" : "#FFFFFF", padding: 3, cursor: "pointer", boxShadow: "1.5px 1.5px 0 #16232E", transition: "all 0.18s ease-in-out" }}>
                      <span style={{ display: "block", width: 24, height: 24, borderRadius: 999, background: "#FFFFFF", transform: useMCompensation ? "translateX(18px)" : "translateX(0)", transition: "transform 0.18s ease-in-out", boxShadow: "1px 1px 0 #16232E" }} />
                    </button>
                  </div>
                </div>


                {/* Reset Danger Zone */}
                <div style={{ marginTop: 8, paddingTop: 16, borderTop: "1px dashed #16232E15", display: "flex", flexDirection: "column", gap: 10 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: "#617181", letterSpacing: "0.06em", textTransform: "uppercase" }}>Zona Reset</div>
                  <div style={{ background: "#F0B42910", border: "1px solid #F0B42935", borderRadius: 12, padding: 12 }}>
                    <button onClick={handleResetCurrentSession} style={{ width: "100%", background: "#F0B42920", border: "2px solid #F0B429", color: "#9A6A00", padding: "11px", borderRadius: 10, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                      ↺ Reset Sesi Ini
                    </button>
                    <div style={{ fontSize: 11, color: "#44515E", lineHeight: 1.45, marginTop: 8 }}>
                      Menghapus match dan daftar hadir sesi aktif. Pemain, tier, dan sesi lain tetap aman.
                    </div>
                  </div>

                
                  {!readOnly && sessions.length > 1 && (
                    <div style={{ background: "#FFE9EC", border: "1px solid #E4574F45", borderRadius: 12, padding: 12 }}>
                      <button onClick={() => handleDeleteSession(currentSessionId)} style={{ width: "100%", background: "#FFFFFF", border: "2px solid #E4574F", color: "#E4574F", padding: "11px", borderRadius: 10, fontSize: 12, fontWeight: 800, cursor: "pointer" }}>
                        ⌫ Hapus Sesi Ini
                      </button>
                      <div style={{ fontSize: 11, color: "#44515E", lineHeight: 1.45, marginTop: 8 }}>
                        Menghapus sesi aktif dari arena. Sesi lain, pemain, dan data All Time dari sesi lain tetap aman.
                      </div>
                    </div>
                  )}</div>

              </div>
            )}
          </div>

          <nav className="cr-bottom-nav" aria-label="Navigasi pertandingan">
            {[
              { key: "courts", icon: "🏸", text: "Match" },
              { key: "standings", icon: "📋", text: "Klasemen" },
              { key: "stats", icon: "📊", text: "Statistik" },
            ].map(t => (
              <button key={t.key} type="button" className={`cr-bottom-tab ${tab === t.key ? "cr-bottom-tab-active" : ""}`} onClick={() => setTab(t.key)} aria-current={tab === t.key ? "page" : undefined}>
                <span aria-hidden="true">{t.icon}</span>
                <span>{t.text}</span>
              </button>
            ))}
          </nav>

          {/* TURN BANNER */}
          {turnBanner && (
            <div style={{
              position: "fixed", top: 0, left: 0, right: 0, zIndex: 2000,
              background: "#E4574F",
              padding: "14px 20px", textAlign: "center",
              boxShadow: "0 4px 32px #E4574F80",
              animation: "slideDown 0.4s ease",
              cursor: "pointer",
            }} onClick={() => setTurnBanner(null)}>
              <div style={{ fontSize: 11, color: "#E4574F", fontWeight: 600, letterSpacing: "0.1em", marginBottom: 4 }}>⚡ GILIRAN BERMAIN — LAPANGAN {turnBanner.court}</div>
              <div style={{ fontSize: 16, fontWeight: 800, color: "#fff" }}>
                {turnBanner.team1.join(" & ")} <span style={{ color: "#E4574F", fontWeight: 400 }}>vs</span> {turnBanner.team2.join(" & ")}
              </div>
              <div style={{ fontSize: 11, color: "#E4574F", marginTop: 4 }}>Tap di mana saja untuk tutup</div>
            </div>
          )}

          {/* H2H MODAL */}
          {h2hPlayer && (() => {
            const h2h = buildH2H(h2hPlayer.id);
            const getPlayer = id => players.find(p => p.id === id);
            return (
              <div style={{ position: "fixed", inset: 0, background: "#000000dd", zIndex: 1500, display: "flex", alignItems: "flex-end", justifyContent: "center" }} onClick={() => setH2hPlayer(null)}>
                <div style={{ background: "#FFFFFF", borderRadius: "28px 28px 0 0", padding: 20, width: "100%", maxWidth: 430, border: "2px solid #16232E", maxHeight: "85vh", overflowY: "auto" }} onClick={e => e.stopPropagation()}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
                    <div style={{ width: 40, height: 40, borderRadius: 10, background: "linear-gradient(135deg, #E4574F30, #E4574F30)", border: "2px solid #E4574F", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, fontWeight: 700, color: "#E4574F" }}>{h2hPlayer.name.slice(0, 2).toUpperCase()}</div>
                    <div>
                      <div style={{ fontSize: 15, fontWeight: 700, color: "#16232E" }}>{h2hPlayer.name}</div>
                      <div style={{ fontSize: 12, color: "#44515E" }}><TierBadge tier={h2hPlayer.tier} small /> · {h2h.doneMatches.length} match dimainkan</div>
                    </div>
                  </div>

                  {/* Streak badge */}

          {!readOnly && smartPreview && (

              onSave={(id, newName, newTier, newGender, changeType) => {

                  if (p.id !== id) return p;

                      from: p.tier, to: newTier,

                      type: changeType, // "koreksi" | "resmi"

                    updated.tierHistory = [...(p.tierHistory||[]), histEntry];
                  }
                  return updated;
                }));
                // If koreksi: patch tierSnapshot on all matches this session
                if (tierChanged && changeType === "koreksi") {
                  setMatches(prev => prev.map(m => {

                    const isCurrentSessionMatch = m.sessionId === currentSessionId || (!m.sessionId && currentSessionId === firstSessionId);

                  }));
                  showNotify(`Koreksi tier ${player.tier}→${newTier} diterapkan ke semua match sesi ini`);
                } else if (tierChanged) {
                  showNotify(`${newName} resmi berubah tier ${player.tier}→${newTier} mulai match berikutnya`);

              zIndex: 1000, width: "max-content", maxWidth: "calc(100% - 32px)", whiteSpace: "normal", textAlign: "center", boxShadow: "0 4px 24px #00000060",

                  {confirmDialog.title}

                  {confirmDialog.message}
                </div>
                <div style={{ display: "flex", gap: 10 }}>
                  <button onClick={() => setConfirmDialog(null)} style={{
                    flex: 1, padding: "12px", borderRadius: 10, background: "#16232E10",
                    border: "none", color: "#16232E", fontWeight: 600, cursor: "pointer", fontFamily: "'DM Sans', sans-serif"
                  }}>Batal</button>
                  <button onClick={confirmDialog.onConfirm} style={{
                    flex: 1, padding: "12px", borderRadius: 10,
                    background: confirmDialog.isDanger ? "#FFE9EC" : "linear-gradient(135deg, #E4574F, #E4574F)",
                    border: confirmDialog.isDanger ? "2px solid #E4574F" : "none", color: confirmDialog.isDanger ? "#E4574F" : "#fff", fontWeight: 700, cursor: "pointer", fontFamily: "'DM Sans', sans-serif"
                  }}>{confirmDialog.confirmText || "Yakin"}</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );    }

    function MatchWorkspace({ session, sessions, players, checkedIn, matches, readOnly, useMCompensation, onUpdateSession, onTogglePlayer, onSelectAll, onClearPlayers, onToggleCompensation, onGenerate, onManualMatch, onEditMatch, onUpdateScore, onDeleteMatch, onNotify }) {
      const latestConfiguredMatch = matches.slice().reverse().find(match => match.pairFormat || match.generationPattern);
      const initialPairFormat = latestConfiguredMatch?.pairFormat === "manual" ? "" : (latestConfiguredMatch?.pairFormat || ({ mixed: "mix", same: "gender", free: "random" }[latestConfiguredMatch?.mixType]) || "");
      const initialPattern = ["rotation", "tier"].includes(latestConfiguredMatch?.generationPattern) ? latestConfiguredMatch.generationPattern : "";
      const [openSteps, setOpenSteps] = React.useState(() => new Set(matches.length > 0 ? [4] : [1, 2, 3]));
      const [mode, setMode] = React.useState(latestConfiguredMatch?.generationPattern === "manual" ? "manual" : "auto");
      const [pairFormat, setPairFormat] = React.useState(initialPairFormat);
      const [pattern, setPattern] = React.useState(initialPattern);
      const [count, setCount] = React.useState("5");
      const [action, setAction] = React.useState(matches.length > 0 ? "add" : "replace");
      const [generationPreview, setGenerationPreview] = React.useState(null);
      const [manualSelected, setManualSelected] = React.useState([]);
      const [matchShareBusy, setMatchShareBusy] = React.useState(null);
      const matchShareRef = React.useRef(null);
      const selectedPlayers = players.filter(player => checkedIn.has(player.id));
      const checkedInKey = [...checkedIn].sort((a, b) => a - b).join(",");
      const matchListKey = matches.map(match => `${match.id}:${match.scheduleNo || ""}`).join(",");
      const sortedMatches = matches.map((match, originalIndex) => ({
        match,
        displayNo: Number(match.scheduleNo) || originalIndex + 1,
        originalIndex,
      })).sort((a, b) => a.displayNo - b.displayNo || a.originalIndex - b.originalIndex);
      const playerName = id => players.find(player => player.id === id)?.name || "?";
      const hasScore = match => (match.games || []).some(game => Number(game.t1) > 0 || Number(game.t2) > 0);
      const scoreText = match => (match.games || []).map(game => `${Number(game.t1) || 0}-${Number(game.t2) || 0}`).join(" · ");
      const pairLabels = { mix: "Mix Pair", gender: "Gender Pair", random: "Random Pair", manual: "Manual", mixed: "Mix Pair", same: "Gender Pair", free: "Random Pair" };
      const patternLabels = { rotation: "Rotation Shuffle", tier: "Tier Shuffle", manual: "Manual" };
      const settingSummary = mode === "manual"
        ? `Manual · ${manualSelected.length} pemain dipilih`
        : `${pairLabels[pairFormat] || "Pilih pasangan"} · ${patternLabels[pattern] || "Pilih pola"} · ${count || 0} match`;
      const panelStyle = { background: "rgba(255,255,255,0.48)", WebkitBackdropFilter: "blur(22px) saturate(138%) contrast(103%)", backdropFilter: "blur(22px) saturate(138%) contrast(103%)", border: "1px solid rgba(255,255,255,0.9)", borderRadius: 16, padding: 14, boxShadow: "0 12px 30px rgba(22,35,46,0.11), inset 0 0 0 1px rgba(22,35,46,0.07), inset 0 1px 0 rgba(255,255,255,0.98), inset 0 -1px 0 rgba(22,35,46,0.08)" };
      const stepPanelStyle = { ...panelStyle, padding: 0, overflow: "hidden" };
      const isOpen = step => openSteps.has(step);
      const toggleStep = step => setOpenSteps(prev => {
        const next = new Set(prev);
        if (next.has(step)) next.delete(step); else next.add(step);
        return next;
      });
      const openOnly = (...steps) => setOpenSteps(new Set(steps));
      const stepHeader = (step, title, summary, disabled = false) => (
        <button type="button" onClick={() => !disabled && toggleStep(step)} aria-expanded={isOpen(step)} disabled={disabled} style={{ width: "100%", minHeight: 62, display: "grid", gridTemplateColumns: "44px minmax(0,1fr) 28px", alignItems: "center", gap: 9, padding: "10px 12px", border: "none", background: isOpen(step) ? "#FAF7F2" : "#FFFFFF", color: "#16232E", cursor: disabled ? "default" : "pointer", textAlign: "left" }}>
          <span style={{ width: 40, height: 40, display: "inline-flex", alignItems: "center", justifyContent: "center", borderRadius: 9, background: disabled ? "#16232E0A" : "#E4574F12", border: `1.5px solid ${disabled ? "#16232E20" : "#E4574F55"}`, color: disabled ? "#778899" : "#E4574F", fontSize: 12, fontWeight: 900 }}>{step}</span>
          <span style={{ minWidth: 0 }}><span style={{ display: "block", fontSize: 13, fontWeight: 900 }}>{title}</span><span style={{ display: "block", marginTop: 2, fontSize: 10, color: "#617181", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{summary}</span></span>
          <span aria-hidden="true" style={{ width: 26, height: 26, display: "inline-flex", alignItems: "center", justifyContent: "center", borderRadius: 7, background: "#16232E0A", border: "1px solid #16232E20", color: "#16232E", fontSize: 12, fontWeight: 900 }}>{disabled ? "·" : isOpen(step) ? "−" : "+"}</span>
        </button>

      const choiceButton = (selected, onClick, title, note) => (
        <button type="button" onClick={onClick} disabled={readOnly} style={{ width: "100%", minHeight: 58, padding: "9px 10px", textAlign: "left", background: selected ? "#E4574F14" : "#FFFFFF", border: `2px solid ${selected ? "#E4574F" : "#16232E30"}`, borderRadius: 10, color: "#16232E", cursor: readOnly ? "default" : "pointer" }}>
          <span style={{ display: "block", fontSize: 12, fontWeight: 900 }}>{title}</span>

        </button>
      );

      React.useEffect(() => {
        setManualSelected(prev => prev.filter(id => checkedIn.has(id)));
      }, [checkedIn]);

      React.useEffect(() => {
        setGenerationPreview(null);
      }, [session?.id, mode, pairFormat, pattern, count, action, checkedInKey, matchListKey]);

      const toggleManualPlayer = id => {
        setManualSelected(prev => {
          const next = prev.includes(id) ? prev.filter(value => value !== id) : (prev.length < 4 ? [...prev, id] : prev);
          return next;
        });
      };

      const finishGenerate = () => {
        setGenerationPreview(null);
        setAction("add");
        openOnly(4);
        setTimeout(() => document.getElementById("generated-matches")?.scrollIntoView({ behavior: "smooth", block: "start" }), 50);
      };

      const requestGenerationPreview = () => {
        const previewConfig = { pairFormat, pattern, count, action: matches.length ? action : "replace" };
        onGenerate({ ...previewConfig, previewOnly: true }, generated => {
          setGenerationPreview({ config: previewConfig, matches: generated });
          setTimeout(() => document.getElementById("generation-preview")?.scrollIntoView({ behavior: "smooth", block: "nearest" }), 50);
        });
      };

      const confirmGenerationPreview = () => {
        if (!generationPreview?.matches?.length) return;
        onGenerate({
          ...generationPreview.config,
          previewMatches: generationPreview.matches,
          previewConfirmed: true,
        }, finishGenerate);
      };

      const buildGeneratedMatchesShareText = () => {
        const title = session?.label || "Generated Matches";
        const date = session?.date ? `\n${session.date}` : "";
        const lines = sortedMatches.map(({ match, displayNo }) => {
          const score = scoreText(match) || "0-0";
          return `Match ${displayNo}: ${match.team1.map(playerName).join(" & ")} vs ${match.team2.map(playerName).join(" & ")} (${score})`;
        });
        return `*${title}*${date}\n${matches.length} match\n\n${lines.join("\n")}`;
      };

      const getGeneratedMatchesBlob = async () => {
        const element = matchShareRef.current;
        if (!element || !window.html2canvas) throw new Error("Daftar match belum siap");
        return createGlassExportBlob(element);
      };

      const generatedMatchesFilename = () => {
        const safeLabel = (session?.label || "Generated-Matches").replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "");
        return `${safeLabel || "Generated-Matches"}-CourtRank.jpg`;
      };

      const handleDownloadGeneratedMatches = async () => {
        if (!matches.length || matchShareBusy) return;
        setMatchShareBusy("image");
        try {
          const blob = await getGeneratedMatchesBlob();
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = generatedMatchesFilename();
          document.body.appendChild(anchor);
          anchor.click();
          document.body.removeChild(anchor);
          URL.revokeObjectURL(url);
          onNotify?.("Gambar semua match berhasil disimpan.", "success");
        } catch (error) {
          console.error(error);
          onNotify?.("Gagal membuat gambar match.", "error");
        } finally {
          setMatchShareBusy(null);
        }
      };

      const handleShareGeneratedMatchesWA = async () => {
        if (!matches.length || matchShareBusy) return;
        setMatchShareBusy("wa");
        try {
          const blob = await getGeneratedMatchesBlob();
          const file = new File([blob], generatedMatchesFilename(), { type: "image/jpeg" });
          const text = buildGeneratedMatchesShareText();
          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
