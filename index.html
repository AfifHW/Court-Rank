        } catch (error) {
          if (error?.name !== "AbortError") {
            console.error(error);
            onNotify?.("Gagal membagikan match ke WhatsApp.", "error");
          }
        } finally {
          setMatchShareBusy(null);
        }
      };

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {readOnly && <div style={{ background: "#16232E12", border: "2px solid #16232E", borderRadius: 12, padding: "10px 12px", color: "#16232E", fontSize: 12, fontWeight: 800, textAlign: "center" }}>Mode lihat saja</div>}

          <section style={stepPanelStyle}>
            {stepHeader(1, "Session", `${session?.label || "Tanpa nama"}${session?.date ? ` · ${session.date}` : ""}`)}
            {isOpen(1) && <div style={{ padding: "4px 14px 14px", borderTop: "1px solid #16232E18" }}>
            <label style={{ display: "block", fontSize: 10, color: "#617181", fontWeight: 800, marginBottom: 5 }}>NAMA SESI</label>
            <input value={session?.label || ""} disabled={readOnly} onChange={event => onUpdateSession("label", event.target.value)} style={{ width: "100%", minHeight: 42, border: "2px solid #16232E", borderRadius: 10, padding: "9px 11px", background: "#FAF7F2", color: "#16232E", fontSize: 13, fontWeight: 800, outline: "none", marginBottom: 10 }} />
            <label style={{ display: "block", fontSize: 10, color: "#617181", fontWeight: 800, marginBottom: 5 }}>TANGGAL</label>
            <input value={session?.date || ""} disabled={readOnly} onChange={event => onUpdateSession("date", event.target.value)} placeholder="Contoh: 5 Oktober 2026" style={{ width: "100%", minHeight: 42, border: "2px solid #16232E", borderRadius: 10, padding: "9px 11px", background: "#FAF7F2", color: "#16232E", fontSize: 12, outline: "none", marginBottom: 10 }} />
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginTop: 2, paddingTop: 12, borderTop: "1px solid #16232E20" }}>
              <div><div style={{ fontSize: 11, color: "#16232E", fontWeight: 850 }}>Kompensasi Harian</div><div style={{ fontSize: 10, color: "#617181", marginTop: 2 }}>{useMCompensation ? "Aktif untuk sesi ini" : "Tidak digunakan"}</div></div>
              <button type="button" onClick={onToggleCompensation} disabled={readOnly} aria-pressed={useMCompensation} style={{ width: 48, height: 30, borderRadius: 999, border: "2px solid #16232E", background: useMCompensation ? "#2E8B57" : "#FFFFFF", padding: 2, cursor: readOnly ? "default" : "pointer" }}><span style={{ display: "block", width: 22, height: 22, borderRadius: 999, background: "#FFFFFF", border: "1px solid #16232E", transform: useMCompensation ? "translateX(18px)" : "translateX(0)", transition: "transform .15s" }} /></button>
            </div>
            </div>}
          </section>

          <section style={stepPanelStyle}>
            {stepHeader(2, "Players", `${selectedPlayers.length} dari ${players.length} pemain dipilih`)}
            {isOpen(2) && <div style={{ padding: "12px 14px 14px", borderTop: "1px solid #16232E18" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 10 }}>
              <span style={{ fontSize: 12, color: "#16232E", fontWeight: 850 }}>{selectedPlayers.length} dari {players.length} pemain dipilih</span>
              {!readOnly && <div style={{ display: "flex", gap: 5 }}><button onClick={onSelectAll} style={{ minHeight: 30, padding: "5px 8px", border: "1px solid #E4574F", borderRadius: 7, background: "#E4574F12", color: "#E4574F", fontSize: 10, fontWeight: 850, cursor: "pointer" }}>Pilih Semua</button><button onClick={onClearPlayers} style={{ minHeight: 30, padding: "5px 8px", border: "1px solid #16232E30", borderRadius: 7, background: "#FFFFFF", color: "#44515E", fontSize: 10, fontWeight: 850, cursor: "pointer" }}>Kosongkan</button></div>}
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {players.map(player => {
                const selected = checkedIn.has(player.id);
                const gender = GENDER_OPTIONS[normalizeGender(player.gender)];
                return <button key={player.id} type="button" disabled={readOnly} onClick={() => onTogglePlayer(player.id)} style={{ display: "inline-flex", alignItems: "center", gap: 5, minHeight: 34, padding: "5px 8px", borderRadius: 8, border: `1.5px solid ${selected ? "#E4574F" : "#16232E22"}`, background: selected ? "#E4574F12" : "#F7F8F9", color: selected ? "#16232E" : "#778899", cursor: readOnly ? "default" : "pointer", fontSize: 11, fontWeight: selected ? 800 : 600 }}><span>{player.name}</span><span style={{ color: gender.color }}>{gender.short}</span><TierBadge tier={player.tier} small />{selected && <span style={{ color: "#E4574F", fontWeight: 900 }}>✓</span>}</button>;
              })}
            </div>
            {players.length === 0 && <div style={{ fontSize: 12, color: "#617181", textAlign: "center", padding: 16 }}>Belum ada pemain di arena ini.</div>}
            </div>}
          </section>

          {!readOnly && selectedPlayers.length < 4 && <div style={{ padding: "11px 12px", border: "1.5px solid #F0B429", borderRadius: 10, background: "#FFF7DF", color: "#5A3A00", fontSize: 12, fontWeight: 750 }}>Pilih minimal 4 pemain untuk membuka Match Generator.</div>}

          <section id="match-generator" style={{ ...stepPanelStyle, scrollMarginTop: 130 }}>
            {stepHeader(3, "Match Setting", settingSummary, selectedPlayers.length < 4)}
            {isOpen(3) && selectedPlayers.length >= 4 && <div style={{ padding: "12px 14px 14px", borderTop: "1px solid #16232E18" }}>
              <div style={{ fontSize: 9, color: "#617181", fontWeight: 900, marginBottom: 6 }}>MODE PEMBUATAN</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                {choiceButton(mode === "auto", () => setMode("auto"), "Auto Generate", "Buat beberapa match sekaligus.")}
                {choiceButton(mode === "manual", () => setMode("manual"), "Manual Pairing", "Susun satu match sendiri.")}
              </div>

              {mode === "auto" && <>
                <div style={{ fontSize: 9, color: "#617181", fontWeight: 900, margin: "16px 0 6px", paddingTop: 12, borderTop: "1px solid #16232E20" }}>PAIR FORMAT</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 7 }}>
                  {choiceButton(pairFormat === "mix", () => { setPairFormat("mix"); setPattern(""); }, "Mix Pair · Wajib Campuran", "Setiap tim berisi pria + wanita. Kekurangan gender diisi tier terdekat.")}
                  {choiceButton(pairFormat === "gender", () => { setPairFormat("gender"); setPattern(""); }, "Gender Pair · Gender Sama", "Tim diutamakan sesama gender. Kekurangan diisi tier terdekat.")}
                  <div style={{ gridColumn: "1 / -1" }}>{choiceButton(pairFormat === "random", () => { setPairFormat("random"); setPattern(""); }, "Random Pair · Gender Bebas", "Gender tidak dibatasi: tim boleh pria-pria, wanita-wanita, atau campuran.")}</div>
                </div>

                {pairFormat && <>
                  <div style={{ fontSize: 9, color: "#617181", fontWeight: 900, margin: "16px 0 6px", paddingTop: 12, borderTop: "1px solid #16232E20" }}>GENERATION PATTERN</div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 7 }}>
                    {choiceButton(pattern === "rotation", () => setPattern("rotation"), "Rotation Shuffle", "Utamakan pemain dengan total match All Time paling sedikit, lalu variasi partner dan lawan.")}
                    {choiceButton(pattern === "tier", () => setPattern("tier"), "Tier Shuffle", "Utamakan keseimbangan kekuatan, lalu variasi kombinasi.")}
                  </div>
                </>}

                {pairFormat && pattern && <>
                  <div style={{ fontSize: 9, color: "#617181", fontWeight: 900, margin: "16px 0 6px", paddingTop: 12, borderTop: "1px solid #16232E20" }}>JUMLAH MATCH</div>
                  <input aria-label="Jumlah match" type="number" inputMode="numeric" min="1" max="500" value={count} onChange={event => setCount(event.target.value)} style={{ width: "100%", minHeight: 46, border: "2px solid #16232E", borderRadius: 10, padding: "9px 12px", background: "#FAF7F2", color: "#16232E", fontSize: 18, fontWeight: 900, textAlign: "center", outline: "none" }} />
                  {matches.length > 0 && <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 7, marginTop: 10 }}>{choiceButton(action === "add", () => setAction("add"), "Add to Existing", "Pertahankan match lama.")}{choiceButton(action === "replace", () => setAction("replace"), "Replace Existing", "Ganti semua match sesi.")}</div>}
                  {!readOnly && !generationPreview && <button onClick={requestGenerationPreview} style={{ width: "100%", minHeight: 48, marginTop: 12, background: "#E4574F", border: "2px solid #16232E", borderRadius: 12, color: "#FFFFFF", fontWeight: 900, cursor: "pointer", boxShadow: "3px 3px 0 #16232E" }}>Lihat Preview Match</button>}
                  {!readOnly && generationPreview && <div id="generation-preview" style={{ marginTop: 12, border: "2px solid #16232E", borderRadius: 12, overflow: "hidden", background: "rgba(255,255,255,0.66)", scrollMarginTop: 140 }}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, padding: "10px 11px", background: "#16232E", color: "#FFFFFF" }}>
                      <div><div style={{ fontSize: 12, fontWeight: 900 }}>Preview {generationPreview.matches.length} Match</div><div style={{ marginTop: 2, fontSize: 9, color: "#FFFFFFB8" }}>Periksa pasangan sebelum dikonfirmasi</div></div>
                      <span style={{ flex: "0 0 auto", padding: "4px 6px", border: "1px solid #FFFFFF70", borderRadius: 6, fontSize: 8, fontWeight: 900 }}>BELUM TERSIMPAN</span>
                    </div>
                    <div style={{ padding: "8px 10px", background: generationPreview.config.action === "replace" && matches.length ? "#FFF7DF" : "#F1F7F4", borderBottom: "1px solid #16232E20", color: "#44515E", fontSize: 10, fontWeight: 750, lineHeight: 1.4 }}>
                      {generationPreview.config.action === "replace" && matches.length
                        ? `Hanya match di ${session?.label || "sesi ini"} yang akan diganti. Sesi lain tetap aman.`
                        : matches.length
                          ? `${matches.length} match lama tetap dipertahankan.`
                          : "Match belum dibuat. Preview ini belum mengubah data sesi."}
                    </div>
                    <div style={{ maxHeight: 330, overflowY: "auto", overscrollBehavior: "contain", padding: "4px 10px" }}>
                      {generationPreview.matches.map((match, index) => {
                        const team = ids => ids.map(playerName).join(" & ");
                        const tiers = ids => ids.map(id => players.find(player => player.id === id)?.tier).filter(Boolean);
                        return <div key={`${match.id}-${index}`} style={{ padding: "9px 0", borderBottom: index < generationPreview.matches.length - 1 ? "1px solid #16232E18" : "none" }}>
                          <div style={{ display: "grid", gridTemplateColumns: "24px minmax(0,1fr) 22px minmax(0,1fr)", alignItems: "center", gap: 5 }}>
                            <span style={{ color: "#E4574F", fontSize: 10, fontWeight: 900 }}>{Number(match.scheduleNo) || index + 1}</span>
                            <div style={{ minWidth: 0 }}><div style={{ color: "#16232E", fontSize: 11, fontWeight: 850, lineHeight: 1.25 }}>{team(match.team1)}</div><div style={{ display: "flex", flexWrap: "wrap", gap: 3, marginTop: 3 }}>{tiers(match.team1).map((tier, tierIndex) => <TierBadge key={tierIndex} tier={tier} small />)}</div></div>
                            <span style={{ color: "#617181", fontSize: 8, fontWeight: 900, textAlign: "center" }}>VS</span>
                            <div style={{ minWidth: 0, textAlign: "right" }}><div style={{ color: "#16232E", fontSize: 11, fontWeight: 850, lineHeight: 1.25 }}>{team(match.team2)}</div><div style={{ display: "flex", flexWrap: "wrap", justifyContent: "flex-end", gap: 3, marginTop: 3 }}>{tiers(match.team2).map((tier, tierIndex) => <TierBadge key={tierIndex} tier={tier} small />)}</div></div>
                          </div>
                          {match.genderAdjusted && <div style={{ margin: "5px 0 0 29px", color: "#9A6A00", fontSize: 8, fontWeight: 800 }}>Penyesuaian gender memakai tier terdekat</div>}
                        </div>;
                      })}
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 7, padding: 10, borderTop: "1px solid #16232E20", background: "#FAF7F2" }}>
                      <button type="button" onClick={() => setGenerationPreview(null)} style={{ minHeight: 40, border: "1.5px solid #16232E", borderRadius: 9, background: "#FFFFFF", color: "#16232E", fontSize: 11, fontWeight: 850, cursor: "pointer" }}>Batal</button>
                      <button type="button" onClick={requestGenerationPreview} style={{ minHeight: 40, border: "1.5px solid #16232E", borderRadius: 9, background: "#FFFFFF", color: "#16232E", fontSize: 11, fontWeight: 850, cursor: "pointer" }}>Acak Ulang</button>
                      <button type="button" onClick={confirmGenerationPreview} style={{ gridColumn: "1 / -1", minHeight: 44, border: "2px solid #16232E", borderRadius: 10, background: "#E4574F", color: "#FFFFFF", fontSize: 12, fontWeight: 900, cursor: "pointer", boxShadow: "2px 2px 0 #16232E" }}>
                        {generationPreview.config.action === "replace" && matches.length ? "Ganti Match Sesi Ini" : matches.length ? `Tambahkan ${generationPreview.matches.length} Match` : `Konfirmasi ${generationPreview.matches.length} Match`}
                      </button>
                    </div>
                  </div>}
                </>}
              </>}

              {mode === "manual" && <>
                <div style={{ fontSize: 9, color: "#617181", fontWeight: 900, margin: "16px 0 6px", paddingTop: 12, borderTop: "1px solid #16232E20" }}>PILIH 2 ATAU 4 PEMAIN</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>{selectedPlayers.map(player => {
                  const selectedIndex = manualSelected.indexOf(player.id);
                  const gender = GENDER_OPTIONS[normalizeGender(player.gender)];
                  return <button key={player.id} onClick={() => toggleManualPlayer(player.id)} style={{ minHeight: 42, display: "flex", alignItems: "center", gap: 8, padding: "7px 9px", background: selectedIndex >= 0 ? "#E4574F12" : "#FFFFFF", border: `1.5px solid ${selectedIndex >= 0 ? "#E4574F" : "#16232E25"}`, borderRadius: 9, color: "#16232E", cursor: "pointer" }}><span style={{ width: 22, height: 22, display: "inline-flex", alignItems: "center", justifyContent: "center", borderRadius: 6, background: selectedIndex >= 0 ? "#E4574F" : "#16232E0D", color: selectedIndex >= 0 ? "#FFFFFF" : "#617181", fontSize: 10, fontWeight: 900 }}>{selectedIndex >= 0 ? selectedIndex + 1 : ""}</span><span style={{ flex: 1, textAlign: "left", fontSize: 12, fontWeight: 800 }}>{player.name}</span><span style={{ padding: "3px 6px", border: `1px solid ${gender.border}`, borderRadius: 999, background: gender.bg, color: gender.color, fontSize: 9, fontWeight: 900 }}>{gender.label}</span><TierBadge tier={player.tier} small /></button>;
                })}</div>
                {manualSelected.length > 0 && <div style={{ marginTop: 10, padding: "9px 10px", background: "#FAF7F2", border: "1px solid #16232E25", borderRadius: 9, display: "grid", gridTemplateColumns: "1fr 28px 1fr", gap: 6, alignItems: "center", fontSize: 11, fontWeight: 800 }}><span>{manualSelected.slice(0, manualSelected.length === 2 ? 1 : 2).map(playerName).join(" & ") || "Tim A"}</span><span style={{ textAlign: "center", color: "#617181" }}>VS</span><span style={{ textAlign: "right" }}>{manualSelected.slice(manualSelected.length === 2 ? 1 : 2).map(playerName).join(" & ") || "Tim B"}</span></div>}
                {!readOnly && <button disabled={!([2, 4].includes(manualSelected.length))} onClick={() => onManualMatch(manualSelected, () => { setManualSelected([]); openOnly(4); })} style={{ width: "100%", minHeight: 46, marginTop: 10, background: [2, 4].includes(manualSelected.length) ? "#E4574F" : "#16232E18", border: "2px solid #16232E", borderRadius: 12, color: [2, 4].includes(manualSelected.length) ? "#FFFFFF" : "#778899", fontWeight: 900, cursor: [2, 4].includes(manualSelected.length) ? "pointer" : "default" }}>Add Manual Match</button>}
              </>}
            </div>}
          </section>

          <section id="generated-matches" style={{ ...stepPanelStyle, scrollMarginTop: 130 }}>
            <div style={{ minHeight: 62, display: "grid", gridTemplateColumns: "minmax(0,1fr) 34px 34px 28px", alignItems: "center", gap: 5, padding: "10px 12px", background: isOpen(4) ? "#FAF7F2" : "#FFFFFF" }}>
              <button type="button" onClick={() => toggleStep(4)} aria-expanded={isOpen(4)} style={{ minWidth: 0, display: "grid", gridTemplateColumns: "44px minmax(0,1fr)", alignItems: "center", gap: 9, padding: 0, border: "none", background: "transparent", color: "#16232E", cursor: "pointer", textAlign: "left" }}>
                <span style={{ width: 40, height: 40, display: "inline-flex", alignItems: "center", justifyContent: "center", borderRadius: 9, background: "#E4574F12", border: "1.5px solid #E4574F55", color: "#E4574F", fontSize: 12, fontWeight: 900 }}>4</span>
                <span style={{ minWidth: 0 }}><span style={{ display: "block", fontSize: 13, fontWeight: 900, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>Generated Matches</span><span style={{ display: "block", marginTop: 2, fontSize: 10, color: "#617181", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{matches.length} match{matches.length ? ` · ${matches.filter(hasScore).length} selesai` : ""}</span></span>
              </button>
              <button className="cr-compact-icon" type="button" onClick={handleShareGeneratedMatchesWA} disabled={!matches.length || matchShareBusy !== null} aria-label="Bagikan semua match ke WhatsApp" title="Bagikan ke WhatsApp" style={{ width: 32, height: 30, display: "inline-flex", alignItems: "center", justifyContent: "center", padding: 0, border: "1.5px solid #16232E", borderRadius: 7, background: matchShareBusy === "wa" ? "#617181" : "#16232E", color: "#FFFFFF", fontSize: 9, fontWeight: 900, cursor: matches.length && !matchShareBusy ? "pointer" : "default", opacity: matches.length ? 1 : 0.35 }}>{matchShareBusy === "wa" ? "..." : "WA"}</button>
              <button className="cr-compact-icon" type="button" onClick={handleDownloadGeneratedMatches} disabled={!matches.length || matchShareBusy !== null} aria-label="Simpan semua match sebagai gambar" title="Simpan gambar" style={{ width: 32, height: 30, display: "inline-flex", alignItems: "center", justifyContent: "center", padding: 0, border: "1.5px solid #16232E", borderRadius: 7, background: "#FFFFFF", color: "#16232E", fontSize: 15, fontWeight: 900, cursor: matches.length && !matchShareBusy ? "pointer" : "default", opacity: matches.length ? 1 : 0.35 }}>{matchShareBusy === "image" ? "..." : "↓"}</button>
              <button className="cr-compact-icon" type="button" onClick={() => toggleStep(4)} aria-label={isOpen(4) ? "Minimize Generated Matches" : "Buka Generated Matches"} style={{ width: 26, height: 26, display: "inline-flex", alignItems: "center", justifyContent: "center", padding: 0, borderRadius: 7, background: "#16232E0A", border: "1px solid #16232E20", color: "#16232E", fontSize: 12, fontWeight: 900, cursor: "pointer" }}>{isOpen(4) ? "−" : "+"}</button>
            </div>
            {isOpen(4) && <div style={{ padding: "12px 12px 14px", borderTop: "1px solid #16232E18" }}>
            {sortedMatches.length === 0 && <div style={{ ...panelStyle, textAlign: "center", color: "#617181", fontSize: 12, boxShadow: "none" }}>Belum ada match. Lengkapi pengaturan di atas lalu generate.</div>}
            <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
              {sortedMatches.map(({ match, displayNo }) => <GeneratedMatchItem
                key={match.id}
                match={match}
                matchNo={displayNo}
                players={players}
                readOnly={readOnly}
                onEdit={() => onEditMatch(match)}
                onUpdateScore={onUpdateScore}
                onDelete={() => onDeleteMatch(match.id)}
              />)}
            </div>
            {!readOnly && matches.length > 0 && <button onClick={() => { setAction("add"); openOnly(3); setTimeout(() => document.getElementById("match-generator")?.scrollIntoView({ behavior: "smooth", block: "start" }), 50); }} style={{ width: "100%", minHeight: 46, marginTop: 12, background: "#FFFFFF", border: "2px solid #16232E", borderRadius: 12, color: "#16232E", fontWeight: 900, cursor: "pointer", boxShadow: "2px 2px 0 #16232E" }}>+ Add More Matches</button>}
            </div>}
          </section>
          <GeneratedMatchesShareCard ref={matchShareRef} session={session} matches={sortedMatches} players={players} />
        </div>
      );
    }

    const GeneratedMatchesShareCard = React.forwardRef(function GeneratedMatchesShareCard({ session, matches, players }, ref) {
      return <div ref={ref} className="cr-share-surface" aria-hidden="true" style={{ position: "fixed", left: -10000, top: 0, width: 430, padding: 16, background: "#FAF7F2", color: "#16232E", fontFamily: "'DM Sans', sans-serif", pointerEvents: "none" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", gap: 12, paddingBottom: 10, borderBottom: "2px solid #16232E" }}>
          <div style={{ minWidth: 0 }}><div style={{ fontSize: 10, fontWeight: 900, color: "#E4574F" }}>COURTRANK</div><div style={{ marginTop: 2, fontSize: 19, lineHeight: 1.1, fontWeight: 900 }}>{session?.label || "Generated Matches"}</div>{session?.date && <div style={{ marginTop: 3, fontSize: 10, color: "#617181", fontWeight: 700 }}>{session.date}</div>}</div>
          <div style={{ flex: "0 0 auto", fontSize: 11, fontWeight: 900 }}>{matches.length} MATCH</div>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 9, paddingTop: 10 }}>
          {matches.map(({ match, displayNo }) => (
            <GeneratedMatchItem
              key={match.id}
              match={match}
              matchNo={displayNo}
              players={players}
              readOnly={true}
            />
          ))}
        </div>
      </div>;
    });

    function GeneratedMatchItem({ match, matchNo, players, readOnly, onEdit, onUpdateScore, onDelete }) {
      const initialGames = () => (match.games?.length ? match.games : [{ t1: 0, t2: 0 }]).map(game => ({ t1: Number(game.t1) || 0, t2: Number(game.t2) || 0 }));
      const [draftGames, setDraftGames] = React.useState(initialGames);
      React.useEffect(() => setDraftGames(initialGames()), [match.id, JSON.stringify(match.games || [])]);
      const getPlayer = id => players.find(player => player.id === id);
      const teamName = ids => ids.map(id => getPlayer(id)?.name || "?").join(" & ");
      const hasScore = draftGames.some(game => Number(game.t1) > 0 || Number(game.t2) > 0);
      const result = calcMatchResult({ ...match, games: draftGames }, players);
      const tierDiff = Math.abs((result.tw1 || 0) - (result.tw2 || 0));
      const team1Role = tierDiff === 0 ? "Seimbang" : result.tw1 > result.tw2 ? "Jagoan" : "Underdog";
      const team2Role = tierDiff === 0 ? "Seimbang" : result.tw2 > result.tw1 ? "Jagoan" : "Underdog";
      const dark = "#16232E";
      const muted = "#9AA3AB";
      const teamColor = team => hasScore && !result.isTie && !(team === 1 ? result.t1Win : result.t2Win) ? muted : dark;
      const scoreColor = (game, team) => {
        const t1 = Number(game.t1) || 0;
        const t2 = Number(game.t2) || 0;
        if ((t1 === 0 && t2 === 0) || t1 === t2) return dark;
        const wins = team === 1 ? t1 > t2 : t2 > t1;
        return wins ? dark : muted;
      };
      const commitGames = games => {
        const cleanGames = games.map(game => ({ t1: Number(game.t1) || 0, t2: Number(game.t2) || 0 }));
        onUpdateScore?.(match.id, cleanGames, false);
      };
      const updateScore = (gameIndex, team, value) => setDraftGames(prev => {
        const score = value === "" ? 0 : Math.max(0, parseInt(value, 10) || 0);
        const next = prev.map((game, index) => index === gameIndex ? { ...game, [team]: score } : game);
        commitGames(next);
        return next;
      });
      const addSet = () => setDraftGames(prev => {
        if (prev.length >= 3) return prev;
        const next = [...prev, { t1: 0, t2: 0 }];
        commitGames(next);
        return next;
      });
      const removeSet = gameIndex => setDraftGames(prev => {
        const next = prev.filter((_, index) => index !== gameIndex);
        const safeNext = next.length ? next : [{ t1: 0, t2: 0 }];
        commitGames(safeNext);
        return safeNext;
      });
      const editButton = label => !readOnly && <button className="cr-compact-icon" type="button" onClick={onEdit} aria-label={`Edit pemain ${label}`} title={`Edit pemain ${label}`} style={{ width: 24, height: 24, flex: "0 0 24px", display: "inline-flex", alignItems: "center", justifyContent: "center", padding: 0, border: "none", borderRadius: 6, background: "#16232E0A", color: "#16232E", fontSize: 14, fontWeight: 900, cursor: "pointer" }}>✎</button>;

      return <article style={{ background: "#FFFFFF", border: "2px solid #16232E", borderRadius: 12, padding: "9px 10px 10px", boxShadow: "2px 2px 0 #16232E" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 8 }}>
          <span style={{ fontSize: 13, fontWeight: 900, color: dark }}>Match {matchNo}</span>
          {!readOnly && <button className="cr-compact-icon" type="button" onClick={onDelete} aria-label="Hapus match" title="Hapus match" style={{ width: 30, height: 30, display: "inline-flex", alignItems: "center", justifyContent: "center", padding: 0, border: "1px solid #16232E24", borderRadius: 7, background: "#FFFFFF", color: "#617181", fontSize: 18, fontWeight: 900, cursor: "pointer", lineHeight: 1 }}>×</button>}
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) 24px minmax(0,1fr)", gap: 5, alignItems: "start" }}>
          <div style={{ minWidth: 0, textAlign: "center", color: teamColor(1) }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 4 }}><span style={{ minWidth: 0, fontSize: 12, fontWeight: 850, lineHeight: 1.25 }}>{teamName(match.team1)}</span>{editButton("Tim A")}</div>
            <div style={{ marginTop: 4, fontSize: 9, fontWeight: 800, color: teamColor(1) }}>{result.tw1 || 0} pts · {team1Role}</div>
          </div>
          <span style={{ paddingTop: 4, fontSize: 9, fontWeight: 900, color: "#617181", textAlign: "center" }}>VS</span>
          <div style={{ minWidth: 0, textAlign: "center", color: teamColor(2) }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 4 }}><span style={{ minWidth: 0, fontSize: 12, fontWeight: 850, lineHeight: 1.25 }}>{teamName(match.team2)}</span>{editButton("Tim B")}</div>
            <div style={{ marginTop: 4, fontSize: 9, fontWeight: 800, color: teamColor(2) }}>{result.tw2 || 0} pts · {team2Role}</div>
          </div>
        </div>

        <div style={{ marginTop: 7, paddingTop: 7, borderTop: "1px solid #16232E18" }}>
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4, maxWidth: 188, margin: "0 auto" }}>
            {draftGames.map((game, index) => <div key={index} style={{ width: "100%", display: "grid", gridTemplateColumns: "38px 42px 8px 42px 22px", alignItems: "center", justifyContent: "center", gap: 4 }}>
              <span style={{ fontSize: 9, color: "#778899", textAlign: "right", fontWeight: 850 }}>Set {index + 1}</span>
              <input className="cr-compact-score" type="number" inputMode="numeric" min="0" disabled={readOnly} value={game.t1} onFocus={event => event.currentTarget.select()} onChange={event => updateScore(index, "t1", event.target.value)} aria-label={`Skor Tim A set ${index + 1}`} style={{ width: 42, height: 30, background: readOnly ? "#F4F5F6" : "#FFFFFF", border: `1.5px solid ${scoreColor(game, 1)}`, borderRadius: 7, padding: "2px", color: scoreColor(game, 1), fontSize: 15, fontWeight: 900, textAlign: "center", outline: "none", fontFamily: "'DM Mono', monospace" }} />
              <span style={{ textAlign: "center", color: "#617181", fontSize: 10, fontWeight: 900 }}>-</span>
              <input className="cr-compact-score" type="number" inputMode="numeric" min="0" disabled={readOnly} value={game.t2} onFocus={event => event.currentTarget.select()} onChange={event => updateScore(index, "t2", event.target.value)} aria-label={`Skor Tim B set ${index + 1}`} style={{ width: 42, height: 30, background: readOnly ? "#F4F5F6" : "#FFFFFF", border: `1.5px solid ${scoreColor(game, 2)}`, borderRadius: 7, padding: "2px", color: scoreColor(game, 2), fontSize: 15, fontWeight: 900, textAlign: "center", outline: "none", fontFamily: "'DM Mono', monospace" }} />
              <span style={{ width: 22, textAlign: "center" }}>{!readOnly && draftGames.length > 1 && <button className="cr-compact-icon" type="button" onClick={() => removeSet(index)} aria-label={`Hapus set ${index + 1}`} title="Hapus set" style={{ width: 22, height: 22, padding: 0, border: "none", background: "transparent", color: "#9AA3AB", fontSize: 13, fontWeight: 900, cursor: "pointer" }}>×</button>}</span>
            </div>)}
            {!readOnly && draftGames.length < 3 && <button className="cr-compact-icon" type="button" onClick={addSet} aria-label="Tambah set" title="Tambah set" style={{ minWidth: 54, height: 28, padding: "0 8px", border: "1.5px dashed #16232E60", borderRadius: 7, background: "#FFFFFF", color: "#617181", fontSize: 9, fontWeight: 850, cursor: "pointer" }}>+ Set</button>}
          </div>
        </div>
      </article>;
    }

    // ===== MATCH CARD COMPONENTS =====
    function TierMatchStatus({ match, players, compact = false }) {
      const res = calcMatchResult(match, players);
      const diff = Math.abs((res.tw1 || 0) - (res.tw2 || 0));
      const t1Role = diff === 0 ? "Seimbang" : (res.tw1 > res.tw2 ? "Jagoan" : "Underdog");
      const t2Role = diff === 0 ? "Seimbang" : (res.tw2 > res.tw1 ? "Jagoan" : "Underdog");
      const roleColor = (role) => role === "Jagoan" ? "#E4574F" : role === "Underdog" ? "#9A6A00" : "#16232E";
      const roleBg = (role) => role === "Jagoan" ? "#E4574F12" : role === "Underdog" ? "#F0B42918" : "#16232E12";
      const roleBorder = (role) => role === "Jagoan" ? "#E4574F40" : role === "Underdog" ? "#F0B42955" : "#16232E35";
      const chip = (label, weight, role) => (
        <div style={{
          flex: 1, minWidth: 0, background: roleBg(role), border: `1px solid ${roleBorder(role)}`,
          borderRadius: compact ? 8 : 10, padding: compact ? "4px 6px" : "6px 8px", textAlign: "center"
        }}>
          <div style={{ fontSize: compact ? 9 : 10, color: "#617181", fontWeight: 800, letterSpacing: "0.04em" }}>{label}</div>
          <div style={{ fontSize: compact ? 10 : 11, color: roleColor(role), fontWeight: 900, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
            {weight} pts · {role}
          </div>
        </div>
      );
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 6, margin: compact ? "8px 0 0" : "0 0 10px" }}>
          {chip("TIM A", res.tw1 || 0, t1Role)}
          <div style={{
            flex: "0 0 auto", minWidth: compact ? 42 : 54, textAlign: "center", fontSize: compact ? 10 : 11,
            color: diff === 0 ? "#16232E" : "#44515E", fontWeight: 900,
            background: "#FFFFFF", border: "1px solid #16232E30", borderRadius: 999, padding: compact ? "4px 5px" : "5px 7px"
          }}>
            {diff === 0 ? "=" : diff}
          </div>
          {chip("TIM B", res.tw2 || 0, t2Role)}
        </div>
      );
    }

    function MatchCard({ match, players, onScore, onEdit }) {
      const getPlayer = id => players.find(p => p.id === id);
      const teamNames = (ids) => ids.map(id => getPlayer(id)?.name || "?").join(" & ");
      const canEdit = Boolean(onScore);
      const [draftGames, setDraftGames] = React.useState((match.games && match.games.length > 0) ? match.games.map(g => ({ t1: g.t1, t2: g.t2 })) : [{ t1: 0, t2: 0 }]);
      React.useEffect(() => {
        setDraftGames((match.games && match.games.length > 0) ? match.games.map(g => ({ t1: g.t1, t2: g.t2 })) : [{ t1: 0, t2: 0 }]);
      }, [match.id, JSON.stringify(match.games || [])]);
      const normalizeGames = (games = draftGames) => games.map(g => ({ t1: Number(g?.t1) || 0, t2: Number(g?.t2) || 0 }));
      const commitGames = (games, finish = false) => {
        if (!canEdit) return;
        onScore(match.id, normalizeGames(games), finish);
      };
      const updateScore = (gi, team, val) => {
        if (!canEdit) return;
        const clean = val === "" ? "" : Math.max(0, parseInt(val, 10) || 0);
        setDraftGames(prev => {
          const next = prev.map((g, i) => i === gi ? { ...g, [team]: clean } : g);
          commitGames(next, false);
          return next;
        });
      };
      const addGame = () => setDraftGames(prev => {
        const next = [...prev, { t1: 0, t2: 0 }];
        commitGames(next, false);
        return next;
      });
      const removeGame = (gi) => setDraftGames(prev => {
        const next = prev.filter((_, i) => i !== gi);
        const safeNext = next.length ? next : [{ t1: 0, t2: 0 }];
        commitGames(safeNext, false);
        return safeNext;
      });
      const totals = normalizeGames().reduce((acc,g)=>({ t1: acc.t1 + g.t1, t2: acc.t2 + g.t2 }), { t1: 0, t2: 0 });
      return (
        <div>
          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 8 }}>{canEdit && onEdit && <button onClick={onEdit} style={{ minHeight: 34, padding: "7px 10px", background: "#FFFFFF", border: "2px solid #16232E", borderRadius: 12, color: "#16232E", fontWeight: 850, fontSize: 11, cursor: "pointer" }}>✎ Edit Pemain</button>}</div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <div style={{ textAlign: "center", flex: 1 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: "#16232E", marginBottom: 2 }}>{teamNames(match.team1)}</div>
              <div style={{ display: "flex", gap: 4, justifyContent: "center" }}>
                {match.team1.map(id => getPlayer(id)?.tier).filter(Boolean).map((t, i) => <TierBadge key={i} tier={t} small />)}
              </div>
            </div>
            <div style={{ fontSize: 12, fontWeight: 700, color: "#617181", padding: "0 10px" }}>VS</div>
            <div style={{ textAlign: "center", flex: 1 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: "#16232E", marginBottom: 2 }}>{teamNames(match.team2)}</div>
              <div style={{ display: "flex", gap: 4, justifyContent: "center" }}>
                {match.team2.map(id => getPlayer(id)?.tier).filter(Boolean).map((t, i) => <TierBadge key={i} tier={t} small />)}
              </div>
            </div>
          </div>
          <TierMatchStatus match={match} players={players} />
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 10 }}>
            {draftGames.map((g, i) => (
              <div key={i} style={{ display: "grid", gridTemplateColumns: "42px 1fr 14px 1fr 24px", alignItems: "center", gap: 6 }}>
                <span style={{ fontSize: 11, color: "#617181" }}>Set {i + 1}</span>
                <input type="number" inputMode="numeric" disabled={!canEdit} value={g.t1} onFocus={e => { if (e.target.value === "0") updateScore(i, "t1", ""); }} onBlur={e => { if (e.target.value === "") updateScore(i, "t1", "0"); }} onChange={e => updateScore(i, "t1", e.target.value)} style={{ width: "100%", background: "#FAF7F2", border: "2px solid #16232E", borderRadius: 12, padding: "8px 4px", color: "#16232E", fontSize: 16, fontWeight: 800, textAlign: "center", outline: "none", fontFamily: "'DM Mono', monospace" }} />
                <span style={{ textAlign: "center", color: "#16232E", fontWeight: 800 }}>-</span>
                <input type="number" inputMode="numeric" disabled={!canEdit} value={g.t2} onFocus={e => { if (e.target.value === "0") updateScore(i, "t2", ""); }} onBlur={e => { if (e.target.value === "") updateScore(i, "t2", "0"); }} onChange={e => updateScore(i, "t2", e.target.value)} style={{ width: "100%", background: "#FAF7F2", border: "2px solid #16232E", borderRadius: 12, padding: "8px 4px", color: "#16232E", fontSize: 16, fontWeight: 800, textAlign: "center", outline: "none", fontFamily: "'DM Mono', monospace" }} />
                <div style={{ textAlign: "center" }}>{canEdit && draftGames.length > 1 && <button onClick={() => removeGame(i)} style={{ background: "none", border: "none", color: "#E4574F", cursor: "pointer", fontSize: 15, padding: 0 }}>✕</button>}</div>
              </div>
            ))}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: draftGames.length < 3 ? "1fr 1fr" : "1fr", gap: 8 }}>
            {canEdit && draftGames.length < 3 && <button onClick={addGame} style={{ padding: "9px", background: "#FFFFFF", border: "2px dashed #16232E60", borderRadius: 12, color: "#44515E", fontWeight: 800, fontSize: 12, cursor: "pointer" }}>+ Set</button>}
            {canEdit && <button onClick={() => commitGames(draftGames, true)} style={{ padding: "9px", background: "#E4574F", border: "none", borderRadius: 12, color: "#fff", fontWeight: 800, fontSize: 12, cursor: "pointer" }}>✅ Selesai ({totals.t1}-{totals.t2})</button>}
          </div>
        </div>
      );
    }
    function DoneMatchCard({ match, players, onEdit }) {
      const getPlayer = id => players.find(p => p.id === id);
      const snap = match.tierSnapshot || {};
      const teamNames = (ids) => ids.map(id => {
        const p = getPlayer(id);
        if (!p) return "?";
        const snapTier = snap[id];
        const tierChanged = snapTier && snapTier !== p.tier;
        return tierChanged ? `${p.name} (${snapTier}→${p.tier})` : p.name;
      }).join(" & ");
      const res = calcMatchResult(match, players);
      const t1Won = res.t1Win, t2Won = res.t2Win;
      const hasSnapshot = Object.keys(snap).length > 0;
      return (
        <div onClick={onEdit || undefined} style={{
          background: "#FFFFFF", border: "2px solid #16232E",
          borderRadius: 10, padding: "10px 12px", marginBottom: 8, cursor: onEdit ? "pointer" : "default",
        }}>
          <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) auto minmax(0,1fr)", alignItems: "center", gap: 8 }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 13, fontWeight: t1Won ? 850 : 650, color: t1Won ? "#16232E" : "#617181", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{teamNames(match.team1)}</div>
            </div>
            <div style={{ minWidth: 56, textAlign: "center", padding: "2px 6px", borderRadius: 10, background: "transparent", border: "none" }}>
              {match.games.map((g, i) => <div key={i} style={{ fontSize: match.games.length > 1 ? 12 : 15, lineHeight: match.games.length > 1 ? 1.1 : 1, fontFamily: "'DM Mono', monospace", color: "#16232E", fontWeight: 900 }}>{g.t1}-{g.t2}</div>)}
            </div>
            <div style={{ minWidth: 0, textAlign: "right" }}>
              <div style={{ fontSize: 13, fontWeight: t2Won ? 850 : 650, color: t2Won ? "#16232E" : "#617181", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{teamNames(match.team2)}</div>
            </div>
          </div>
          <TierMatchStatus match={match} players={players} compact />
          {!hasSnapshot && (
            <div style={{ fontSize: 10, color: "#778899", marginTop: 3 }}>ℹ️ Tier mengikuti saat match dimainkan</div>
          )}
        </div>
      );
    }

    // ===== PLAYER EDIT MODAL =====
    function PlayerEditModal({ match, players, onClose, onChangePlayers }) {
      const [team1, setTeam1] = React.useState([...match.team1]);
      const [team2, setTeam2] = React.useState([...match.team2]);
      const [message, setMessage] = React.useState("");
      const getPlayer = id => players.find(player => player.id === id);

      const updatePlayerSlot = (side, idx, value) => {
        const id = Number(value);
        const allSlots = [...team1, ...team2];
        const slotIndex = side === "team1" ? idx : team1.length + idx;
        const duplicate = allSlots.some((pid, i) => i !== slotIndex && pid === id);
        if (duplicate) {
          setMessage("Pemain tersebut sudah ada di match ini.");
          return;
        }
        const nextTeam1 = side === "team1" ? team1.map((playerId, i) => i === idx ? id : playerId) : team1;
        const nextTeam2 = side === "team2" ? team2.map((playerId, i) => i === idx ? id : playerId) : team2;
        setTeam1(nextTeam1);
        setTeam2(nextTeam2);
        setMessage("");
        onChangePlayers(nextTeam1, nextTeam2);
      };
      const playerSelect = (side, id, idx) => {
        const selectedIds = [...team1, ...team2];
        const player = getPlayer(id);
        return <div key={`${side}-${idx}`} style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) auto", alignItems: "center", gap: 6 }}>
          <select aria-label={`Pemain ${side === "team1" ? "Tim A" : "Tim B"} ${idx + 1}`} value={id} onChange={event => updatePlayerSlot(side, idx, event.target.value)} style={{ width: "100%", minWidth: 0, minHeight: 42, background: "#FFFFFF", border: "2px solid #16232E", borderRadius: 10, color: "#16232E", fontSize: 12, fontWeight: 800, padding: "7px 8px", outline: "none" }}>
            {players.map(option => <option key={option.id} value={option.id} disabled={option.id !== id && selectedIds.includes(option.id)}>{option.name} · Tier {option.tier}</option>)}
          </select>
          <TierBadge tier={player?.tier || "E"} small />
        </div>;
      };

      return (
        <div style={{ position: "fixed", inset: 0, background: "#000000cc", zIndex: 1500, display: "flex", alignItems: "flex-end", justifyContent: "center" }} onClick={onClose}>
          <div className="cr-glass-modal" style={{ background: "#FFFFFF", borderRadius: "24px 24px 0 0", padding: "16px 16px 22px", width: "100%", maxWidth: 430, border: "2px solid #16232E", maxHeight: "82vh", overflowY: "auto" }} onClick={event => event.stopPropagation()}>
            <div style={{ display: "grid", gridTemplateColumns: "30px minmax(0,1fr) 30px", alignItems: "center", gap: 8 }}>
              <span />
              <div style={{ fontSize: 15, fontWeight: 900, color: "#16232E", textAlign: "center" }}>Ganti Pemain</div>
              <button type="button" onClick={onClose} aria-label="Tutup" title="Tutup" style={{ width: 30, height: 30, display: "inline-flex", alignItems: "center", justifyContent: "center", border: "1.5px solid #16232E", borderRadius: 8, background: "#FFFFFF", color: "#16232E", fontSize: 17, fontWeight: 900, cursor: "pointer" }}>×</button>
            </div>
            <div style={{ fontSize: 10, color: "#617181", margin: "3px 0 14px", textAlign: "center" }}>Perubahan pemain tersimpan otomatis.</div>
            {message && <div style={{ marginBottom: 10, padding: "7px 9px", border: "1px solid #E4574F", borderRadius: 8, background: "#FFF0EF", color: "#7A1B18", fontSize: 10, fontWeight: 800, textAlign: "center" }}>{message}</div>}
            <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) 24px minmax(0,1fr)", gap: 7, alignItems: "start" }}>
              <div style={{ minWidth: 0 }}>
                <div style={{ marginBottom: 7, fontSize: 10, color: "#617181", fontWeight: 900, textAlign: "center" }}>TIM A</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>{team1.map((id, idx) => playerSelect("team1", id, idx))}</div>
              </div>
              <div style={{ paddingTop: 38, color: "#617181", fontWeight: 900, fontSize: 9, textAlign: "center" }}>VS</div>
              <div style={{ minWidth: 0 }}>
                <div style={{ marginBottom: 7, fontSize: 10, color: "#617181", fontWeight: 900, textAlign: "center" }}>TIM B</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>{team2.map((id, idx) => playerSelect("team2", id, idx))}</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ===== MANUAL MODAL =====
    function ManualModal({ players, courts, selected, setSelected, court, setCourt, onClose, onSubmit }) {
      const toggle = (id) => {
        if (selected.includes(id)) setSelected(selected.filter(x => x !== id));
        else if (selected.length < 4) setSelected([...selected, id]);
      };
      const selectedPlayers = selected.map(id => players.find(p => p.id === id)).filter(Boolean);
      const canPreviewTier = selectedPlayers.length === 2 || selectedPlayers.length === 4;
      const previewT1 = selectedPlayers.length === 2 ? selectedPlayers.slice(0, 1) : selectedPlayers.slice(0, 2);
      const previewT2 = selectedPlayers.length === 2 ? selectedPlayers.slice(1, 2) : selectedPlayers.slice(2, 4);
      const previewW1 = previewT1.reduce((s, p) => s + TIER_WEIGHT[p?.tier || "E"], 0);
      const previewW2 = previewT2.reduce((s, p) => s + TIER_WEIGHT[p?.tier || "E"], 0);
      const previewDiff = Math.abs(previewW1 - previewW2);
      const previewRole = (w, other) => previewDiff === 0 ? "Seimbang" : (w > other ? "Jagoan" : "Underdog");
      const previewRoleColor = (role) => role === "Jagoan" ? "#E4574F" : role === "Underdog" ? "#9A6A00" : "#16232E";
      return (
        <div style={{ position: "fixed", inset: 0, background: "#000000cc", zIndex: 1500, display: "flex", alignItems: "flex-end", justifyContent: "center" }} onClick={onClose}>
          <div className="cr-glass-modal" style={{ background: "#FFFFFF", borderRadius: "28px 28px 0 0", padding: 20, width: "100%", maxWidth: 430, border: "2px solid #16232E", maxHeight: "85vh", overflowY: "auto" }} onClick={e => e.stopPropagation()}>
            <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 4, color: "#16232E" }}>Buat Match Manual</div>
            <div style={{ fontSize: 12, color: "#617181", marginBottom: 14 }}>Pilih 2 (single) atau 4 (double) pemain</div>
            <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
              {courts.map(c => (
                <button key={c} onClick={() => setCourt(c)} style={{ padding: "6px 14px", background: court === c ? "#E4574F" : "#16232E10", border: "none", borderRadius: 8, color: court === c ? "#fff" : "#44515E", cursor: "pointer", fontWeight: 600, fontSize: 12 }}>Match {c}</button>
              ))}
            </div>
            {players.map(p => (
              <div key={p.id} onClick={() => toggle(p.id)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", background: selected.includes(p.id) ? "#E4574F20" : "#16232E08", border: `1px solid ${selected.includes(p.id) ? "#E4574F60" : "#16232E0a"}`, borderRadius: 10, marginBottom: 6, cursor: "pointer" }}>
                <div style={{ width: 20, height: 20, borderRadius: 5, background: selected.includes(p.id) ? "#E4574F" : "#16232E10", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, color: "#fff", fontWeight: 700 }}>
                  {selected.includes(p.id) ? selected.indexOf(p.id) + 1 : ""}
                </div>
                <span style={{ fontSize: 13, color: "#16232E", flex: 1 }}>{p.name}</span>
                <TierBadge tier={p.tier} small />
              </div>
            ))}
            {canPreviewTier && (
              <div style={{ background: "#FAF7F2", border: "2px solid #16232E", borderRadius: 12, padding: "10px 12px", marginTop: 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                  <div style={{ fontSize: 11, color: "#44515E", fontWeight: 800, letterSpacing: "0.06em" }}>PREVIEW TIER</div>
                  <div style={{ fontSize: 11, color: previewDiff === 0 ? "#16232E" : "#9A6A00", fontWeight: 800 }}>{previewDiff === 0 ? "⚖ Seimbang" : `${previewDiff} pts tier`}</div>
                </div>
                <div style={{ display: "flex", gap: 8, alignItems: "stretch" }}>
                  <div style={{ flex: 1, background: "#FFFFFF", borderRadius: 10, padding: 10 }}>
                    <div style={{ fontSize: 10, color: "#617181", fontWeight: 800, marginBottom: 4 }}>TIM A</div>
                    <div style={{ fontSize: 12, color: previewRoleColor(previewRole(previewW1, previewW2)), fontWeight: 800 }}>{previewW1} pts · {previewRole(previewW1, previewW2)}</div>
                    <div style={{ fontSize: 11, color: "#44515E", marginTop: 5 }}>{previewT1.map(p => p.name).join(" & ")}</div>
                  </div>
                  <div style={{ flex: 1, background: "#FFFFFF", borderRadius: 10, padding: 10 }}>
                    <div style={{ fontSize: 10, color: "#617181", fontWeight: 800, marginBottom: 4 }}>TIM B</div>
                    <div style={{ fontSize: 12, color: previewRoleColor(previewRole(previewW2, previewW1)), fontWeight: 800 }}>{previewW2} pts · {previewRole(previewW2, previewW1)}</div>
                    <div style={{ fontSize: 11, color: "#44515E", marginTop: 5 }}>{previewT2.map(p => p.name).join(" & ")}</div>
                  </div>
                </div>
              </div>
            )}
            <button onClick={onSubmit} style={{ width: "100%", marginTop: 12, padding: "13px", background: "#E4574F", border: "none", borderRadius: 16, color: "#fff", fontWeight: 700, cursor: "pointer", fontSize: 14 }}>🎯 Mulai Match</button>
          </div>
        </div>
      );
    }

    // ===== EDIT PLAYER MODAL =====
    function EditPlayerModal({ player, currentSessionId, currentSessionLabel, onClose, onSave }) {

      const [tier, setTier] = React.useState(player.tier);
      const [gender, setGender] = React.useState(normalizeGender(player.gender));
      const [changeType, setChangeType] = React.useState("resmi");

      const history = (player.tierHistory || []).filter(h => h.type !== "init");

      return (
        <div style={{ position: "fixed", inset: 0, background: "#000000cc", zIndex: 1500, display: "flex", alignItems: "flex-end", justifyContent: "center" }} onClick={onClose}>
          <div className="cr-glass-modal" style={{ background: "#FFFFFF", borderRadius: "28px 28px 0 0", padding: 20, width: "100%", maxWidth: 430, border: "2px solid #16232E", maxHeight: "90vh", overflowY: "auto" }} onClick={e => e.stopPropagation()}>
            <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 14, color: "#16232E" }}>Edit Pemain</div>

            <input value={name} onChange={e => setName(e.target.value)} style={{ width: "100%", background: "#FAF7F2", border: "1px solid #16232E20", borderRadius: 14, padding: "12px 14px", color: "#16232E", fontSize: 13, outline: "none", marginBottom: 10 }} />

            <select value={tier} onChange={e => { setTier(e.target.value); }} style={{ width: "100%", background: "#FAF7F2", border: `1px solid ${tierChanged ? "#F0B42960" : "#16232E20"}`, borderRadius: 14, padding: "12px", color: "#16232E", fontSize: 13, outline: "none", marginBottom: tierChanged ? 10 : 0 }}>
              {Object.keys(TIER_WEIGHT).map(t => <option key={t} value={t}>Tier {t} — {TIER_WEIGHT[t]} pts</option>)}
            </select>

            <select value={gender} onChange={e => setGender(e.target.value)} style={{ width: "100%", background: "#FAF7F2", border: "1px solid #16232E20", borderRadius: 14, padding: "12px", color: "#16232E", fontSize: 13, outline: "none", marginBottom: tierChanged ? 10 : 14 }}>
              {Object.entries(GENDER_OPTIONS).map(([key, opt]) => <option key={key} value={key}>Gender — {opt.label}</option>)}

            {tierChanged && (
              <div style={{ marginBottom: 14 }}>
                <div style={{ fontSize: 11, color: "#44515E", marginBottom: 6, fontWeight: 600 }}>Alasan perubahan Tier {player.tier} → {tier}:</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  <div onClick={() => setChangeType("koreksi")} style={{ display: "flex", gap: 10, padding: "10px 12px", background: changeType === "koreksi" ? "#F0B42915" : "#16232E08", border: `1px solid ${changeType === "koreksi" ? "#F0B42960" : "#16232E0a"}`, borderRadius: 10, cursor: "pointer" }}>
                    <div style={{ width: 16, height: 16, borderRadius: "50%", border: `2px solid ${changeType === "koreksi" ? "#F0B429" : "#778899"}`, marginTop: 1, flexShrink: 0, background: changeType === "koreksi" ? "#F0B429" : "none" }} />
                    <div>
                      <div style={{ fontSize: 13, fontWeight: 600, color: changeType === "koreksi" ? "#9A6A00" : "#16232E" }}>🔧 Koreksi — Salah Input</div>
                      <div style={{ fontSize: 11, color: "#617181", marginTop: 2 }}>Semua match di {currentSessionLabel} dikoreksi pakai tier baru. Tidak dicatat sebagai kenaikan.</div>
                    </div>
                  </div>
                  <div onClick={() => setChangeType("resmi")} style={{ display: "flex", gap: 10, padding: "10px 12px", background: changeType === "resmi" ? "#E4574F15" : "#16232E08", border: `1px solid ${changeType === "resmi" ? "#E4574F60" : "#16232E0a"}`, borderRadius: 10, cursor: "pointer" }}>
                    <div style={{ width: 16, height: 16, borderRadius: "50%", border: `2px solid ${changeType === "resmi" ? "#E4574F" : "#778899"}`, marginTop: 1, flexShrink: 0, background: changeType === "resmi" ? "#E4574F" : "none" }} />
                    <div>
                      <div style={{ fontSize: 13, fontWeight: 600, color: changeType === "resmi" ? "#E4574F" : "#16232E" }}>🚀 Perubahan Resmi</div>
                      <div style={{ fontSize: 11, color: "#617181", marginTop: 2 }}>Match lama tetap memakai tier saat match dibuat. Tier baru mulai dipakai match berikutnya.</div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {history.length > 0 && (
              <div style={{ background: "#FAF7F2", border: "2px solid #16232E", borderRadius: 10, padding: "10px 12px", marginBottom: 14 }}>
                <div style={{ fontSize: 11, color: "#617181", fontWeight: 700, marginBottom: 6, letterSpacing: "0.06em" }}>RIWAYAT TIER</div>
                {history.map((h, i) => (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 11, color: "#44515E", padding: "3px 0", borderBottom: i < history.length - 1 ? "1px solid #16232E08" : "none" }}>
                    <span style={{ color: h.type === "koreksi" ? "#9A6A00" : "#E4574F" }}>{h.type === "koreksi" ? "🔧" : "🚀"}</span>
                    <span style={{ fontFamily: "'DM Mono', monospace" }}>{h.from}→{h.to}</span>
                    <span style={{ color: "#778899" }}>·</span>
                    <span>{h.sessionLabel}</span>
                    <span style={{ color: "#778899", marginLeft: "auto" }}>{h.date}</span>
                  </div>
                ))}
              </div>
            )}

            <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
              <button onClick={onClose} style={{ flex: 1, padding: "12px", borderRadius: 10, background: "#16232E10", border: "none", color: "#16232E", fontWeight: 600, cursor: "pointer" }}>Batal</button>
              <button onClick={() => onSave(player.id, name.trim(), tier, gender, changeType)} style={{ flex: 1, padding: "12px", borderRadius: 10, background: "#E4574F", border: "none", color: "#fff", fontWeight: 600, cursor: "pointer" }}>Simpan</button>
            </div>
          </div>
        </div>
      );
    }

    // ===== SMART PREVIEW MODAL =====
    function SmartPreviewModal({ preview, players, onShuffle, onConfirm, onClose }) {
      const getPlayer = id => players.find(p => p.id === id);
      const [team1, setTeam1] = React.useState([...preview.team1]);
      const [team2, setTeam2] = React.useState([...preview.team2]);
      const [swapping, setSwapping] = React.useState(null); // id being swapped
      const t1Weight = team1.reduce((s, id) => s + TIER_WEIGHT[getPlayer(id)?.tier || "E"], 0);
      const t2Weight = team2.reduce((s, id) => s + TIER_WEIGHT[getPlayer(id)?.tier || "E"], 0);
      const diff = Math.abs(t1Weight - t2Weight);
      const t1Role = diff === 0 ? "Seimbang" : (t1Weight > t2Weight ? "Jagoan" : "Underdog");
      const t2Role = diff === 0 ? "Seimbang" : (t2Weight > t1Weight ? "Jagoan" : "Underdog");
      const roleColor = (role) => role === "Jagoan" ? "#E4574F" : role === "Underdog" ? "#9A6A00" : "#16232E";
      const balanceText = diff === 0 ? "⚖ Seimbang" : `${diff} pts tier`;

      const handleTap = (id) => {
        if (!swapping) { setSwapping(id); return; }
        if (swapping === id) { setSwapping(null); return; }
        // Swap the two tapped players between teams
        const newT1 = team1.map(x => x === swapping ? id : x === id ? swapping : x);
        const newT2 = team2.map(x => x === swapping ? id : x === id ? swapping : x);
        setTeam1(newT1); setTeam2(newT2); setSwapping(null);
      };

      const handleShuffle = () => {
        setSwapping(null);
        onShuffle(team1, team2);
      };

      React.useEffect(() => {
        setTeam1([...preview.team1]); setTeam2([...preview.team2]);
      }, [preview.team1.join(), preview.team2.join()]);

      const TeamBlock = ({ ids, label, weight, role }) => (
        <div style={{ flex: 1 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 6, marginBottom: 6 }}>
            <div style={{ fontSize: 10, fontWeight: 700, color: "#617181", letterSpacing: "0.06em" }}>{label}</div>
            <div style={{ fontSize: 10, color: roleColor(role), fontWeight: 800, fontFamily: "'DM Mono', monospace" }}>{weight} · {role}</div>
          </div>
          {ids.map(id => {
            const p = getPlayer(id);
            const isSwapping = swapping === id;
            return (
              <div key={id} onClick={() => handleTap(id)} style={{
                display: "flex", alignItems: "center", gap: 8, padding: "8px 10px",
                background: isSwapping ? "#F0B42920" : "#16232E08",
                border: `1px solid ${isSwapping ? "#F0B42980" : swapping ? "#E4574F40" : "#16232E0a"}`,
                borderRadius: 10, marginBottom: 6, cursor: "pointer", transition: "all 0.15s",
              }}>
                <div style={{ width: 28, height: 28, borderRadius: 7, background: isSwapping ? "#F0B42920" : "#16232E08", border: `1px solid ${isSwapping ? "#F0B42960" : "#16232E15"}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 700, color: isSwapping ? "#9A6A00" : "#617181" }}>
                  {p?.name.slice(0,2).toUpperCase()}
                </div>
                <span style={{ fontSize: 13, fontWeight: 600, color: isSwapping ? "#9A6A00" : "#16232E", flex: 1 }}>{p?.name}</span>
                <TierBadge tier={p?.tier} small />
                {isSwapping && <span style={{ fontSize: 10, color: "#9A6A00" }}>⇄</span>}
              </div>
            );
          })}
        </div>
      );

      return (
        <div style={{ position: "fixed", inset: 0, background: "#000000dd", zIndex: 1500, display: "flex", alignItems: "flex-end", justifyContent: "center" }} onClick={onClose}>
          <div className="cr-glass-modal" style={{ background: "#FFFFFF", borderRadius: "28px 28px 0 0", padding: 20, width: "100%", maxWidth: 430, border: "2px solid #E4574F" }} onClick={e => e.stopPropagation()}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 4 }}>
              <div style={{ fontWeight: 700, fontSize: 15, color: "#16232E" }}>⚡ Smart Match — Lapangan {preview.court}</div>
              <div style={{ fontSize: 11, color: diff === 0 ? "#16232E" : diff <= 10 ? "#9A6A00" : "#E4574F", fontWeight: 700, background: diff === 0 ? "#16232E15" : diff <= 10 ? "#9A6A0015" : "#E4574F15", padding: "3px 8px", borderRadius: 6, border: `1px solid ${diff === 0 ? "#16232E30" : diff <= 10 ? "#9A6A0030" : "#E4574F30"}` }}>
                {balanceText}
              </div>
            </div>
            <div style={{ fontSize: 12, color: "#617181", marginBottom: 10 }}>
              {swapping ? "Tap pemain lain untuk tukar posisi" : "Tap dua pemain untuk tukar tim · atau acak ulang"}
            </div>

            <div style={{ display: "flex", gap: 8, alignItems: "center", justifyContent: "space-between", background: "#FAF7F2", border: "2px solid #16232E", borderRadius: 10, padding: "8px 10px", marginBottom: 12 }}>
              <div style={{ fontSize: 11, color: roleColor(t1Role), fontWeight: 800 }}>Tim A: {t1Weight} pts · {t1Role}</div>
              <div style={{ fontSize: 10, color: "#617181", fontWeight: 700 }}>vs</div>
              <div style={{ fontSize: 11, color: roleColor(t2Role), fontWeight: 800, textAlign: "right" }}>Tim B: {t2Weight} pts · {t2Role}</div>
            </div>

            <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
              <TeamBlock ids={team1} label="TIM A" weight={t1Weight} role={t1Role} />
              <div style={{ display: "flex", alignItems: "center", color: "#617181", fontSize: 13, fontWeight: 700, paddingTop: 20 }}>VS</div>
              <TeamBlock ids={team2} label="TIM B" weight={t2Weight} role={t2Role} />
            </div>

            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={handleShuffle} style={{ flex: 1, padding: "12px", background: "#FFFFFF", border: "2px solid #16232E", borderRadius: 14, color: "#44515E", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>🔀 Acak Ulang</button>
              <button onClick={() => onConfirm(team1, team2)} style={{ flex: 2, padding: "12px", background: "#E4574F", border: "none", borderRadius: 16, color: "#fff", fontWeight: 800, fontSize: 14, cursor: "pointer" }}>✅ Mulai Match!</button>
            </div>
          </div>
        </div>
      );
    }

    function AutoRoundSchedulePanel({ preview, players, checkedIn, session, onShuffle, onEdit, onConfirm, onClose }) {
      const [minimized, setMinimized] = useState(false);
      const locked = false;
      const [scheduleShareBusy, setScheduleShareBusy] = useState(null);
      const [countInput, setCountInput] = useState(String(preview?.matchCount || preview?.matches?.length || 1));
      const [editingScheduleNo, setEditingScheduleNo] = useState(null);
      const scheduleShareRef = useRef(null);
      useEffect(() => { setCountInput(String(preview?.matchCount || preview?.matches?.length || 1)); }, [preview?.matchCount, preview?.generatedAt]);
      const getPlayer = id => players.find(p => p.id === id);
      const teamNames = ids => ids.map(id => getPlayer(id)?.name || "?").join(" & ");
      const items = preview?.matches || [];
      const repeatedIds = items.flatMap(m => [...(m.team1 || []), ...(m.team2 || [])]).reduce((acc, id) => {
        acc[id] = (acc[id] || 0) + 1;
        return acc;
      }, {});
      const plannedRepeatIds = Object.keys(repeatedIds).filter(id => repeatedIds[id] > 1).map(id => Number(id));
      const repeatCount = plannedRepeatIds.length;
      const involvedCount = preview?.playerCount || new Set(items.flatMap(m => [...(m.team1 || []), ...(m.team2 || [])])).size;
      const repeatText = repeatCount > 0 ? `${repeatCount} pemain mendapat lebih dari 1 match.` : "Semua pemain bermain 1x.";
      const repeatNames = plannedRepeatIds.map(id => getPlayer(id)?.name).filter(Boolean).join(", ");
      const matchCount = preview?.matchCount || items.length;
      const summaryText = `${involvedCount} pemain, ${items.length} match, ${repeatText}`;
      const roundMode = ["mixed", "same"].includes(preview?.roundMode) ? preview.roundMode : "free";
      const handleShuffle = (focus, nextCount = matchCount, nextMode = roundMode) => {
        if (locked) return;
        const sameView = focus === preview?.focus && nextMode === roundMode && nextCount === matchCount;
        onShuffle(focus, nextCount, nextMode, sameView);
      };
      const handleRoundMode = (nextMode) => {
        if (locked) return;
        handleShuffle(preview?.focus || "rotation", matchCount, nextMode);
      };
      const applyCount = () => {
        if (locked) return;
        const nextCount = Number(countInput);
        if (!Number.isInteger(nextCount) || nextCount < 1 || nextCount > 500) {
          setCountInput(String(matchCount));
          return;
        }
        if (nextCount !== matchCount) handleShuffle(preview?.focus || "rotation", nextCount, roundMode);
      };
      const buildScheduleShareText = () => {
        const sessionName = (session?.label || "Sesi").toUpperCase();
        const sessionDate = session?.date ? ` (${session.date})` : "";
        let text = `*DATANG DAN SAKSIKAN LAH ${sessionName}${sessionDate}*\n`;
        text += `${involvedCount} pemain, ${items.length} match!\n`;
        text += `Pemain Repeat: ${repeatNames || "-"}\n\n`;
        items.forEach((m, idx) => {
          text += `Match ${m.scheduleNo || idx + 1}: ${teamNames(m.team1)} vs ${teamNames(m.team2)}\n`;
        });
        return text.trim();
      };
      const getScheduleBlob = async () => {
        const el = scheduleShareRef.current;
        if (!el || !window.html2canvas) throw new Error("Jadwal Auto Rounds belum siap");
        const originalCss = el.style.cssText;
        el.style.width = "430px";
        el.style.maxWidth = "430px";
        const canvas = await window.html2canvas(el, { backgroundColor: "#FAF7F2", scale: 2, useCORS: true });
        el.style.cssText = originalCss;
        return new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.9));
      };
      const handleDownloadScheduleImage = async () => {
        setScheduleShareBusy("download");
        try {
          const blob = await getScheduleBlob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `Auto-Rounds-CourtRank-${new Date().toISOString().slice(0, 10)}.jpg`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch (e) {
          console.error(e);
          alert("Gagal simpan gambar Auto Rounds.");
        } finally {
          setScheduleShareBusy(null);
        }
      };
      const handleShareScheduleWA = async () => {
        setScheduleShareBusy("share");
        try {
          const blob = await getScheduleBlob();
          const file = new File([blob], "auto-rounds-courtrank.jpg", { type: "image/jpeg" });
          const textMsg = buildScheduleShareText();
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ title: "Auto Rounds CourtRank", text: textMsg, files: [file] });
          } else {
            window.open(`https://wa.me/?text=${encodeURIComponent(textMsg)}`, "_blank");
          }
        } catch (e) {
          if (e.name !== "AbortError") {
            console.error(e);
            alert("Gagal kirim Auto Rounds ke WA.");
          }
        } finally {
          setScheduleShareBusy(null);
        }
      };
      const shuffleButtonStyle = (active, accent) => ({
        minHeight: 42,
        padding: "9px 10px",
        background: locked ? "#16232E10" : active ? accent : "#FFFFFF",
        border: "2px solid #16232E",
        borderRadius: 14,
        color: locked ? "#617181" : "#16232E",
        fontWeight: 850,
        fontSize: 12,
        cursor: locked ? "not-allowed" : "pointer",
        opacity: locked ? 0.62 : 1,
      });
      return (
        <div style={{ background: "#FFFFFF", border: "2px solid #16232E", borderRadius: 22, padding: 14, boxShadow: "3px 3px 0 #16232E" }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10, marginBottom: 10 }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 17, fontWeight: 900, color: "#16232E" }}>🔄 Auto Rounds</div>
              <div style={{ fontSize: 12, color: "#617181", marginTop: 2, lineHeight: 1.35 }}>
                {summaryText}
              </div>
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              <button onClick={() => setMinimized(v => !v)} aria-label={minimized ? "Buka Auto Rounds" : "Minimize Auto Rounds"} style={{ minWidth: 38, height: 36, padding: "0 9px", borderRadius: 12, border: "1px solid #16232E25", background: "#16232E08", color: "#16232E", fontWeight: 900, cursor: "pointer", fontSize: 12 }}>{minimized ? "▾" : "▴"}</button>
              <button onClick={onClose} aria-label="Tutup jadwal" style={{ width: 36, height: 36, borderRadius: 12, border: "1px solid #16232E25", background: "#16232E08", color: "#16232E", fontWeight: 900, cursor: "pointer" }}>×</button>
            </div>
          </div>
          {!minimized && (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 12 }}>
              <button onClick={handleDownloadScheduleImage} disabled={scheduleShareBusy !== null} style={{ minHeight: 42, padding: "10px 10px", background: "#FFFFFF", border: "2px solid #16232E", borderRadius: 14, color: "#44515E", fontWeight: 850, fontSize: 12, cursor: scheduleShareBusy !== null ? "default" : "pointer" }}>{scheduleShareBusy === "download" ? "⏳" : "💾"} Simpan Gambar</button>
              <button onClick={handleShareScheduleWA} disabled={scheduleShareBusy !== null} style={{ minHeight: 42, padding: "10px 10px", background: scheduleShareBusy === "share" ? "#778899" : "#16232E", border: "2px solid #16232E", borderRadius: 14, color: "#FFFFFF", fontWeight: 850, fontSize: 12, cursor: scheduleShareBusy !== null ? "default" : "pointer" }}>{scheduleShareBusy === "share" ? "⏳" : "💬"} Kirim WA</button>
            </div>
          )}
          <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 8, marginBottom: minimized ? 0 : 12 }}>
            {repeatNames && !minimized && (
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                <span style={{ fontSize: 11, fontWeight: 850, color: "#9A6A00", background: "#F0B42924", border: "1px solid #F0B42980", borderRadius: 999, padding: "4px 8px" }}>Repeat: {repeatNames}</span>
              </div>
            )}
            {!minimized && (
              <>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0, 1fr))", gap: 8, marginBottom: 8 }}>
                  <button disabled={locked} onClick={() => handleRoundMode("free")} style={shuffleButtonStyle(roundMode === "free", "#F0B429")}>Bebas</button>
                  <button disabled={locked} onClick={() => handleRoundMode("mixed")} style={shuffleButtonStyle(roundMode === "mixed", "#F0B429")}>Mix Gender</button>
                  <button disabled={locked} onClick={() => handleRoundMode("same")} style={shuffleButtonStyle(roundMode === "same", "#F0B429")}>Gender Sama</button>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr minmax(72px, 100px) auto", gap: 8, alignItems: "center" }}>
                  <label htmlFor="auto-round-count" style={{ fontSize: 12, fontWeight: 800, color: "#16232E" }}>Jumlah match</label>
                  <input id="auto-round-count" type="number" min="1" max="500" step="1" disabled={locked} value={countInput} onChange={e => setCountInput(e.target.value)} onKeyDown={e => { if (e.key === "Enter") applyCount(); }} style={{ width: "100%", minHeight: 40, border: "2px solid #16232E", borderRadius: 8, padding: "6px 8px", textAlign: "center", fontWeight: 800 }} />
                  <button disabled={locked || Number(countInput) === matchCount} onClick={applyCount} style={{ minHeight: 40, padding: "6px 10px", border: "2px solid #16232E", borderRadius: 8, background: "#F0B429", color: "#16232E", fontWeight: 800, cursor: "pointer" }}>Buat</button>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                  <button disabled={locked} onClick={() => handleShuffle("rotation")} style={shuffleButtonStyle(preview?.focus === "rotation", "#F0B429")}>🔀 Rotation Shuffle</button>
                  <button disabled={locked} onClick={() => handleShuffle("tier")} style={shuffleButtonStyle(preview?.focus === "tier", "#F0B429")}>⚖️ Tier Shuffle</button>
                </div>

              </>
            )}
          </div>
          {!minimized && (
            <div style={{ marginBottom: 12 }}>
              <button onClick={onConfirm} style={{ width: "100%", minHeight: 48, padding: "11px 12px", background: "#E4574F", border: "2px solid #16232E", borderRadius: 12, color: "#FFFFFF", fontWeight: 900, fontSize: 14, cursor: "pointer", boxShadow: "3px 3px 0 #16232E" }}>✓ Konfirmasi {items.length} Match</button>
              <div style={{ marginTop: 6, fontSize: 11, lineHeight: 1.4, color: "#617181", textAlign: "center" }}>Setelah dikonfirmasi, semua match masuk ke Match Berlangsung dan pemain masih bisa diedit.</div>
            </div>
          )}
          {!minimized && (
            <div ref={scheduleShareRef} style={{ display: "flex", flexDirection: "column", gap: 10, background: "#FFFFFF", border: "2px solid #16232E", borderRadius: 22, padding: 12, boxShadow: "3px 3px 0 #16232E" }}>
              {items.map((m, idx) => {
                const fakeMatch = { team1: m.team1, team2: m.team2, games: [{ t1: 0, t2: 0 }], tierSnapshot: {} };
                const repeatedInThisMatch = [...m.team1, ...m.team2].filter(id => plannedRepeatIds.includes(id));
                return (
                  <div key={`${m.scheduleNo}-${idx}`} style={{ background: "#FAF7F2", border: "2px solid #16232E", borderRadius: 18, padding: 12 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, marginBottom: 8 }}>
                      <div style={{ fontSize: 13, fontWeight: 900, color: "#16232E" }}>Match {m.scheduleNo || idx + 1}</div>
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", justifyContent: "flex-end" }}>
                        <div style={{ fontSize: 10, fontWeight: 850, color: m.mixType === "mixed" ? "#BE185D" : "#44515E", background: m.mixType === "mixed" ? "#FCE7F3" : "#16232E08", border: `1px solid ${m.mixType === "mixed" ? "#F9A8D4" : "#16232E20"}`, borderRadius: 999, padding: "3px 8px" }}>{m.mixType === "mixed" ? "Mix Gender" : m.mixType === "same" ? (m.genderAdjusted ? "Gender Sama · Penyesuaian" : "Gender Sama") : "Bebas"}</div>
                        {repeatedInThisMatch.length > 0 && (
                          <div style={{ fontSize: 10, fontWeight: 850, color: "#9A6A00", background: "#F0B42924", border: "1px solid #F0B42975", borderRadius: 999, padding: "3px 8px" }}>ada pemain repeat</div>
                        )}
                      </div>
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 28px 1fr", gap: 8, alignItems: "center", marginBottom: 2 }}>
                      <div style={{ minWidth: 0, fontSize: 13, fontWeight: 850, color: "#16232E", lineHeight: 1.25 }}>{teamNames(m.team1)}</div>
                      <div style={{ textAlign: "center", fontSize: 11, fontWeight: 900, color: "#617181" }}>VS</div>
                      <div style={{ minWidth: 0, textAlign: "right", fontSize: 13, fontWeight: 850, color: "#16232E", lineHeight: 1.25 }}>{teamNames(m.team2)}</div>
                    </div>
                    <button onClick={() => setEditingScheduleNo(editingScheduleNo === m.scheduleNo ? null : m.scheduleNo)} style={{ minHeight: 32, marginTop: 8, padding: "4px 0", border: "none", background: "transparent", color: "#3A7BD5", fontSize: 11, fontWeight: 800, cursor: "pointer" }}>{editingScheduleNo === m.scheduleNo ? "Selesai edit" : "Ganti pemain"}</button>
                    {editingScheduleNo === m.scheduleNo && (
                      <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", gap: 8, marginTop: 8 }}>
                        {["team1", "team2"].flatMap((team, teamIndex) => m[team].map((id, slot) => (
                          <label key={`${team}-${slot}`} style={{ minWidth: 0, fontSize: 11, color: "#44515E", fontWeight: 700 }}>
                            Tim {teamIndex + 1} · Pemain {slot + 1}
                            <select value={id} onChange={e => onEdit(m.scheduleNo, team, slot, e.target.value)} style={{ display: "block", width: "100%", minWidth: 0, minHeight: 38, marginTop: 3, padding: "4px 6px", border: "1px solid #16232E50", borderRadius: 8, background: "#FFFFFF", color: "#16232E", fontSize: 12 }}>
                              {players.filter(p => checkedIn.has(p.id) || p.id === id).map(p => <option key={p.id} value={p.id}>{p.name} · {p.tier}</option>)}
                            </select>
                          </label>
                        )))}
                      </div>
                    )}
                    <TierMatchStatus match={fakeMatch} players={players} compact />
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }
    function AutoRoundPreviewModal({ preview, players, onShuffle, onConfirm, onClose }) {
      const getPlayer = id => players.find(p => p.id === id);
      const teamNames = ids => ids.map(id => getPlayer(id)?.name || "?").join(" & ");
      const modeLabel = mode => mode === "single" ? "Single" : "Double";
