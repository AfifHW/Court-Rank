      };

      const calcBestSingles = (avail, freeCourt, allowRelaxedShuffle = false) => {
        const matchHasPlayer = (m, id) => [...(m.team1 || []), ...(m.team2 || [])].includes(id);
        const allTimeMatchCount = (id) => matches.filter(m => m.status === "done" && matchHasPlayer(m, id)).length;
        const sessionMatchCount = (id) => currentSessionMatches.filter(m => (m.status === "done" || m.status === "ongoing") && matchHasPlayer(m, id)).length;
        const pairKey = (a, b) => [a, b].sort((x, y) => String(x).localeCompare(String(y))).join("|");
        const opponentHistory = new Map();
        matches.filter(m => m.status === "done").forEach(m => {
          const t1 = m.team1 || [];
          const t2 = m.team2 || [];
          t1.forEach(a => t2.forEach(b => {
            const key = pairKey(a, b);
            opponentHistory.set(key, (opponentHistory.get(key) || 0) + 1);
          }));
        });
        const candidates = [];
        for (let i = 0; i < avail.length - 1; i++) {
          for (let j = i + 1; j < avail.length; j++) {
            const p1 = avail[i];
            const p2 = avail[j];
            const allTimeTotalPlayed = allTimeMatchCount(p1.id) + allTimeMatchCount(p2.id);
            const sessionTotalPlayed = sessionMatchCount(p1.id) + sessionMatchCount(p2.id);
            const tierDiff = Math.abs((TIER_WEIGHT[p1.tier] || TIER_WEIGHT.E) - (TIER_WEIGHT[p2.tier] || TIER_WEIGHT.E));
            const repeatPenalty = (opponentHistory.get(pairKey(p1.id, p2.id)) || 0) * 10;
            const rotationScore = (allTimeTotalPlayed * 100000) + (sessionTotalPlayed * 1000);
            const matchQuality = tierDiff + repeatPenalty;
            candidates.push({ team1: [p1.id], team2: [p2.id], diff: tierDiff, tierQuality: tierDiff, varietyPenalty: repeatPenalty, matchQuality, rotationScore, score: (rotationScore * 1000) + matchQuality, court: freeCourt, mode: "single" });
          }
        }
        if (candidates.length === 0) return [];
        candidates.sort((a, b) => a.rotationScore - b.rotationScore || a.matchQuality - b.matchQuality || a.score - b.score);
        const bestRotation = candidates[0].rotationScore;
        const rotationLimit = allowRelaxedShuffle ? bestRotation + 1200 : bestRotation;
        const rotationPool = candidates.filter(c => c.rotationScore <= rotationLimit);
        const bestQuality = Math.min(...rotationPool.map(c => c.matchQuality));
        const balancedPool = rotationPool.filter(c => c.matchQuality <= bestQuality + (allowRelaxedShuffle ? 160 : 0));
        return (balancedPool.length ? balancedPool : rotationPool).slice(0, 16);
      };

      const buildAutoRoundPlan = (allowRelaxedShuffle = true, focus = "rotation", extraMatches = 0, roundMode = autoRoundMode) => {
        const freeCourts = courts.filter(c => !occupiedCourts.has(c));
        const baseAvail = players.filter(p => checkedIn.has(p.id) && !activePlayers.has(p.id));
        if (baseAvail.length < 4) return { error: "Auto Rounds double butuh minimal 4 pemain tersedia." };
        const matchHasPlayer = (m, id) => [...(m.team1 || []), ...(m.team2 || [])].includes(id);
        const allTimeMatchCount = (id) => matches.filter(m => m.status === "done" && matchHasPlayer(m, id)).length;
        const sessionMatchCount = (id) => currentSessionMatches.filter(m => (m.status === "done" || m.status === "ongoing") && matchHasPlayer(m, id)).length;
        const rotationLoad = (id) => allTimeMatchCount(id) + sessionMatchCount(id);
        const byRotation = (a, b) => rotationLoad(a.id) - rotationLoad(b.id) || allTimeMatchCount(a.id) - allTimeMatchCount(b.id) || sessionMatchCount(a.id) - sessionMatchCount(b.id) || (TIER_WEIGHT[a.tier] || 0) - (TIER_WEIGHT[b.tier] || 0) || String(a.name).localeCompare(String(b.name));
        const byRepeatRotation = (a, b) => rotationLoad(a.id) - rotationLoad(b.id) || allTimeMatchCount(a.id) - allTimeMatchCount(b.id) || sessionMatchCount(a.id) - sessionMatchCount(b.id) || String(a.name).localeCompare(String(b.name));
        const byRepeatTier = (a, b) => allTimeMatchCount(a.id) - allTimeMatchCount(b.id) || sessionMatchCount(a.id) - sessionMatchCount(b.id) || String(a.name).localeCompare(String(b.name));
        const byRepeatPriority = focus === "tier" ? byRepeatTier : byRepeatRotation;
        const planned = [];
        const usedCount = new Map(baseAvail.map(p => [p.id, 1]));
        const baseMatchCount = Math.ceil(baseAvail.length / 4);
        const safeExtraMatches = Math.max(0, Math.min(Number(extraMatches) || 0, Math.max(0, Math.floor(baseAvail.length / 4))));
        const totalSlots = (baseMatchCount + safeExtraMatches) * 4;
        const repeatSlots = Math.max(0, totalSlots - baseAvail.length);
        const repeatPlayers = [...baseAvail].sort(byRepeatPriority).slice(0, Math.min(repeatSlots, baseAvail.length));
        const schedulePool = [...baseAvail].sort(byRotation);
        repeatPlayers.forEach(p => {
          schedulePool.push(p);
          usedCount.set(p.id, (usedCount.get(p.id) || 0) + 1);
        });

        const makeGroups = (pool) => {
          const groups = [];
          for (let start = 0; start < pool.length; start += 4) {
            const group = pool.slice(start, start + 4);
            if (group.length === 4) groups.push(group);
          }
          return groups;
        };
        const hasDuplicateInGroup = (group) => new Set(group.map(p => p.id)).size !== group.length;
        const shuffleCopy = (arr) => {
          const copy = [...arr];
          for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
          }
          return copy;
        };
        const playerGender = (p) => normalizeGender(p?.gender);
        const isMale = (p) => playerGender(p) === "male";
        const isFemale = (p) => playerGender(p) === "female";
        const isMixedTeamIds = (ids) => {
          const teamPlayers = ids.map(id => players.find(p => p.id === id)).filter(Boolean);
          return teamPlayers.length === 2 && teamPlayers.some(isMale) && teamPlayers.some(isFemale);
        };
        const mixedCandidateScore = (group, scheduleNo) => {
          const candidates = calcBestMatches(group, scheduleNo, allowRelaxedShuffle, "tier").filter(c => isMixedTeamIds(c.team1) && isMixedTeamIds(c.team2));
          const best = candidates[0];
          if (!best) return Infinity;
          return ((best.pairGapWorst || 0) * 4600) + ((best.pairGapTotal || 0) * 1300) + ((best.diff || 0) * 2600) + (Math.max(0, (best.diff || 0) - 150) * 9000) + ((best.varietyPenalty || 0) * 9);
        };
        const makeMixedGroupsAndRest = (pool) => {
          const entries = pool.map((p, idx) => ({ p, key: `${p.id}-${idx}` }));
          const mixedGroups = [];
          const pairItems = (items) => {
            const pairs = [];
            for (let i = 0; i < items.length; i++) {
              for (let j = i + 1; j < items.length; j++) {
                if (items[i].p.id !== items[j].p.id) pairs.push([items[i], items[j]]);
              }
            }
            return pairs;
          };
          while (true) {
            const malePairs = pairItems(entries.filter(item => isMale(item.p)));
            const femalePairs = pairItems(entries.filter(item => isFemale(item.p)));
            if (!malePairs.length || !femalePairs.length) break;
            let best = null;
            malePairs.forEach(mp => {
              femalePairs.forEach(fp => {
                const groupEntries = [...mp, ...fp];
                const uniqueIds = new Set(groupEntries.map(item => item.p.id));
                if (uniqueIds.size !== 4) return;
                const group = groupEntries.map(item => item.p);
                const score = mixedCandidateScore(group, mixedGroups.length + 1);
                if (!Number.isFinite(score)) return;
                const rotationScore = groupEntries.reduce((sum, item) => sum + entries.findIndex(e => e.key === item.key), 0);
                const totalScore = score + rotationScore;
                if (!best || totalScore < best.score) best = { score: totalScore, keys: groupEntries.map(item => item.key), group };
              });
            });
            if (!best) break;
            mixedGroups.push(best.group);
            best.keys.forEach(key => {
              const idx = entries.findIndex(item => item.key === key);
              if (idx >= 0) entries.splice(idx, 1);
            });
          }
          return { mixedGroups, restPool: entries.map(item => item.p) };
        };
        const scoreGroups = (groups) => {
          let total = 0;
          let worstDiff = 0;
          let worstPairGap = 0;
          for (let idx = 0; idx < groups.length; idx++) {
            const group = groups[idx];
            if (hasDuplicateInGroup(group)) return Infinity;
            const best = calcBestMatches(group, idx + 1, allowRelaxedShuffle, "tier")[0];
            if (!best) return Infinity;
            worstDiff = Math.max(worstDiff, best.diff || 0);
            worstPairGap = Math.max(worstPairGap, best.pairGapWorst || 0);
            total += ((best.pairGapWorst || 0) * 3600) + ((best.pairGapTotal || 0) * 1100) + (Math.max(0, (best.pairGapWorst || 0) - 200) * 8500) + ((best.diff || 0) * 2600) + (Math.max(0, (best.diff || 0) - 150) * 9000) + ((best.tierQuality || 0) * 18) + ((best.varietyPenalty || 0) * 8) + ((best.rotationScore || 0) / 1000000);
          }
          return total + (worstPairGap * 5200) + (Math.max(0, worstPairGap - 200) * 9000) + (worstDiff * 5200) + (Math.max(0, worstDiff - 150) * 11000);
        };
        const tierSeedPool = () => {
          const groupCount = Math.max(1, Math.ceil(schedulePool.length / 4));
          const groups = Array.from({ length: groupCount }, () => []);
          const sorted = [...schedulePool].sort((a, b) => (TIER_WEIGHT[b.tier] || 0) - (TIER_WEIGHT[a.tier] || 0) || byRotation(a, b));
          sorted.forEach((p, idx) => {
            const cycle = Math.floor(idx / groupCount);
            const pos = idx % groupCount;
            const target = cycle % 2 === 0 ? pos : groupCount - 1 - pos;
            groups[target].push(p);
          });
          return groups.flat();
        };

        let finalPool = schedulePool;
        if (focus === "tier") {
          let bestPool = tierSeedPool();
          let bestScore = scoreGroups(makeGroups(bestPool));
          const candidatePools = [schedulePool, [...schedulePool].reverse(), tierSeedPool()];
          candidatePools.forEach(pool => {
            const poolScore = scoreGroups(makeGroups(pool));
            if (poolScore < bestScore) {
              bestScore = poolScore;
              bestPool = pool;
            }
          });
          for (let i = 0; i < 2200; i++) {
            const trial = shuffleCopy(schedulePool);
            const trialScore = scoreGroups(makeGroups(trial));
            if (trialScore < bestScore) {
              bestScore = trialScore;
              bestPool = trial;
            }
          }
          for (let i = 0; i < 500; i++) {
            const trial = [...bestPool];
            const a = Math.floor(Math.random() * trial.length);
            let b = Math.floor(Math.random() * trial.length);
            if (a === b) b = (b + 1) % trial.length;
            [trial[a], trial[b]] = [trial[b], trial[a]];
            const trialScore = scoreGroups(makeGroups(trial));
            if (trialScore <= bestScore) {
              bestScore = trialScore;
              bestPool = trial;
            }
          }
          finalPool = bestPool;
        }

        const repeatTarget = new Map(baseAvail.map(p => [p.id, 1]));
        repeatPlayers.forEach(p => repeatTarget.set(p.id, (repeatTarget.get(p.id) || 1) + 1));
        const countPoolIds = (pool) => pool.reduce((acc, p) => {
          acc.set(p.id, (acc.get(p.id) || 0) + 1);
          return acc;
        }, new Map());
        const hasFullCoverage = (pool) => {
          const counts = countPoolIds(pool);
          return baseAvail.every(p => (counts.get(p.id) || 0) >= 1) && repeatPlayers.every(p => (counts.get(p.id) || 0) >= (repeatTarget.get(p.id) || 1));
        };
        if (!hasFullCoverage(finalPool) || scoreGroups(makeGroups(finalPool)) === Infinity) {
          finalPool = schedulePool;
        }

        const makePlannedFromPool = (pool) => {
          const result = [];
          const addGroup = (group, mixedPreferred = false) => {
            const court = freeCourts[result.length] || null;
            const scheduleNo = result.length + 1;
            const candidates = calcBestMatches(group, court || scheduleNo, allowRelaxedShuffle, focus);
            const mixedCandidates = mixedPreferred ? candidates.filter(c => isMixedTeamIds(c.team1) && isMixedTeamIds(c.team2)) : [];
            const sourceCandidates = mixedCandidates.length ? mixedCandidates : candidates;
            const pickPool = focus === "tier" ? sourceCandidates.slice(0, Math.min(4, sourceCandidates.length)) : sourceCandidates;
            const candidate = pickPool.length ? pickPool[Math.floor(Math.random() * pickPool.length)] : null;
            if (!candidate) return;
            result.push({ ...candidate, court, scheduleNo, mode: "double", mixType: mixedCandidates.length ? "mixed" : "free" });
          };
          if (roundMode === "mixed") {
            const { mixedGroups, restPool } = makeMixedGroupsAndRest(pool);
            const restGroups = makeGroups(restPool);
            if (mixedGroups.length && scoreGroups(restGroups) !== Infinity) {
              mixedGroups.forEach(group => addGroup(group, true));
              restGroups.forEach(group => addGroup(group, false));
            } else {
              makeGroups(pool).forEach(group => addGroup(group, false));
            }
          } else {
            makeGroups(pool).forEach(group => addGroup(group, false));
          }
          return result;
        };

        let safePlanned = makePlannedFromPool(finalPool);
        const plannedCounts = (items) => items.flatMap(m => [...(m.team1 || []), ...(m.team2 || [])]).reduce((acc, id) => {
          acc.set(id, (acc.get(id) || 0) + 1);
          return acc;
        }, new Map());
        const hasPlannedCoverage = (items) => {
          const counts = plannedCounts(items);
          return baseAvail.every(p => (counts.get(p.id) || 0) >= 1) && repeatPlayers.every(p => (counts.get(p.id) || 0) >= (repeatTarget.get(p.id) || 1));
        };
        if (!hasPlannedCoverage(safePlanned)) {
          safePlanned = makePlannedFromPool(schedulePool);
        }
        safePlanned.forEach(match => {
          [...(match.team1 || []), ...(match.team2 || [])].forEach(id => usedCount.set(id, (usedCount.get(id) || 0) + 1));
          planned.push(match);
        });

        if (planned.length === 0) return { error: "Belum bisa membuat ronde dari pemain yang tersedia." };
        if (!hasPlannedCoverage(planned)) return { error: "Auto Rounds belum bisa memastikan semua pemain hadir kebagian main. Coba kocok ulang." };
        return { matches: planned, generatedAt: Date.now(), freeCourtCount: freeCourts.length, playerCount: baseAvail.length, focus, roundMode: roundMode === "mixed" ? "mixed" : "free", mixedMatchCount: planned.filter(m => m.mixType === "mixed").length, extraMatches: safeExtraMatches, baseMatchCount, repeatPlayerIds: repeatPlayers.map(p => p.id) };
      };

      const buildMatchSchedule = (focus, requestedCount, roundMode, historyMatches = matches) => {
        const available = players.filter(p => checkedIn.has(p.id) && !activePlayers.has(p.id));
        if (available.length < 4) return { error: "Butuh minimal 4 pemain yang hadir dan tersedia." };
        const males = available.filter(p => normalizeGender(p.gender) === "male");
        const females = available.filter(p => normalizeGender(p.gender) === "female");
        const strictMixedAvailable = males.length >= 2 && females.length >= 2;
        const tierWeight = player => TIER_WEIGHT[player?.tier] || TIER_WEIGHT.E;
        const nearestSubstitutes = (targetPool, candidatePool, needed) => {
          if (needed <= 0 || candidatePool.length === 0) return [];
          const targetWeights = targetPool.map(tierWeight);
          const targetMax = targetWeights.length ? Math.max(...targetWeights) : 0;
          return candidatePool.slice().sort((a, b) => {
            const aw = tierWeight(a), bw = tierWeight(b);
            const aGap = targetWeights.length ? Math.min(...targetWeights.map(weight => Math.abs(weight - aw))) : 0;
            const bGap = targetWeights.length ? Math.min(...targetWeights.map(weight => Math.abs(weight - bw))) : 0;
            const aTooStrong = targetWeights.length && aw > targetMax ? 1 : 0;
            const bTooStrong = targetWeights.length && bw > targetMax ? 1 : 0;
            return aTooStrong - bTooStrong || aGap - bGap || aw - bw;
          }).slice(0, needed);
        };
        const femaleWeights = females.map(p => TIER_WEIGHT[p.tier] || TIER_WEIGHT.E);
        const maleWeights = males.map(p => TIER_WEIGHT[p.tier] || TIER_WEIGHT.E);
        const maleSubstitutes = females.length > 0 && females.length < 4 ? nearestSubstitutes(females, males, 4 - females.length) : [];
        const femaleSubstitutes = males.length > 0 && males.length < 4 ? nearestSubstitutes(males, females, 4 - males.length) : [];
        const adjustedFemalePool = females.length >= 4 ? females : [...females, ...maleSubstitutes];
        const adjustedMalePool = males.length >= 4 ? males : [...males, ...femaleSubstitutes];
        const count = Math.max(1, Math.min(500, Math.floor(Number(requestedCount) || Math.ceil(available.length / 4))));
        const freeCourts = courts.filter(c => !occupiedCourts.has(c));
        const usage = new Map(available.map(p => [p.id, 0]));
        const recent = new Map();
        const firstSessionId = sessions[0]?.id || "s1";
        // Rotation memakai seluruh riwayat Arena; usage menjaga batch yang sedang dibuat tetap merata.
        const countedHistoryMatches = historyMatches.filter(m => m.status === "done" || m.status === "ongoing");
        const historySessionMatches = countedHistoryMatches.filter(m =>
          m.sessionId === currentSessionId || (!m.sessionId && currentSessionId === firstSessionId)
        );
        const allTimeBaseline = new Map(available.map(p => [p.id, countedHistoryMatches.filter(m =>
          [...(m.team1 || []), ...(m.team2 || [])].includes(p.id)).length]));
        const sessionBaseline = new Map(available.map(p => [p.id, historySessionMatches.filter(m =>
          [...(m.team1 || []), ...(m.team2 || [])].includes(p.id)).length]));
        const partnerHistory = new Map();
        const opponentHistory = new Map();
        const pairKey = (a, b) => [a, b].sort((x, y) => String(x).localeCompare(String(y))).join("|");
        const addPair = (map, a, b) => { const key = pairKey(a, b); map.set(key, (map.get(key) || 0) + 1); };
        historyMatches.forEach(m => {
          if (m.team1.length === 2 && m.team2.length === 2) {
            addPair(partnerHistory, m.team1[0], m.team1[1]);
            addPair(partnerHistory, m.team2[0], m.team2[1]);
            m.team1.forEach(a => m.team2.forEach(b => addPair(opponentHistory, a, b)));
          }
        });
        const rankPool = pool => pool.map(p => ({ p, random: Math.random() })).sort((a, b) => {
          if (focus === "rotation") {
            const aAllTime = (allTimeBaseline.get(a.p.id) || 0) + (usage.get(a.p.id) || 0);
            const bAllTime = (allTimeBaseline.get(b.p.id) || 0) + (usage.get(b.p.id) || 0);
            const aSession = (sessionBaseline.get(a.p.id) || 0) + (usage.get(a.p.id) || 0);
            const bSession = (sessionBaseline.get(b.p.id) || 0) + (usage.get(b.p.id) || 0);
            return aAllTime - bAllTime || aSession - bSession || (usage.get(a.p.id) - usage.get(b.p.id)) || a.random - b.random;
          }
          return (usage.get(a.p.id) - usage.get(b.p.id)) || (sessionBaseline.get(a.p.id) - sessionBaseline.get(b.p.id)) || a.random - b.random;
        }).slice(0, 12).map(item => item.p);
        const planned = [];
        for (let scheduleNo = 1; scheduleNo <= count; scheduleNo++) {
          const groups = [];
          const makeGroups = pool => {
            for (let a = 0; a < pool.length - 3; a++) for (let b = a + 1; b < pool.length - 2; b++)
              for (let c = b + 1; c < pool.length - 1; c++) for (let d = c + 1; d < pool.length; d++)
                groups.push([pool[a], pool[b], pool[c], pool[d]]);
          };
          if (roundMode === "mixed") {
            if (strictMixedAvailable) {
              const men = rankPool(males).slice(0, 8);
              const women = rankPool(females).slice(0, 8);
              for (let a = 0; a < men.length - 1; a++) for (let b = a + 1; b < men.length; b++)
                for (let c = 0; c < women.length - 1; c++) for (let d = c + 1; d < women.length; d++)
                  groups.push([men[a], men[b], women[c], women[d]]);
            } else makeGroups(rankPool(available));
          } else if (roundMode === "same") {
            if (males.length >= 4) makeGroups(rankPool(males));
            else if (adjustedMalePool.length >= 4) makeGroups(rankPool(adjustedMalePool));
            if (females.length >= 4) makeGroups(rankPool(females));
            else if (adjustedFemalePool.length >= 4) makeGroups(rankPool(adjustedFemalePool));
            if (groups.length === 0) makeGroups(rankPool(available));
          } else makeGroups(rankPool(available));
          let best = null;
          groups.forEach(group => {
            const ids = group.map(p => p.id);
            const plays = ids.map(id => usage.get(id));
            const load = plays.reduce((sum, n) => sum + n, 0);
            const spread = Math.max(...plays) - Math.min(...plays);
            const allTimeCounts = ids.map(id => (allTimeBaseline.get(id) || 0) + (usage.get(id) || 0));
            const sessionCounts = ids.map(id => (sessionBaseline.get(id) || 0) + (usage.get(id) || 0));
            const allTimeTotalPlayed = allTimeCounts.reduce((sum, value) => sum + value, 0);
            const sessionTotalPlayed = sessionCounts.reduce((sum, value) => sum + value, 0);
            const allTimeSpread = Math.max(...allTimeCounts) - Math.min(...allTimeCounts);
            const sessionSpread = Math.max(...sessionCounts) - Math.min(...sessionCounts);
            const minAllTimePlayed = Math.min(...available.map(player => (allTimeBaseline.get(player.id) || 0) + (usage.get(player.id) || 0)));
            const minSessionPlayed = Math.min(...available.map(player => (sessionBaseline.get(player.id) || 0) + (usage.get(player.id) || 0)));
            const allTimeBehindCount = allTimeCounts.filter(value => value === minAllTimePlayed).length;
            const sessionBehindCount = sessionCounts.filter(value => value === minSessionPlayed).length;
            const rotationScore = (allTimeTotalPlayed * 100000) + (sessionTotalPlayed * 1000) + (allTimeSpread * 200) + (sessionSpread * 50) - (allTimeBehindCount * 500) - (sessionBehindCount * 100);
            const recentPenalty = ids.reduce((sum, id) => sum + (scheduleNo - (recent.get(id) || -100) <= Math.max(1, Math.floor(available.length / 4)) ? 1 : 0), 0);
            const pairings = [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]];
            pairings.forEach(([left, right]) => {
              const team1 = left.map(i => ids[i]);
              const team2 = right.map(i => ids[i]);
              const validMixedTeams = [team1, team2].every(team =>
                team.some(id => normalizeGender(players.find(p => p.id === id)?.gender) === "male") &&
                team.some(id => normalizeGender(players.find(p => p.id === id)?.gender) === "female"));
              if (roundMode === "mixed" && strictMixedAvailable && !validMixedTeams) return;
              const weight = team => team.map(id => TIER_WEIGHT[players.find(p => p.id === id)?.tier] || TIER_WEIGHT.E);
              const w1 = weight(team1);
              const w2 = weight(team2);
              const diff = Math.abs(w1[0] + w1[1] - w2[0] - w2[1]);
              const pairGap = Math.abs(w1[0] - w1[1]) + Math.abs(w2[0] - w2[1]);
              const repeat = (partnerHistory.get(pairKey(...team1)) || 0) + (partnerHistory.get(pairKey(...team2)) || 0);
              const opponents = team1.reduce((sum, a) => sum + team2.reduce((n, b) => n + (opponentHistory.get(pairKey(a, b)) || 0), 0), 0);
              const quality = focus === "tier" ? diff * 8 + pairGap * 1.5 : diff * 0.35 + pairGap * 0.15;
              const groupGenders = new Set(group.map(player => normalizeGender(player.gender)));
              const fillsFemaleGroup = females.length > 0 && females.length < 4 && groupGenders.has("female") && groupGenders.has("male");
              const fillsMaleGroup = males.length > 0 && males.length < 4 && groupGenders.has("male") && groupGenders.has("female");
              const adjustedGroupPriority = roundMode === "same" && (fillsFemaleGroup || fillsMaleGroup) ? -50000 : 0;
              const mixedFallbackPenalty = roundMode === "mixed" && !validMixedTeams ? [team1, team2].reduce((sum, team) => {
                const teamPlayers = team.map(id => players.find(player => player.id === id)).filter(Boolean);
                const teamGenders = new Set(teamPlayers.map(player => normalizeGender(player.gender)));
                if (teamGenders.has("male") && teamGenders.has("female")) return sum;
                const targetWeights = teamGenders.has("male") ? femaleWeights : maleWeights;
                const substituteWeight = tierWeight(teamPlayers.slice().sort((a, b) => tierWeight(a) - tierWeight(b))[0]);
                const nearestGap = targetWeights.length ? Math.min(...targetWeights.map(value => Math.abs(value - substituteWeight))) : Math.abs(tierWeight(teamPlayers[0]) - tierWeight(teamPlayers[1]));
                return sum + 6000 + nearestGap * 20;
              }, 0) : 0;
              const repeatWeight = focus === "rotation" ? 6500 : 350;
              const opponentWeight = focus === "rotation" ? 1400 : 90;
              const rotationPriority = rotationScore * 1000;
              const tierPriority = load * 100000 + spread * 3000 + sessionTotalPlayed * 250;
              const score = (focus === "rotation" ? rotationPriority : tierPriority) + recentPenalty * 1200 + quality + repeat * repeatWeight + opponents * opponentWeight + mixedFallbackPenalty + adjustedGroupPriority + Math.random() * 30;
              const actualGenders = new Set(ids.map(id => normalizeGender(players.find(p => p.id === id)?.gender)));
              const pureKnownGender = actualGenders.size === 1 && (actualGenders.has("male") || actualGenders.has("female"));
              const genderAdjusted = (roundMode === "same" && !pureKnownGender) || (roundMode === "mixed" && !validMixedTeams);
              if (!best || score < best.score) best = { score, team1, team2, diff, genderAdjusted };
            });
          });
          if (!best) return { error: "Tidak bisa membuat kombinasi match untuk mode ini." };
          [...best.team1, ...best.team2].forEach(id => { usage.set(id, usage.get(id) + 1); recent.set(id, scheduleNo); });
          addPair(partnerHistory, ...best.team1);
          addPair(partnerHistory, ...best.team2);
          best.team1.forEach(a => best.team2.forEach(b => addPair(opponentHistory, a, b)));
          planned.push({ team1: best.team1, team2: best.team2, diff: best.diff, court: freeCourts[scheduleNo - 1] || null,
            scheduleNo, mode: "double", mixType: roundMode, genderAdjusted: !!best.genderAdjusted });
        }
        const repeated = [...usage].filter(([, times]) => times > 1).map(([id]) => id);
        return { matches: planned, generatedAt: Date.now(), freeCourtCount: freeCourts.length,
          playerCount: available.length, focus, roundMode, matchCount: count, repeatPlayerIds: repeated };
      };

      const getAutoRoundCacheKey = (focus = "rotation", extraMatches = 0, roundModeOverride = autoRoundMode) => {
        const safeFocus = focus === "tier" ? "tier" : "rotation";
        const safeRoundMode = ["mixed", "same"].includes(roundModeOverride) ? roundModeOverride : "free";
        const availableIds = players
          .filter(p => checkedIn.has(p.id) && !activePlayers.has(p.id))
          .map(p => p.id)
          .sort((a, b) => a - b)
          .join("-");
        const matchSignature = matches
          .filter(m => m.status === "done" || m.status === "ongoing")
          .map(m => `${m.id}:${m.status}`)
          .join("|");
        return `${currentSessionId}|${safeRoundMode}|${safeFocus}|${Number(extraMatches) || 0}|${availableIds}|${matchSignature}`;
      };

      const handleAutoRound = (focus = "rotation", requestedCount = null, roundModeOverride = autoRoundMode, forceShuffle = false) => {
        if (readOnly) return showNotify("Mode lihat saja: data tidak bisa diedit.", "error");
        const safeFocus = focus === "tier" ? "tier" : "rotation";
        const safeRoundMode = ["mixed", "same"].includes(roundModeOverride) ? roundModeOverride : "free";
        const defaultCount = Math.ceil(players.filter(p => checkedIn.has(p.id) && !activePlayers.has(p.id)).length / 4);
        const matchCount = requestedCount == null ? defaultCount : requestedCount;
        const cacheKey = getAutoRoundCacheKey(safeFocus, matchCount, safeRoundMode);
        setAutoRoundMode(safeRoundMode);
        if (!forceShuffle && autoRoundVariantCache[cacheKey]) {
          const cached = autoRoundVariantCache[cacheKey];
          setAutoRoundPreview(cached);
          setLockedAutoRoundsBySession(prev => ({ ...prev, [currentSessionId]: cached }));
          return;
        }
        const plan = buildMatchSchedule(safeFocus, matchCount, safeRoundMode);
        if (plan.error) { showNotify(plan.error, "error"); return; }
        setAutoRoundVariantCache(prev => ({ ...prev, [cacheKey]: plan }));
        setAutoRoundPreview(plan);
        setLockedAutoRoundsBySession(prev => ({ ...prev, [currentSessionId]: plan }));
      };

      const handleAutoRoundLockChange = (nextLocked) => {
        setAutoRoundPreview(prev => {
          if (!prev) return prev;
          const nextPreview = { ...prev, locked: nextLocked };
          setLockedAutoRoundsBySession(saved => {
            const next = { ...saved };
            next[currentSessionId] = nextPreview;
            return next;
          });
          return nextPreview;
        });
      };

      const handleEditAutoRoundMatch = (scheduleNo, teamKey, slot, selectedId) => {
        const id = Number(selectedId);
        const current = autoRoundPreview?.matches?.find(m => m.scheduleNo === scheduleNo);
        if (!current || !players.some(p => p.id === id && checkedIn.has(id))) return;
        const nextMatch = { ...current, team1: [...current.team1], team2: [...current.team2] };
        const oldId = nextMatch[teamKey][slot];
        const existingSlot = ["team1", "team2"].flatMap(team => nextMatch[team].map((playerId, index) => ({ team, index, playerId }))).find(item => item.playerId === id);
        nextMatch[teamKey][slot] = id;
        if (existingSlot) nextMatch[existingSlot.team][existingSlot.index] = oldId;
        const gender = playerId => normalizeGender(players.find(p => p.id === playerId)?.gender);
        const validMixed = [nextMatch.team1, nextMatch.team2].every(team => team.some(pid => gender(pid) === "male") && team.some(pid => gender(pid) === "female"));
        const allIds = [...nextMatch.team1, ...nextMatch.team2];
        const femaleIds = allIds.filter(pid => gender(pid) === "female");
        const maleIds = allIds.filter(pid => gender(pid) === "male");
        const femaleWeights = femaleIds.map(pid => TIER_WEIGHT[players.find(p => p.id === pid)?.tier] || TIER_WEIGHT.E);
        const validAdjustedSame = femaleIds.length > 0 && maleIds.length > 0 && maleIds.every(pid => {
          const maleWeight = TIER_WEIGHT[players.find(p => p.id === pid)?.tier] || TIER_WEIGHT.E;
          return maleWeight <= Math.max(...femaleWeights) && Math.min(...femaleWeights.map(w => Math.abs(w - maleWeight))) <= 100;
        });
        const validSame = allIds.every(pid => gender(pid) === "male") || allIds.every(pid => gender(pid) === "female") || validAdjustedSame;
        if ((autoRoundPreview.roundMode === "mixed" && !validMixed) || (autoRoundPreview.roundMode === "same" && !validSame)) {
          showNotify(autoRoundPreview.roundMode === "mixed" ? "Tiap tim harus berisi 1 pria dan 1 wanita." : "Gunakan gender sama, atau pria tier rendah yang dekat dengan tier wanita.", "error");
          return;
        }
        nextMatch.genderAdjusted = autoRoundPreview.roundMode === "same" && validAdjustedSame;
        const weight = team => team.reduce((sum, pid) => sum + (TIER_WEIGHT[players.find(p => p.id === pid)?.tier] || TIER_WEIGHT.E), 0);
        nextMatch.diff = Math.abs(weight(nextMatch.team1) - weight(nextMatch.team2));
        setAutoRoundPreview(prev => {
          const next = { ...prev, matches: prev.matches.map(m => m.scheduleNo === scheduleNo ? nextMatch : m) };
          setLockedAutoRoundsBySession(saved => ({ ...saved, [currentSessionId]: next }));
          return next;
        });
        setAutoRoundVariantCache({});
      };

      const handleConfirmAutoRounds = () => {
